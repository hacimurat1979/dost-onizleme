<title>Ayna Metaforu — Dost Arabi</title>
<style>
:root{--bg:#090B12;--surface:#10121C;--border:#242840;--text:#E4E0D4;--muted:#666880;--gold:#E8C060;--blue:#5888C8;--liminal:#8868A0;--panel:#12141E}
@media(prefers-color-scheme:light){:root{--bg:#F2F4F8;--surface:#E8EAF0;--border:#C0C4D8;--text:#181820;--muted:#606888;--panel:#E0E4EE;--gold:#8C6800;--blue:#2848A0;--liminal:#5840A0}}
:root[data-theme=dark]{--bg:#090B12;--surface:#10121C;--border:#242840;--text:#E4E0D4;--muted:#666880;--panel:#12141E;--gold:#E8C060;--blue:#5888C8;--liminal:#8868A0}
:root[data-theme=light]{--bg:#F2F4F8;--surface:#E8EAF0;--border:#C0C4D8;--text:#181820;--muted:#606888;--panel:#E0E4EE;--gold:#8C6800;--blue:#2848A0;--liminal:#5840A0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:2rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.2rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.06em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65;max-width:480px}
.btns{display:flex;gap:.4rem;margin-bottom:1.3rem;align-items:center}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:.3rem .9rem;border-radius:2rem;cursor:pointer;font:inherit;font-size:.82rem;transition:.2s}
.btn.on,.btn:hover{background:var(--liminal);color:#fff;border-color:var(--liminal)}
.btn.lang{padding:.3rem .7rem}
.sep{color:var(--border);font-size:.85rem}
.vis-wrap{position:relative;width:min(580px,96vw);margin-bottom:1.4rem}
.main-svg{width:100%;display:block}
#cv{display:none;width:100%;border-radius:8px}
.m3d .main-svg{display:none}
.m3d #cv{display:block}
.pairs{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;width:100%;max-width:700px;margin-bottom:1rem}
.pair{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.85rem .95rem;min-width:148px;flex:1;cursor:pointer;transition:border-color .2s,background .2s}
.pair:hover,.pair.on{border-color:var(--liminal);background:var(--surface)}
.pair-top{display:flex;align-items:center;gap:.35rem;margin-bottom:.45rem;font-size:.78rem}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dg{background:var(--gold)}
.db{background:var(--blue)}
.dl{background:var(--liminal);box-shadow:0 0 6px var(--liminal)}
.arr{color:var(--muted);font-size:.75rem}
.pair-label{font-size:.82rem;color:var(--text);line-height:1.5}
.pair-note{font-size:.74rem;color:var(--muted);font-style:italic;margin-top:.3rem;line-height:1.5}
.qbox{width:100%;max-width:700px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:1rem 1.15rem;margin-bottom:.8rem;min-height:80px}
.qbox blockquote{font-size:.9rem;font-style:italic;line-height:1.8;border-left:2px solid var(--liminal);padding-left:.8rem}
.qbox .src{font-size:.73rem;color:var(--muted);margin-top:.4rem}
.qbox .hint{font-size:.82rem;color:var(--muted);font-style:italic}
.paradox{width:100%;max-width:700px;text-align:center;font-size:.8rem;color:var(--muted);font-style:italic;line-height:1.7;margin-bottom:.7rem;white-space:pre-line}
.footer-hint{font-size:.76rem;color:var(--muted);font-style:italic;text-align:center}
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.72}}
.shimmer{animation:shimmer 2.6s ease-in-out infinite}
@keyframes float-s{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.float-s{animation:float-s 3.2s ease-in-out infinite}
</style>
</head>

const PD={
  p1:{
    tr:{q:'"Zât, bilinme arzusuyla şehâdet âlemini yarattı, ama bu âlem tam cilâlı bir ayna olmadığından Âdem\'in yaratılışı bu aynanın \'cilâsı\' oldu. Yalnız câmi\' (her şeyi toplayan) ayna, kendisine tecellî edeni tanıyabilir."',src:"Füsûsü'l-Hikem — Konuk şerhi (insan-i-kamil)"},
    en:{q:'"The Essence created the manifest world from a desire to be known, but this world was not a perfectly polished mirror, so the creation of Adam became the \'polishing\' of that mirror. Only the all-comprehensive mirror can recognize the one who manifests within it."',src:'Fusûs al-Hikam — Konuk commentary (insan-i-kamil)'},
    pt:{q:'"A Essência criou o mundo manifesto pelo desejo de ser conhecida, mas este mundo não era um espelho perfeitamente polido, então a criação de Adão tornou-se o \'polimento\' daquele espelho. Somente o espelho que tudo abrange pode reconhecer Aquele que nele se manifesta."',src:'Fusûs al-Hikam — comentário de Konuk (insan-i-kamil)'},

  p2:{
    tr:{q:'"Hak âlemin aynasıdır. O aynada âlemin sûretleri ortaya çıkmış, mümkünler kendilerini varlığı zorunlu Hakkın aynasında görmüşlerdir. Mümkünler var olmada Allah\'a bağlı oldukları gibi O da kendisini bilmede mümkünler hakkındaki bilgiye dayanmıştır."',src:"Fütûhât — 415. Bölüm (c15k169): \"Ayna Ters Çevriliyor\""},

let curLang='tr',curMode='2d',curPair=null;

function dc(d){return d==='g'?'gold':d==='b'?'blue':'liminal';}

function setLang(l){
  curLang=l;
  ['btr','ben','bpt'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById('b'+l).classList.add('on');
  const d=LA[l];
  document.getElementById('hTitle').textContent=d.title;
  document.getElementById('hSub').textContent=d.sub;
  for(let i=1;i<=16;i++){
    const el=document.getElementById('s'+i);
    if(el&&d['s'+i]!==undefined) el.textContent=d['s'+i];
  }
  renderPairs(l);
  const qh=document.getElementById('qhint');
  if(qh) qh.textContent=d.hint;
  if(curPair) showQuote(curPair);
  document.getElementById('paradox').textContent=d.paradox;
  document.getElementById('footer').textContent=d.footer;
  if(curMode==='3d') draw3d();
}

function renderPairs(l){
  const d=LA[l];
  document.getElementById('pairs').innerHTML=d.pairs.map(p=>`
    <div class="pair" id="${p.id}" onclick="selectPair('${p.id}')">
      <div class="pair-top">
        <span class="dot d${p.d1}"></span>
        <span style="font-size:.72rem;color:var(--${dc(p.d1)})">${p.t1}</span>
        <span class="arr">⇔</span>
        <span class="dot d${p.d2}"></span>
        <span style="font-size:.72rem;color:var(--${dc(p.d2)})">${p.t2}</span>
      </div>
      <div class="pair-label">${p.label}</div>
      <div class="pair-note">${p.note}</div>
    </div>`).join('');
  if(curPair) document.getElementById(curPair)?.classList.add('on');
}

function showQuote(id){
  const pd=PD[id][curLang];
  document.getElementById('qbox').innerHTML=
    `<blockquote>${pd.q}</blockquote><div class="src">${pd.src}</div>`;
}

function selectPair(id){
  if(curPair===id){
    curPair=null;
    document.querySelectorAll('.pair').forEach(p=>p.classList.remove('on'));
    document.getElementById('qbox').innerHTML=
      `<span class="hint" id="qhint">${LA[curLang].hint}</span>`;
    if(curMode==='3d') draw3d();
    return;
  }
  curPair=id;
  document.querySelectorAll('.pair').forEach(p=>p.classList.toggle('on',p.id===id));
  showQuote(id);
  if(curMode==='3d') draw3d();
}

function setMode(m){
  curMode=m;
  const vw=document.getElementById('vw');
  if(m==='3d'){
    vw.classList.add('m3d');
    document.getElementById('b3d').classList.add('on');
    document.getElementById('b2d').classList.remove('on');
    startAnim();
  } else {
    vw.classList.remove('m3d');
    document.getElementById('b2d').classList.add('on');
    document.getElementById('b3d').classList.remove('on');
    stopAnim();
  }
}

function startAnim(){
  if(animId) return;
  (function loop(){ t3d+=0.009; draw3d(); animId=requestAnimationFrame(loop); })();
}
function stopAnim(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

// ── 3D canvas ─────────────────────────────────────────────────────────────────
function draw3d(){
  const cv=document.getElementById('cv');
  if(!cv.getContext) return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,CW,CH);
  const lang=LA[curLang];
  const pulse=0.5+0.5*Math.sin(t3d*0.85);
  const flt=Math.sin(t3d*0.9)*2.8;
  const bakY=BkY+flt*0.6;   // Bakan floats gently
  const suretY=SrY+flt;     // Sûret floats more
  const rflt=flt*0.65;      // reflection mirrors Bakan's float

  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,CW,CH); ctx.clip();

  // ── 0. Mirror floor shadow ──
  const floorY=MFY+MFH+18;
  const shad=ctx.createRadialGradient(MCX,floorY,0,MCX,floorY,58);
  shad.addColorStop(0,'rgba(0,0,0,0.20)');
  shad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.ellipse(MCX,floorY,52,9,0,0,Math.PI*2);
  ctx.fillStyle=shad; ctx.fill();

  // ── 1. Mirror stand ──
  ctx.save();
  ctx.lineCap='round'; ctx.lineWidth=5;
  ctx.strokeStyle='rgba(110,88,44,0.82)';
  ctx.beginPath(); ctx.moveTo(MCX,MFY+MFH); ctx.lineTo(MCX-28,floorY-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MCX,MFY+MFH); ctx.lineTo(MCX+28,floorY-2); ctx.stroke();
  ctx.restore();

  // ── 2. Mirror glass (clipped) ──
  ctx.save();
  ctx.beginPath(); ctx.rect(GX,GY,GW,GH); ctx.clip();

  const glass=ctx.createLinearGradient(GX,0,GX+GW,0);
  glass.addColorStop(0,'rgba(50,70,135,0.20)');
  glass.addColorStop(0.28,'rgba(90,122,208,0.40)');
  glass.addColorStop(0.50,'rgba(138,172,248,0.52)');
  glass.addColorStop(0.72,'rgba(90,122,208,0.40)');
  glass.addColorStop(1,'rgba(50,70,135,0.20)');
  ctx.fillStyle=glass; ctx.fillRect(GX,GY,GW,GH);

  // Reflection halo
  const refActive=curPair==='p1';
  const rHaloR=RefR*(refActive?2.5:2.1+0.2*pulse);
  const rHalo=ctx.createRadialGradient(MCX,MCY+rflt,0,MCX,MCY+rflt,rHaloR);
  rHalo.addColorStop(0,'rgba(225,183,55,0.20)'); rHalo.addColorStop(1,'rgba(225,183,55,0)');
  ctx.beginPath(); ctx.arc(MCX,MCY+rflt,rHaloR,0,Math.PI*2); ctx.fillStyle=rHalo; ctx.fill();

  // Reflection sphere (dimmer, slight blue tint)
  const rfg=ctx.createRadialGradient(MCX-9,MCY+rflt-11,4,MCX,MCY+rflt,RefR);
  rfg.addColorStop(0,'rgba(238,224,172,0.74)');
  rfg.addColorStop(0.5,'rgba(182,148,50,0.56)');
  rfg.addColorStop(0.84,'rgba(88,102,175,0.32)');
  rfg.addColorStop(1,'rgba(38,52,135,0)');
  ctx.beginPath(); ctx.arc(MCX,MCY+rflt,RefR,0,Math.PI*2); ctx.fillStyle=rfg; ctx.fill();
  if(refActive){ ctx.strokeStyle='rgba(238,192,70,0.38)'; ctx.lineWidth=1.8; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(MCX-10,MCY+rflt-13,7,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();

  // Reflection label (Bakan name, dimmed)
  ctx.save();
  ctx.font='9.5px Georgia,serif'; ctx.fillStyle='rgba(215,190,140,0.68)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lang.d3bakan, MCX, MCY+rflt+RefR+13);
  ctx.restore();

  // Glass highlight streaks
  ctx.beginPath(); ctx.moveTo(GX+8,GY); ctx.lineTo(GX+8,GY+GH);
  ctx.strokeStyle='rgba(218,230,255,0.09)'; ctx.lineWidth=5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(GX+17,GY); ctx.lineTo(GX+17,GY+GH);
  ctx.strokeStyle='rgba(218,230,255,0.05)'; ctx.lineWidth=2; ctx.stroke();

  // Ayna label
  ctx.save();
  ctx.font=`italic 10.5px Georgia,serif`;
  ctx.fillStyle=`rgba(148,178,245,${0.36+0.1*pulse})`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lang.d3ayna, MCX, GY+GH-15);
  ctx.restore();

  ctx.restore(); // end glass clip

  // ── 3. Mirror frame ──
  ctx.fillStyle='rgba(118,95,50,0.90)';
  ctx.fillRect(MFX,MFY,MFW,MFB);           // top bar
  ctx.fillRect(MFX,MFY+MFH-MFB,MFW,MFB);  // bottom bar
  ctx.fillRect(MFX,MFY,MFB,MFH);           // left bar
  ctx.fillRect(MFX+MFW-MFB,MFY,MFB,MFH);  // right bar
  ctx.strokeStyle='rgba(192,162,92,0.48)'; ctx.lineWidth=1.5; ctx.strokeRect(GX,GY,GW,GH);
  ctx.strokeStyle='rgba(58,42,16,0.55)'; ctx.lineWidth=1; ctx.strokeRect(MFX,MFY,MFW,MFH);

  // ── 4. Depth shadow (left side → 3D standing feel) ──
  const dep=ctx.createLinearGradient(MFX-12,0,MFX+5,0);
  dep.addColorStop(0,'rgba(0,0,0,0)'); dep.addColorStop(1,'rgba(0,0,0,0.22)');
  ctx.fillStyle=dep; ctx.fillRect(MFX-12,MFY,18,MFH);

  if(curPair==='p2'){
    ctx.strokeStyle='rgba(148,182,255,0.46)'; ctx.lineWidth=2.2; ctx.strokeRect(MFX,MFY,MFW,MFH);
  }

  // ── 5. Sûret (berzah, liminal) ──
  const sAct=curPair==='p3', sR=sAct?35:SrR;
  const sg=ctx.createRadialGradient(SrX,suretY,0,SrX,suretY,sR);
  sg.addColorStop(0,sAct?'rgba(222,168,255,0.92)':'rgba(208,152,255,0.82)');
  sg.addColorStop(0.5,'rgba(142,88,218,0.52)');
  sg.addColorStop(1,'rgba(70,42,148,0)');
  ctx.beginPath(); ctx.arc(SrX,suretY,sR,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
  if(sAct){
    ctx.beginPath(); ctx.arc(SrX,suretY,sR+5,0,Math.PI*2);
    ctx.strokeStyle='rgba(198,142,255,0.28)'; ctx.lineWidth=2.5; ctx.stroke();
  }
  const si=ctx.createRadialGradient(SrX,suretY,0,SrX,suretY,12);
  si.addColorStop(0,'rgba(244,212,255,0.72)'); si.addColorStop(1,'rgba(198,152,255,0)');
  ctx.beginPath(); ctx.arc(SrX,suretY,12,0,Math.PI*2); ctx.fillStyle=si; ctx.fill();
  ctx.save();
  ctx.font='10.5px Georgia,serif'; ctx.fillStyle='rgba(230,200,255,0.88)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(lang.d3suret, SrX, suretY+1);
  ctx.restore();

  // ── 6. Flow arrows ──
  // tecellî: Bakan → Sûret
  const aY1=BkY-16, aXs1=BkX+BkR+8, aXe1=SrX-sR-8;
  if(aXe1>aXs1+12){
    ctx.save();
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(aXs1,aY1); ctx.lineTo(aXe1,aY1);
    ctx.strokeStyle='rgba(212,178,62,0.58)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(aXe1,aY1); ctx.lineTo(aXe1-7,aY1-4); ctx.lineTo(aXe1-7,aY1+4); ctx.closePath();
    ctx.fillStyle='rgba(212,178,62,0.58)'; ctx.fill();
    ctx.font='italic 8.5px Georgia,serif'; ctx.fillStyle='rgba(192,162,52,0.64)';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(lang.d3tec, (aXs1+aXe1)/2, aY1-3);
    ctx.restore();
  }

  // zuhur: Sûret → mirror
  const aY2=BkY+2, aXs2=SrX+sR+8, aXe2=MFX-5;
  if(aXe2>aXs2+12){
    ctx.save();
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(aXs2,aY2); ctx.lineTo(aXe2,aY2);
    ctx.strokeStyle='rgba(92,146,228,0.52)'; ctx.lineWidth=1.1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(aXe2,aY2); ctx.lineTo(aXe2-7,aY2-4); ctx.lineTo(aXe2-7,aY2+4); ctx.closePath();
    ctx.fillStyle='rgba(92,146,228,0.52)'; ctx.fill();
    ctx.restore();
  }

  // iade: mirror → Bakan
  const aY3=BkY+24, aXs3=MFX-5, aXe3=BkX+BkR+8;
  if(aXs3>aXe3+12){
    ctx.save();
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(aXs3,aY3); ctx.lineTo(aXe3,aY3);
    ctx.strokeStyle='rgba(92,146,228,0.42)'; ctx.lineWidth=1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(aXe3,aY3); ctx.lineTo(aXe3+7,aY3-4); ctx.lineTo(aXe3+7,aY3+4); ctx.closePath();
    ctx.fillStyle='rgba(92,146,228,0.42)'; ctx.fill();
    ctx.restore();
  }

  // ── 7. Bakan sphere ──
  const bAct=curPair==='p1';
  const glowR=BkR*(bAct?2.9:2.2+0.28*pulse);
  const bglow=ctx.createRadialGradient(BkX,bakY,BkR*0.45,BkX,bakY,glowR);
  bglow.addColorStop(0,'rgba(242,200,75,0.20)'); bglow.addColorStop(1,'rgba(242,200,75,0)');
  ctx.beginPath(); ctx.arc(BkX,bakY,glowR,0,Math.PI*2); ctx.fillStyle=bglow; ctx.fill();

  const bg=ctx.createRadialGradient(BkX-15,bakY-18,5,BkX,bakY,BkR);
  bg.addColorStop(0,'#FFFBD2'); bg.addColorStop(0.52,'#ECC850');
  bg.addColorStop(0.87,'#C28E28'); bg.addColorStop(1,'rgba(95,60,12,0.3)');
  ctx.beginPath(); ctx.arc(BkX,bakY,BkR,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=bAct?'rgba(255,220,95,0.48)':'rgba(255,208,72,0.18)';
  ctx.lineWidth=bAct?2:1.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(BkX-16,bakY-19,13,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fill();

  ctx.save();
  ctx.font='bold 12.5px Georgia,serif'; ctx.fillStyle='rgba(242,200,85,0.92)';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(lang.d3bakan, BkX, bakY-BkR-9);
  ctx.restore();

  ctx.restore();
}

// ── Canvas interaction ──
const cvEl=document.getElementById('cv');
cvEl.addEventListener('mousemove',function(e){
  if(curMode!=='3d') return;
  const r=cvEl.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(CW/r.width), my=(e.clientY-r.top)*(CH/r.height);
  const over=(Math.hypot(mx-BkX,my-BkY)<BkR+12)||
             (Math.hypot(mx-SrX,my-SrY)<SrR+12)||
             (mx>=MFX&&mx<=MFX+MFW&&my>=MFY&&my<=MFY+MFH);
  cvEl.style.cursor=over?'pointer':'default';
});
cvEl.addEventListener('click',function(e){
  if(curMode!=='3d') return;
  const r=cvEl.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(CW/r.width), my=(e.clientY-r.top)*(CH/r.height);
  if(Math.hypot(mx-BkX,my-BkY)<BkR+12) selectPair('p1');
  else if(Math.hypot(mx-SrX,my-SrY)<SrR+12) selectPair('p3');
  else if(mx>=MFX&&mx<=MFX+MFW&&my>=MFY&&my<=MFY+MFH) selectPair('p2');
});
function inMirror(mx,my){
  return mx>=MFX&&mx<=MFX+MFW&&my>=MFY&&my<=MFY+MFH;
}

// ── Init ──
setLang('tr');

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>
