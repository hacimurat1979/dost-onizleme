<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Berzah ve hayal — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D13) -->
<title>Berzah — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}

@keyframes berzahCaption{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes berzahHint{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){[data-anim]{animation:none!important}}

#stageWrap{position:relative;width:min(560px,94vw);aspect-ratio:16/10;margin:.4rem auto 1.1rem;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#efe6d6}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;top:10px;right:12px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#6b543a;opacity:0;transition:opacity .5s ease}
body.sahne-bitti #hint{opacity:.6;animation:berzahHint 3s ease-in-out .3s 3}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin:.2rem 0 .6rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--muted);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--liminal);color:var(--text)}

.sahne-metni{list-style:none;margin-top:.7rem;font-size:.78rem;color:var(--muted);line-height:1.7}

@media(prefers-reduced-motion:no-preference){
  #berzahEsikVurgu.nefes-al{animation:berzahNefes 7s ease-in-out infinite}
}
@keyframes berzahNefes{0%,100%{opacity:.05}50%{opacity:.14}}

.track-wrap{width:min(480px,92vw);margin:0 auto 1.1rem;text-align:center;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .track-wrap{opacity:1;max-height:160px}
.track-labels3{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.track-labels3 span{max-width:120px;line-height:1.35}

#stageWrap input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;width:min(480px,92vw);max-width:100%;height:44px;padding:0;margin:0 auto;display:block;cursor:pointer}
.track-wrap input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:44px;padding:0;margin:0;cursor:pointer}
.track-wrap input[type="range"]::-webkit-slider-runnable-track{height:2px;background:var(--border);border-radius:2px}
.track-wrap input[type="range"]::-moz-range-track{height:2px;background:var(--border);border-radius:2px}
.track-wrap input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal);margin-top:-10px}
.track-wrap input[type="range"]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal)}
.track-wrap input[type="range"]:focus{outline:none}
.track-wrap input[type="range"]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--liminal);outline-offset:3px}
.track-wrap input[type="range"]:focus-visible::-moz-range-thumb{outline:2px solid var(--liminal);outline-offset:3px}

.caption{margin-top:.7rem;font-size:.85rem;line-height:1.65;color:var(--text);opacity:0;transition:opacity .8s ease,transform .8s ease;transform:translateY(4px)}
.caption.gorunur{opacity:1;transform:none}

.quote-box{width:min(560px,96vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .quote-box{opacity:1;max-height:900px}
.quote-text{font-size:.88rem;line-height:1.75;font-style:italic}
.quote-src{font-size:.72rem;color:var(--muted);margin-top:.55rem}

/* Berzah'a tam durunca (Yakınsama Deseni, 2026-08-14): üç tanıklık artık
   sırayla değil birlikte görünür -- aynı eşiği üç ayrı açıdan doğruluyorlar. */
.quote-eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--liminal);margin-bottom:.7rem}
.quote-all-item{margin-bottom:.9rem}
.quote-all-item:last-child{margin-bottom:0}
.quote-all-item .quote-text{margin-bottom:.3rem}
#quoteSingle,#quoteAll{transition:opacity .6s ease}
@media(prefers-reduced-motion:reduce){#quoteSingle,#quoteAll{transition:none}}

.kardes{width:min(560px,96vw);text-align:center;margin-top:1.1rem;font-size:.75rem;line-height:1.6}
.kardes a{color:var(--liminal);text-decoration:none;border-bottom:1px solid var(--border)}
.kardes a:hover,.kardes a:focus-visible{border-bottom-color:var(--liminal)}

.yontem{width:min(560px,96vw);margin-top:1.4rem;font-size:.74rem;line-height:1.7;color:var(--muted);text-align:center}
.yontem a{color:var(--liminal)}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="hTitle">Berzah</h1>

</header>

<div id="stageWrap">
  <svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="İki alan ve aralarında hiçbir zaman çizgi olarak çizilmeyen, genişleyen bir eşik">
    <defs>
      <linearGradient id="berzahGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="berzahS0" offset="0%" stop-color="#f3e7c9"></stop>
        <stop id="berzahS1" offset="99%" stop-color="#f3e7c9"></stop>
        <stop id="berzahS2" offset="100%" stop-color="#3b2c17"></stop>
        <stop id="berzahS3" offset="100%" stop-color="#3b2c17"></stop>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1600" height="1000" fill="url(#berzahGrad)"></rect>
    <rect id="berzahEsikVurgu" x="0" y="490" width="1600" height="20" fill="#fff" opacity="0"></rect>
  </svg>
  <div id="hint" aria-hidden="true"></div>
</div>

<p class="caption" id="caption" aria-live="polite"></p>
<div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>

<div class="track-wrap">
  <div class="track-labels3">
    <span id="labelLeft"></span>
    <span id="labelMid"></span>
    <span id="labelRight"></span>
  </div>
  <input id="slider" type="range" min="0" max="100" value="0" aria-label="Mertebe" disabled>
</div>

<div class="quote-box" id="quoteBox">
  <p class="quote-eyebrow" id="quoteEyebrow" hidden></p>
  <div id="quoteSingle">
    <p class="quote-text" id="quoteText"></p>
    <p class="quote-src" id="quoteSrc"></p>
  </div>

  <ol class="sahne-metni" id="sahneMetni"></ol>
</div>

<p class="kardes"><a id="kardesLink" href="perde-zinciri.html"></a></p>

<p class="yontem" id="yontem"></p>

<!-- i18n.js önce yüklenmeli: sahne-motoru.js modül-yükleme anında
     window.DostI18n.pick3'ü okuyor (2026-08-15 bulgusu, bkz. hayret.html/
     kandil.html/kalbe-sigan.html/nefes-i-rahmani.html aynı düzeltme). -->
<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script>
const LA={
  tr:{
    title:'Berzah',
    sub:'Dost, dünya ile âhiret arasına üçüncü bir mertebe koyuyor: berzah — dünya bir uykudur, berzah ondan uyanmış olma hâli, âhiret ise hiç uyku içermeyen uyanıklık. İki alan var, ama aralarındaki sınır hiçbir zaman bir çizgi olarak görünmez.',

    mid:'Berzah',
    right:'Uyanıklık',
    caption:'İki alan hiç karışmıyor; yalnız aralarındaki eşik genişliyor. Berzahtan bakınca iki taraf da aynı anda görünür — sınırın kendisi bir yer değildir.',

    yontem:'Üçlü sıralama (dünya–berzah–âhiret) Dost’un kendi cümlesi. İki yatay alan ve aralarında genişleyen bir eşik (çizgi değil) ise bizim okumamız — sahneye onu biz ekledik; metin bunu böyle söylemiyor.',

      {text:'"İnsanlar uykudadır, öldüklerinde uyanırlar."', src:'Hz. Peygamber’e nispet edilen söz — Dost bu üçlü kademelenmeyi onun üzerine kuruyor (a.g.e., s. 447)'},
      {text:'"Aynadaki suret, berzahî (ara bölgeye ait) bir bedendir."', src:'Fütûhât-ı Mekkiyye, Cilt I, s. 290'},
    ],
  },
  en:{
    title:'The Barzakh',
    sub:'Dost places a third degree between this world and the afterlife: the barzakh — this world is a sleep, the barzakh is being awake from it, the afterlife is a wakefulness containing no sleep at all. There are two realms, but the boundary between them never appears as a line.',
    sliderLabel:'Drag the threshold between the two realms',
    hint:'The scene has settled — now drag the threshold yourself',
    left:'Sleep',
    mid:'Berzah',
    right:'Waking',
    caption:'The two realms never mix; only the threshold between them widens. Seen from the barzakh, both sides show at once — the boundary itself is not a place.',
    kardes:'Sibling scene: Chain of Veiling — every veil parts, and the centre still does not resolve →',
    yontem:'The triad (world–barzakh–afterlife) is Dost’s own sentence. Two horizontal realms with a widening threshold (not a line) between them is our reading — we added it to the scene; the text does not put it this way.',

      {text:'"So this world, relative to the barzakh, is sleep within sleep. For the barzakh is nearer to the real situation."', src:'al-Futuhat al-Makkiyya, Vol. II, Part XXVIII — Chapter Sixty-Four, p. 447'},
      {text:'"People are asleep; when they die, they awaken."', src:'A saying attributed to the Prophet — Dost builds this three-part hierarchy upon it (ibid., p. 447)'},
      {text:'"The image in the mirror is a barzakhi body."', src:'al-Futuhat al-Makkiyya, Vol. I, p. 290'},
    ],
  },
  pt:{
    title:'O Barzakh',
    sub:'Dost coloca um terceiro grau entre este mundo e a vida futura: o barzakh — este mundo é um sono, o barzakh é estar desperto dele, a vida futura é uma vigília que não contém sono algum. Há dois domínios, mas o limite entre eles nunca aparece como uma linha.',
    sliderLabel:'Arraste o limiar entre os dois domínios',
    hint:'A cena parou — agora arraste você mesmo o limiar',
    left:'Sono',
    mid:'Berzah',
    right:'Vigília',

    kardes:'Cena irmã: Cadeia de Véus — todos os véus se afastam, e o centro ainda não se resolve →',
    yontem:'A tríade (mundo–barzakh–vida futura) é a própria frase de Dost. Dois domínios horizontais com um limiar que se alarga (não uma linha) entre eles é a nossa leitura — nós a acrescentamos à cena; o texto não diz isso assim.',
    quoteAllLabel:'Três testemunhos, no mesmo limiar',
    quotes:[
      {text:'"Portanto este mundo, em relação ao barzakh, é sono dentro do sono. Pois o barzakh está mais próximo da situação real."', src:'al-Futuhat al-Makkiyya, Vol. II, Parte XXVIII — Capítulo Sexagésimo Quarto, p. 447'},
      {text:'"As pessoas estão dormindo; quando morrem, despertam."', src:'Dito atribuído ao Profeta — Dost constrói esta hierarquia tripla sobre ele (ibid., p. 447)'},
      {text:'"A imagem no espelho é um corpo barzakhi."', src:'al-Futuhat al-Makkiyya, Vol. I, p. 290'},
    ],
  },
};

let curLang='tr';
let quoteIdx=0;
const $=id=>document.getElementById(id);

// Berzah'a tam durunca (Yakınsama Deseni, 2026-08-14): tek tek dönen üç
// tanıklık, birlikte görünen üçe dönüşür -- aynı eşiği doğruluyorlar.
// Yeni alıntı yok, KUNYE'deki üçü olduğu gibi yeniden düzenleniyor.
let atBerzah=false;

function renderQuoteSingle(){
  const q=LA[curLang].quotes[quoteIdx];
  $('quoteText').textContent=q.text;
  $('quoteSrc').textContent=q.src;
}
function renderQuoteAll(){
  $('quoteEyebrow').textContent=LA[curLang].quoteAllLabel;
  const wrap=$('quoteAll');
  wrap.innerHTML='';
  LA[curLang].quotes.forEach(q=>{
    const item=document.createElement('div'); item.className='quote-all-item';
    const p1=document.createElement('p'); p1.className='quote-text'; p1.textContent=q.text;
    const p2=document.createElement('p'); p2.className='quote-src'; p2.textContent=q.src;
    item.appendChild(p1); item.appendChild(p2);
    wrap.appendChild(item);
  });
}
function setBerzahState(on){
  if(on===atBerzah){ if(on) renderQuoteAll(); return; }
  atBerzah=on;
  $('quoteEyebrow').hidden=!on;
  $('quoteSingle').hidden=on;
  $('quoteAll').hidden=!on;
  if(on){ stopRotate(); renderQuoteAll(); }
  else { startRotate(); renderQuoteSingle(); }
}

function renderAll(){
  const t=LA[curLang];
  $('hTitle').textContent=t.title;
  $('hSub').textContent=t.sub;
  $('slider').setAttribute('aria-label',t.sliderLabel);
  $('hint').textContent=t.hint;
  $('labelLeft').textContent=t.left;
  $('labelMid').textContent=t.mid;
  $('labelRight').textContent=t.right;
  if(sonMetin) $('caption').textContent=sonMetin[curLang]||sonMetin.tr;
  $('yontem').textContent=t.yontem;
  $('kardesLink').textContent=t.kardes;
  if(atBerzah) renderQuoteAll(); else renderQuoteSingle();
  if(typeof sahneMetniniGuncelle==='function') sahneMetniniGuncelle();
}
let sonMetin=null;
function setLang(l){ if(LA[l]){ curLang=l; document.documentElement.lang=l; renderAll(); } }

let rotateTimer=null;
function startRotate(){
  if(rotateTimer||atBerzah||!document.body.classList.contains('sahne-bitti')) return;
  rotateTimer=setInterval(()=>{
    quoteIdx=(quoteIdx+1)%LA[curLang].quotes.length;
    renderQuoteSingle();
  }, 9000);
}
function stopRotate(){ if(rotateTimer){ clearInterval(rotateTimer); rotateTimer=null; } }

// ── Sahne: iki alan, hiç çizgi olmayan bir eşik ─────────────────────────────
// GORSEL_DIL.md: kavramı resmetme, davranışını resmet. Sınır hiçbir zaman
// keskin bir çizgi olarak çizilmiyor -- iki renk arasında dört durgulu bir
// linearGradient, aradaki geçiş kuşağının GENİŞLİĞİ (esikGenislik) ölçü
// ölçü büyüyor; "yaklaşınca çizgi olmadığı görülür" burada budur.
const slider=$('slider');
const hint=$('hint');
const s1=$('berzahS1'), s2=$('berzahS2');
const esikVurgu=$('berzahEsikVurgu');

function uygulaGorunum(altYukseklik, esikGenislik){
  const sinirY=1-altYukseklik; // 1=alt tamamen gizli, 0.5=iki alan eşit
  const ustOfs=Math.max(0, sinirY-esikGenislik)*100;
  const altOfs=Math.min(1, sinirY+esikGenislik)*100;
  s1.setAttribute('offset', ustOfs.toFixed(2)+'%');
  s2.setAttribute('offset', altOfs.toFixed(2)+'%');
  esikVurgu.setAttribute('y', (ustOfs/100*1000).toFixed(1));
  esikVurgu.setAttribute('height', Math.max(2,(altOfs-ustOfs)/100*1000).toFixed(1));
  return { sinirY, ustOfs, altOfs };
}
uygulaGorunum(0,0.01);

// Kendim gezineyim kipi (sahne bittikten sonra): tek kaydırıcı, motorun
// kendi yolculuğunu (0=yalnız üst alan .. 50=berzah .. 100=eşik iyice
// genişler) sürekli olarak tekrar yaşatır.
function apply(v){
  const t=v/100;
  const altYukseklik=Math.min(0.5, t*1.0);
  const esikGenislik=0.01+Math.max(0,t-0.4)/0.6*0.19;
  uygulaGorunum(altYukseklik, esikGenislik);
  setBerzahState(esikGenislik>0.1);
}

slider.addEventListener('input',e=>{
  if(!document.body.classList.contains('sahne-bitti')) return;
  apply(+e.target.value);
  if(hint) hint.style.animation='none';
});

// ── Ölçü hedef_hal'leri kümülatiftir -- sonHal deseni, bkz. hayret.html/
// kandil.html/kalbe-sigan.html/nefes-i-rahmani.html. ────────────────────────
let sonHal={};
function uygulaHal(hamHal){
  sonHal=Object.assign({}, sonHal, hamHal);
  const hal=sonHal;
  const altYukseklik=hal.altYukseklik!==undefined?hal.altYukseklik:0;
  const esikGenislik=hal.esikGenislik!==undefined?hal.esikGenislik:0.01;
  uygulaGorunum(altYukseklik, esikGenislik);
  esikVurgu.classList.toggle('nefes-al', !!hal.nefes);
  setBerzahState(esikGenislik>0.1);
}

let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniKur(){
  if(sahneMetniEl) return;
  sahneMetniEl=$('sahneMetni');
}
function sahneMetniniGuncelle(){
  if(!sahneMetniEl||!partisyonRef) return;
  sahneMetniEl.innerHTML='';
  partisyonRef.olcuLer.forEach(function(o){
    if(!o.metin) return;
    const li=document.createElement('li');
    li.textContent=o.metin[curLang]||o.metin.tr;
    sahneMetniEl.appendChild(li);
  });
}

function metinYaz(m){
  sonMetin=m;
  const t=m?(m[curLang]||m.tr||''):'';
  const cap=$('caption');
  cap.classList.remove('gorunur');
  window.setTimeout(function(){
    cap.textContent=t;
    if(t) cap.classList.add('gorunur');
  }, t?150:0);
}

let motorAPI=null;
(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/berzah.json').then(function(r){ return r.json(); }).then(function(p){
    partisyonRef=p;
    sahneMetniniKur();
    sahneMetniniGuncelle();
    motorAPI=window.__sahneMotoru.yarat({
      container:$('stageWrap'), partisyon:p,
      applyOlcu:function(o){ uygulaHal(o.hedef_hal||{}); },
      metinGoster:metinYaz,
      olcuGoster:function(i,t){ $('olcuGosterge').textContent=(i+1)+' / '+t; },
      biterEl:$('motorBiter'),
      tepki:function(ev){
        if(ev.tip==='bitti'){
          document.body.classList.add('sahne-bitti');
          slider.disabled=false;
          startRotate();
        }
      },
    });
  });
})();

$('stageWrap').setAttribute('tabindex','0');
$('stageWrap').addEventListener('keydown', function(e){
  if(!motorAPI || e.target===slider) return;
  if(e.key===' '){ e.preventDefault(); if(motorAPI.durum==='oynuyor') motorAPI.pause(); else if(motorAPI.durum==='durakli') motorAPI.resume(); return; }
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return;
  e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0, Math.min(motorAPI.olcuSayisi-1, motorAPI.aktifIdx+y)));
});

renderAll();

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
