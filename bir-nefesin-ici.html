<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Bir Nefesin İçi — Dost Arabi görselleştirme. -->
<title>Bir Nefesin İçi — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}

#stageWrap{position:relative;width:min(920px,92vw);margin:.4rem auto 1rem}
#stage{width:100%;aspect-ratio:16/10;display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage:focus-visible{outline:2px solid var(--liminal);outline-offset:3px}

#durakEtiketi{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(-50% - 90px));
  font-size:clamp(14px,1.6vw,20px);letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap}

#ipucu{position:absolute;top:14px;right:16px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);opacity:0;transition:opacity .5s ease}
body.sahne-bitti #ipucu{opacity:.55;animation:bn-pulse 3s ease-in-out .3s 3}
@keyframes bn-pulse{0%,100%{opacity:.55}50%{opacity:1}}

.caption{width:min(640px,92vw);text-align:center;margin:.2rem auto 1.1rem;font-size:.87rem;
  line-height:1.65;color:var(--text);opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease}
.caption.show{opacity:1;transform:none}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.2rem;margin-bottom:.8rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--muted);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--liminal);color:var(--text)}

.sahne-kunye{width:min(560px,96vw);margin:0 auto 1rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye summary:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}
.sahne-metni{list-style:none;margin-top:.7rem}
.sahne-metni li{margin-bottom:.65rem;font-style:italic}

@media(prefers-reduced-motion:no-preference){
  #isik.nefes-al,#isikHalesi.nefes-al{animation:bnNefes 7s ease-in-out infinite}
}
@keyframes bnNefes{0%,100%{opacity:1}50%{opacity:.78}}

@media(prefers-reduced-motion:reduce){#ipucu{animation:none}}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="hTitle">Bir Nefesin İçi</h1>
</header>

<div id="stageWrap">
  <svg id="stage" viewBox="0 0 1600 1000" role="slider" tabindex="0"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
       aria-label="Halka boyunca sürükle">
    <defs>
      <radialGradient id="isikGradyan" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--gold)" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="var(--gold)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <path id="sarmalYol" d="" stroke="var(--border)" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round"/>

    <g id="duraklar"></g>
    <g id="form"></g>

    <circle id="isikHalesi" cx="0" cy="0" r="60" fill="url(#isikGradyan)"/>
    <circle id="isik" cx="0" cy="0" r="6" fill="var(--gold)"/>

    <rect id="tutamac" x="0" y="0" width="1600" height="1000" fill="transparent"/>
  </svg>

  <div id="durakEtiketi" aria-live="polite"></div>
  <div id="ipucu"><span id="ipucuMetin"></span></div>
</div>

<p class="caption" id="caption" aria-live="polite"></p>
<div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>

<div id="kunyeYuvasi"></div>

<!-- i18n.js önce yüklenmeli: sahne-motoru.js modül-yükleme anında
     window.DostI18n.pick3'ü okuyor (2026-08-15 bulgusu, bkz. diğer
     motorlanmış sahneler aynı düzeltme). -->
<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script>
const LA = {
  title:   { tr: 'Bir Nefesin İçi', en: 'Inside a Breath', pt: 'Dentro de um Sopro' },
  hint:    { tr: 'Sürükle', en: 'Drag', pt: 'Arraste' },
  slider:  { tr: 'Halka boyunca sürükle', en: 'Drag along the ring', pt: 'Arraste ao longo do anel' },
  kunyeBaslik: { tr: 'Künye — bu sahne nereden geliyor?', en: 'Sources — where this scene comes from', pt: 'Fontes — de onde vem esta cena' },
  nefes:   { tr: 'Nefes',   en: 'Breath',        pt: 'Sopro' },
  harf:    { tr: 'Harf',    en: 'Letter',        pt: 'Letra' },
  kelime:  { tr: 'Kelime',  en: 'Word',          pt: 'Palavra' },
  oz:      { tr: 'Öz',      en: 'Essence',       pt: 'Essência' },
  tecelli: { tr: 'Tecellî', en: 'Manifestation', pt: 'Manifestação' },
  varlik:  { tr: 'Varlık',  en: 'Being',         pt: 'Ser' },
  insan:   { tr: 'İnsan',   en: 'Human',         pt: 'Humano' },
  kalp:    { tr: 'Kalp',    en: 'Heart',         pt: 'Coração' },
};
const STATION_KEYS = ['nefes', 'harf', 'kelime', 'oz', 'tecelli', 'varlik', 'insan', 'kalp'];

// Künye: ontology.json "kalp" düğümü zaten bu sahnenin varış noktasını
// (merkez = kalp) taşıyordu -- yeni bir kaynak icat edilmiyor, var olanı
// alıntılıyor.
const KUNYE_QUOTES = {
  tr:[
    {text:"İnsan-ı Kâmil'in soyut bir ünvan olmaktan çıkıp, her insanın kendi tecrübesinde gerçekleşebileceği yer olarak gösterilir: kalp. Kalp kelimesi Arapçada 'taḳallüb' (durmadan dönüşüm, hâlden hâle geçiş) köküyle akraba - bize göre bu, sabit bir inanca değil, her tecellîyi yeniden kabul edebilen akışkan bir idrake işaret ediyor olabilir.", src:"ontology.json, “kalp”"},
    {text:"Tıpkı bir aynanın üzerine toz kondukça netliğini kaybetmesi ve ancak sürekli silinirse berrak kalması gibi: kalp de gafletin tozundan arındıkça Hakk'ı daha net yansıtır - parlaklığı, sahibinin ona ne kadar özen gösterdiğine bağlıdır.", src:"ontology.json, “kalp” benzetmesi"},
  ],
  en:[
    {text:"This is shown as the place where the Perfect Human ceases to be an abstract title and becomes something realizable in each person's own experience: the heart. The Arabic word qalb shares its root with taqallub — ceaseless transformation, turning from state to state — which, we think, may point not to a fixed belief but to a fluid perception capable of receiving each new disclosure.", src:"ontology.json, “kalp”"},
    {text:"Just as a mirror loses its clarity as dust settles on it, and stays clear only if it is constantly wiped: the heart, too, reflects the Real more clearly the more it is cleared of the dust of heedlessness - its brightness depends on how much care its owner gives it.", src:"ontology.json, “kalp” analogy"},
  ],
  pt:[
    {text:"Isso é mostrado como o lugar onde o Ser Humano Perfeito deixa de ser um título abstrato e se torna algo realizável na experiência de cada pessoa: o coração. A palavra árabe qalb compartilha sua raiz com taqallub — transformação incessante, passagem de um estado a outro — o que, pensamos, talvez aponte não para uma crença fixa, mas para uma percepção fluida capaz de receber cada nova revelação.", src:"ontology.json, “kalp”"},
    {text:"Assim como um espelho perde sua nitidez conforme a poeira se acumula, e só permanece claro se for constantemente limpo: o coração também reflete o Real com mais clareza quanto mais se livra da poeira da negligência - seu brilho depende do quanto seu dono cuida dele.", src:"ontology.json, “kalp” analogia"},
  ],
};

let curLang = 'tr';
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function kunyeOlustur(container, baslikObj){
  const det=document.createElement('details'); det.className='sahne-kunye';
  const sum=document.createElement('summary'); det.appendChild(sum);
  const ol=document.createElement('ol'); ol.className='sahne-metni'; det.appendChild(ol);
  container.appendChild(det);
  return { el:det, guncelle:function(l){
    sum.textContent=(baslikObj&&(baslikObj[l]||baslikObj.tr))||'Künye';
    ol.innerHTML='';
    (KUNYE_QUOTES[l]||KUNYE_QUOTES.tr).forEach(function(q){
      const li=document.createElement('li');
      li.textContent=q.text+' — '+q.src;
      ol.appendChild(li);
    });
  }};
}
const kunye=kunyeOlustur($('kunyeYuvasi'), {tr:LA.kunyeBaslik.tr,en:LA.kunyeBaslik.en,pt:LA.kunyeBaslik.pt});

let sonMetin=null;
function renderText() {
  $('hTitle').textContent = LA.title[curLang];
  $('ipucuMetin').textContent = LA.hint[curLang];
  $('stage').setAttribute('aria-label', LA.slider[curLang]);
  if(sonMetin) $('caption').textContent = sonMetin[curLang]||sonMetin.tr;
  kunye.guncelle(curLang);
  updateLabel();
}
function setLang(l) {
  if (!LA.title[l]) return;
  curLang = l;
  renderText();
}

// ── Geometri: dıştan içe, iki tur atan bir Arşimet sarmalı. ────────────────
const svgNS = 'http://www.w3.org/2000/svg';
const CX = 800, CY = 500;
const rOuter = 380, rInner = 40;
const turns = 2;
const thetaMax = turns * Math.PI * 2;
const pointAt = (t) => {
  const theta = t * thetaMax;
  const r = rOuter - (rOuter - rInner) * t;
  return { x: CX + r * Math.cos(theta - Math.PI / 2), y: CY + r * Math.sin(theta - Math.PI / 2) };
};

// Sarmal yolun kendisini çiz.
const N = 400;
let dAttr = '';
for (let i = 0; i <= N; i++) {
  const p = pointAt(i / N);
  dAttr += (i === 0 ? 'M ' : ' L ') + p.x.toFixed(2) + ' ' + p.y.toFixed(2);
}
$('sarmalYol').setAttribute('d', dAttr);

// Sekiz durak, sarmal üzerinde eşit aralıklarla.
const stationsG = $('duraklar');
const stationTs = STATION_KEYS.map((_, i) => 0.04 + (i / STATION_KEYS.length) * 0.96);
stationTs.forEach((t) => {
  const p = pointAt(t);
  const c = document.createElementNS(svgNS, 'circle');
  c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 3);
  c.setAttribute('fill', 'var(--muted)'); c.setAttribute('opacity', 0.6);
  stationsG.appendChild(c);
});

const formG = $('form');
const lightG = $('isik');
const glowG = $('isikHalesi');
const label = $('durakEtiketi');
const hit = $('tutamac');

// Işığın her durağa yaklaştıkça büründüğü form -- kavramın kendisi değil,
// o kavrama yaklaşırken beliren biçim (GORSEL_DIL.md: davranışı resmet).
const drawForm = (t) => {
  while (formG.firstChild) formG.removeChild(formG.firstChild);
  stationTs.forEach((st, i) => {
    const dt = Math.abs(t - st);
    const nearness = Math.max(0, 1 - dt / 0.08);
    if (nearness < 0.02) return;
    const p = pointAt(st);
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('opacity', nearness.toFixed(3));
    g.setAttribute('transform', `translate(${p.x} ${p.y})`);

    if (i === 0) {
      // Nefes -- dağınık pus.
      for (let k = 0; k < 22; k++) {
        const a = (k / 22) * Math.PI * 2 + i;
        const rr = 8 + ((k * 13) % 22);
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', Math.cos(a) * rr);
        c.setAttribute('cy', Math.sin(a) * rr);
        c.setAttribute('r', 0.9);
        c.setAttribute('fill', 'var(--text)');
        c.setAttribute('opacity', 0.55);
        g.appendChild(c);
      }
    } else if (i === 1) {
      // Harf -- tek çizgi.
      const l = document.createElementNS(svgNS, 'path');
      l.setAttribute('d', 'M -20 6 Q -8 -14 4 -2 Q 12 6 18 -6');
      l.setAttribute('stroke', 'var(--text)'); l.setAttribute('stroke-width', 1.6);
      l.setAttribute('fill', 'none'); l.setAttribute('stroke-linecap', 'round');
      g.appendChild(l);
    } else if (i === 2) {
      // Kelime -- çizgi kümesi.
      for (let k = 0; k < 4; k++) {
        const l = document.createElementNS(svgNS, 'path');
        const ox = -22 + k * 12;
        l.setAttribute('d', `M ${ox} 6 Q ${ox + 3} -8 ${ox + 8} 0 Q ${ox + 11} 6 ${ox + 14} -2`);
        l.setAttribute('stroke', 'var(--text)'); l.setAttribute('stroke-width', 1.4);
        l.setAttribute('fill', 'none'); l.setAttribute('stroke-linecap', 'round');
        g.appendChild(l);
      }
    } else if (i === 3) {
      // Öz -- çekirdek.
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', 0); c.setAttribute('cy', 0); c.setAttribute('r', 6);
      c.setAttribute('fill', 'var(--text)');
      g.appendChild(c);
    } else if (i === 4) {
      // Tecellî -- ince halka.
      const ring = document.createElementNS(svgNS, 'circle');
      ring.setAttribute('cx', 0); ring.setAttribute('cy', 0); ring.setAttribute('r', 16);
      ring.setAttribute('stroke', 'var(--text)'); ring.setAttribute('stroke-width', 1.2);
      ring.setAttribute('fill', 'none');
      g.appendChild(ring);
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        const l = document.createElementNS(svgNS, 'line');
        l.setAttribute('x1', Math.cos(a) * 20); l.setAttribute('y1', Math.sin(a) * 20);
        l.setAttribute('x2', Math.cos(a) * 26); l.setAttribute('y2', Math.sin(a) * 26);
        l.setAttribute('stroke', 'var(--text)'); l.setAttribute('stroke-width', 1);
        g.appendChild(l);
      }
    } else if (i === 5) {
      // Varlık -- dolu daire.
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', 0); c.setAttribute('cy', 0); c.setAttribute('r', 12);
      c.setAttribute('fill', 'var(--text)');
      g.appendChild(c);
    } else if (i === 6) {
      // İnsan -- küçük ayakta duran figür.
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', 'M 0 -14 A 3 3 0 1 1 -0.01 -14 M 0 -10 L 0 6 L -6 16 M 0 6 L 6 16 M 0 -4 L -8 -1 M 0 -4 L 8 -1');
      path.setAttribute('stroke', 'var(--text)'); path.setAttribute('stroke-width', 1.4);
      path.setAttribute('fill', 'none'); path.setAttribute('stroke-linecap', 'round');
      g.appendChild(path);
    } else if (i === 7) {
      // Kalp -- içi boş, merkezli oval-yumuşak form (klişe kalp değil).
      const c = document.createElementNS(svgNS, 'ellipse');
      c.setAttribute('cx', 0); c.setAttribute('cy', 0);
      c.setAttribute('rx', 14); c.setAttribute('ry', 10);
      c.setAttribute('stroke', 'var(--text)'); c.setAttribute('stroke-width', 1.4);
      c.setAttribute('fill', 'none');
      g.appendChild(c);
      const inner = document.createElementNS(svgNS, 'circle');
      inner.setAttribute('cx', 0); inner.setAttribute('cy', 0); inner.setAttribute('r', 2);
      inner.setAttribute('fill', 'var(--text)');
      g.appendChild(inner);
    }
    formG.appendChild(g);
  });
};

let currentT = 0;

function updateLabel() {
  let best = -1, bestDt = 1;
  stationTs.forEach((st, i) => {
    const dt = Math.abs(currentT - st);
    if (dt < bestDt) { bestDt = dt; best = i; }
  });
  if (bestDt < 0.025) {
    label.textContent = LA[STATION_KEYS[best]][curLang] || '';
    label.style.opacity = '1';
  } else {
    label.style.opacity = '0';
  }
}

const setT = (t) => {
  // Sarmal döngüsel değil (r merkeze doğru TEK YÖNDE azalır) -- t=1
  // "mod 1" ile 0'a sarılırsa ışık merkezden dış kenara SIÇRAR (görsel
  // dilde yasak: "hiçbir şey çıktığından hızlı girmez"). Bu yüzden
  // wrap değil clamp: sınırlarda durur, atlamaz.
  currentT = Math.max(0, Math.min(1, t));
  const p = pointAt(currentT);
  lightG.setAttribute('cx', p.x); lightG.setAttribute('cy', p.y);
  glowG.setAttribute('cx', p.x); glowG.setAttribute('cy', p.y);
  // Hâle küçülür sarmal içe kıvrıldıkça -- uzaklık çokluk, derinlik hakikate yaklaşma.
  const g = 60 - (currentT * 32);
  glowG.setAttribute('r', g.toFixed(1));
  const lightR = 6 - currentT * 2;
  lightG.setAttribute('r', lightR.toFixed(2));
  drawForm(currentT);
  updateLabel();
  hit.setAttribute('aria-valuenow', Math.round(currentT * 100));
};

// ── Motor bağlantısı: setT(t) zaten sürekli bir 0-1 değişkenin saf
// fonksiyonuydu. Motor artık t'nin HEDEFİNİ ölçü ölçü veriyor; burada
// nefes-i-rahmani/halk-i-cedid/iki-mertebe ile aynı desen -- süregelen
// bir rAF döngüsü t'yi hedefe yumuşakça yaklaştırıp her karede setT()
// çağırıyor. "Zaman germe" ölçü sürelerinin kendisinde (partisyon) --
// buradaki köprü yalnız aynı geçişi taşıyor. Hareket azaltmada döngü
// hiç başlamıyor, hedef doğrudan uygulanıyor.
let targetT = 0, easeLast = performance.now(), easeRafId = 0;
const easeLoop = (now) => {
  const dt = Math.min(80, now - easeLast); easeLast = now;
  if (Math.abs(targetT - currentT) > 0.0008) setT(currentT + (targetT - currentT) * Math.min(1, dt / 900));
  else if (currentT !== targetT) setT(targetT);
  easeRafId = requestAnimationFrame(easeLoop);
};
const tHedefiVer = (v) => {
  targetT = v;
  if (reduceMotion) setT(v);
};
if (!reduceMotion) easeRafId = requestAnimationFrame(easeLoop);

// ── Sürükleme: merkez etrafındaki açıyla turu tarar -- kendim-gezineyim
// kipi, sahne bitmeden erişilemez (eski "kullanıcı devralana kadar
// kendiliğinden döner" davranışının yerini artık motor aldı). ─────────────
const svgEl = hit.ownerSVGElement;
const toSvg = (clientX, clientY) => {
  const pt = svgEl.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const m = svgEl.getScreenCTM();
  if (!m) return { x: CX, y: CY };
  return pt.matrixTransform(m.inverse());
};
let dragging = false;
let lastAngle = 0;
const angleOf = (x, y) => Math.atan2(y - CY, x - CX);
const bitti = () => document.body.classList.contains('sahne-bitti');

const onDown = (e) => {
  if (!bitti()) return;
  dragging = true;
  $('stage').focus();
  const t = e.touches ? e.touches[0] : e;
  const p = toSvg(t.clientX, t.clientY);
  lastAngle = angleOf(p.x, p.y);
  e.preventDefault();
};
const onMove = (e) => {
  if (!dragging) return;
  const t = e.touches ? e.touches[0] : e;
  const p = toSvg(t.clientX, t.clientY);
  const a = angleOf(p.x, p.y);
  let delta = a - lastAngle;
  if (delta > Math.PI) delta -= Math.PI * 2;
  if (delta < -Math.PI) delta += Math.PI * 2;
  lastAngle = a;
  targetT = currentT + delta / (Math.PI * 2 * turns);
  setT(targetT);
};
const onUp = () => { dragging = false; };

hit.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
hit.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

$('stage').addEventListener('keydown', (e) => {
  if (!bitti()) return;
  let handled = true;
  if (e.key === 'ArrowLeft') targetT = currentT - 1 / 64;
  else if (e.key === 'ArrowRight') targetT = currentT + 1 / 64;
  else handled = false;
  if (handled) { setT(targetT); e.preventDefault(); }
});

function metinYaz(m) {
  sonMetin = m;
  const t = m ? (m[curLang] || m.tr || '') : '';
  $('caption').classList.remove('show');
  window.setTimeout(function () {
    $('caption').textContent = t;
    if (t) $('caption').classList.add('show');
  }, t ? 150 : 0);
}

renderText();
setT(0);

let motorAPI = null;
(function () {
  const base = (window.__dostRouteBase || '');
  fetch((base ? base + '/' : '') + 'data/ibn-arabi/sahne-partisyonlari/bir-nefesin-ici.json').then(function (r) { return r.json(); }).then(function (p) {
    motorAPI = window.__sahneMotoru.yarat({
      container: $('stageWrap'), partisyon: p,
      applyOlcu: function (o) {
        const hal = o.hedef_hal || {};
        if (hal.t !== undefined) tHedefiVer(hal.t);
        lightG.classList.toggle('nefes-al', !!hal.nefes);
        glowG.classList.toggle('nefes-al', !!hal.nefes);
      },
      metinGoster: metinYaz,
      olcuGoster: function (i, t) { $('olcuGosterge').textContent = (i + 1) + ' / ' + t; },
      biterEl: $('motorBiter'),
      tepki: function (ev) {
        if (ev.tip === 'bitti') document.body.classList.add('sahne-bitti');
      },
    });
  });
})();

window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
