<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>[ÖNİZLEME] Dost — İbn Arabî &amp; Daphne: İç Dünyaların Haritası</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="viz-root">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("dost-theme");
        var theme = (stored === "light" || stored === "dark")
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.body.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <header class="app-header">
    <button class="app-header__back" id="header-back" type="button"
            title="Dost'a dön / Back to Dost / Voltar ao Dost"
            aria-label="Dost'a dön / Back to Dost / Voltar ao Dost">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="app-header__title">
      <h1>Dost</h1>
      <p class="app-header__subtitle"
         data-tr="Muhyiddîn İbnü'l-Arabî &amp; Daphne — iki iç dünyanın örtüştüğü yerler"
         data-en="Muhyiddîn Ibn al-'Arabi &amp; Daphne — where two inner worlds overlap"
         data-pt="Muhyiddîn Ibn al-'Arabi &amp; Daphne — onde dois mundos interiores se sobrepõem"></p>
    </div>
    <div class="app-header__controls">
      <button class="theme-toggle" id="theme-toggle" type="button" title="Aydınlık / Karanlık mod — Light / Dark mode — Modo claro / escuro" aria-label="Aydınlık / Karanlık mod — Light / Dark mode — Modo claro / escuro">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.3" y2="17.7"/></g></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <div class="lang-switch" id="lang-switch"></div>
    </div>
  </header>

  <main>
    <section class="intro" id="intro-text">
      <p data-tr="İbn Arabî, varlığın tekliğini (vahdet-i vücûd), benliğin sahte egemenliğini ve Hakk'ın her sûrette tecellisini asırlar önce anlattı. Daphne ise sistem teorisi, sibernetik ve kişisel bir dönüşüm yolculuğuyla aynı hakikatlere kendi diliyle varıyor. Aşağıdaki takımyıldızda ortadaki altın düğümler, iki dünyanın örtüştüğü temaları gösteriyor — birine tıklayın."
         data-en="Centuries ago, Ibn Arabi described the oneness of Being, the false sovereignty of the self, and the Real's self-disclosure in every form. Daphne arrives at the same truths through systems theory, cybernetics, and a personal journey of transformation. In the constellation below, the golden nodes at the center are the themes where the two worlds overlap — click one."
         data-pt="Séculos atrás, Ibn Arabi descreveu a unicidade do Ser, a falsa soberania do eu e a autorrevelação do Real em cada forma. Daphne chega às mesmas verdades através da teoria dos sistemas, da cibernética e de uma jornada pessoal de transformação. Na constelação abaixo, os nós dourados no centro são os temas onde os dois mundos se sobrepõem — clique em um.">
      </p>
    </section>

    <section class="intro" id="intro-text-profile" hidden>
      <p data-tr="Bu harita, Dost ile örtüşüp örtüşmediğine bakmaksızın, Daphne'nin (thelivingfractal) kendi yazılarında tekrar tekrar döndüğü eksenleri bir araya getirmeye çalışıyor. Merkezdeki düğüm Daphne, çevresindekiler ise onun kendi cümleleriyle -- mümkün olduğunca -- kurulmuş temel parametreler. Bu kapanmış bir profil değil; yeni bir yazı paylaşıldıkça güncellenen bir taslak. Bir düğüme tıklayın."
         data-en="This map tries to gather, independent of any overlap with Dost, the axes Daphne's (thelivingfractal) own writing keeps returning to. The center node is Daphne; the surrounding ones are core parameters built, as much as possible, from her own words. This is not a closed profile -- it is a draft that updates as new pieces are shared. Click a node."
         data-pt="Este mapa tenta reunir, independentemente de qualquer sobreposição com Dost, os eixos aos quais a própria escrita de Daphne (thelivingfractal) retorna repetidamente. O nó central é Daphne; os que a rodeiam são parâmetros centrais construídos, tanto quanto possível, a partir de suas próprias palavras. Este não é um perfil fechado -- é um rascunho que se atualiza à medida que novos textos são compartilhados. Clique num nó.">
      </p>
    </section>

    <div class="bookmap-tabs" id="compare-tabs" role="tablist">
      <button type="button" class="bookmap-tab bookmap-tab--active" data-tab="temalar" role="tab" aria-selected="true"
        data-tr="Ortak Temalar" data-en="Shared Themes" data-pt="Temas Comuns"></button>
      <button type="button" class="bookmap-tab" data-tab="profil" role="tab" aria-selected="false"
        data-tr="Daphne'nin Profili" data-en="Daphne's Profile" data-pt="O Perfil de Daphne"></button>
      <button type="button" class="bookmap-tab" data-tab="yazilar" role="tab" aria-selected="false"
        data-tr="Taranan Yazılar" data-en="Articles Surveyed" data-pt="Textos Analisados"></button>
    </div>

    <section class="graph-wrap" id="compare-wrap" data-tab-panel="temalar">
      <svg id="graph"></svg>
      <div class="view-status" id="compare-wrap-status" hidden>
        <div class="view-status__spinner" aria-hidden="true"></div>
        <p class="view-status__text"></p>
        <button class="view-status__retry" type="button" hidden></button>
      </div>
      <div class="legend" id="legend">
        <button class="legend__toggle" type="button" aria-expanded="true">
          <span data-tr="Lejant" data-en="Legend" data-pt="Legenda">Lejant</span>
          <span class="legend__toggle-icon" aria-hidden="true">▾</span>
        </button>
        <div class="legend__body">
          <div class="legend__item"><span class="legend__dot legend__dot--ibnarabi"></span><span data-tr="İbn Arabî kavramları" data-en="Ibn Arabi concepts" data-pt="Conceitos de Ibn Arabi">İbn Arabî kavramları</span></div>
          <div class="legend__item"><span class="legend__dot legend__dot--theme"></span><span data-tr="Ortak temalar" data-en="Shared themes" data-pt="Temas compartilhados">Ortak temalar</span></div>
          <div class="legend__item"><span class="legend__dot legend__dot--daphne"></span><span data-tr="Daphne'nin yazıları" data-en="Daphne's writings" data-pt="Escritos de Daphne">Daphne'nin yazıları</span></div>
        </div>
      </div>
    </section>

    <section class="graph-wrap" id="profile-wrap" data-tab-panel="profil" hidden>
      <svg id="profile-graph"></svg>
      <div class="view-status" id="profile-wrap-status" hidden>
        <div class="view-status__spinner" aria-hidden="true"></div>
        <p class="view-status__text"></p>
        <button class="view-status__retry" type="button" hidden></button>
      </div>
    </section>

    <section class="daphne-profile-articles-wrap" id="articles-list-section" data-tab-panel="yazilar" hidden>
      <div id="articles-list" class="daphne-profile-articles-grid"></div>
    </section>

    <aside class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" hidden>
      <div id="detail-content"></div>
    </aside>
    <button class="detail-panel__close" id="detail-close" aria-label="Kapat / Close / Fechar">×</button>
  </main>

  <footer class="app-footer">
    <p data-tr="Kaynaklar: thelivingfractal.com, Substack (thelivingfractal1) ve Fütûhât-ı Mekkiyye / Füsûsu'l-Hikem gibi İbn Arabî eserlerinden derlenen kavramlar."
       data-en="Sources: thelivingfractal.com, Substack (thelivingfractal1), and concepts drawn from Ibn Arabi's works such as Futuhat al-Makkiyya / Fusus al-Hikam."
       data-pt="Fontes: thelivingfractal.com, Substack (thelivingfractal1) e conceitos extraídos de obras de Ibn Arabi como Futuhat al-Makkiyya / Fusus al-Hikam.">
    </p>
  </footer>
