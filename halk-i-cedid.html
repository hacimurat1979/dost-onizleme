<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Halk-ı Cedîd — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D2) -->
<title>Halk-ı Cedîd — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}
.honesty{color:var(--muted);font-size:.72rem;line-height:1.6;max-width:520px;margin:.6rem auto 0;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--surface)}

/* Sahne: bir siluet alanı, her karede tümüyle yok olup neredeyse aynı
   yerde yeniden beliriyor. Kaydırıcı "sürekli↔yavaş" arasında dünyanın
   hızını değil, tık aralığını uzatıyor -- aradaki yokluk ânı görünür olur. */
.stage-frame{position:relative;width:min(640px,92vw);aspect-ratio:16/10;max-height:58vh;margin:.4rem auto 1rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.stage-frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:10px;right:14px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@keyframes s2Pulse{0%,100%{opacity:.6}50%{opacity:1}}
.hint[data-anim]{animation:s2Pulse 3s ease-in-out 1.5s 3}

.track-wrap{width:min(560px,92vw);margin:0 auto 1.2rem;text-align:center}
.track-labels{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
#slider{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;padding:0;margin:0;cursor:pointer;display:block}
#slider::-webkit-slider-runnable-track{height:2px;background:var(--border);border-radius:2px}
#slider::-moz-range-track{height:2px;background:var(--border);border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);margin-top:-10px;box-shadow:0 0 0 1px var(--liminal)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal)}
#slider:focus{outline:none}
#slider:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 1px var(--liminal),0 0 0 5px var(--border)}
#slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 1px var(--liminal),0 0 0 5px var(--border)}

.caption{font-size:clamp(.82rem,1.6vw,.92rem);line-height:1.65;color:var(--text);opacity:0;padding:.9rem .4rem 0;max-width:560px;margin:0 auto;min-height:3em;text-wrap:pretty}
@keyframes s2Caption{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.caption[data-anim]{animation:s2Caption 900ms 900ms ease-out forwards}

@media (prefers-reduced-motion: reduce){
  [data-anim]{animation:none!important}
}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 id="hTitle">Halk-ı Cedîd</h1>
  <p class="sub" id="hSub">Âlem bir kez yaratılıp bırakılmış değil — her nefeste yeniden yaratılıyor. Biz bunu fark etmiyoruz, çünkü ardışık iki yaratılış birbirine çok benziyor.</p>
  <p class="honesty" id="hHonesty"></p>
</header>

<div class="stage-frame">
  <svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Her karede yeniden beliren bir siluet alanı">
    <g id="sceneG"></g>
  </svg>
  <div class="hint" id="hint" data-anim><span id="hintText"></span></div>
</div>

<div class="track-wrap">
  <div class="track-labels">
    <span id="labelFast"></span>
    <span id="labelSlow"></span>
  </div>
  <input id="slider" type="range" min="0" max="100" value="0">
  <p class="caption" id="caption" data-anim aria-live="polite"><span id="captionText"></span></p>
</div>

<script>
const LA={
  tr:{
    title:'Halk-ı Cedîd',
    sub:'Âlem bir kez yaratılıp bırakılmış değil — her nefeste yeniden yaratılıyor. Biz bunu fark etmiyoruz, çünkü ardışık iki yaratılış birbirine çok benziyor.',
    hint:'Yavaşlat',
    fast:'Sürekli',
    slow:'Yavaş',
    caption:'Sahne duruyor gibi görünüyor. Aslında her karede tümüyle yok oluyor ve neredeyse aynı yerde yeniden beliriyor. Yavaşlattıkça aradaki yokluk anı görünür oluyor.',
    honesty:'Bu sahnenin güven düzeyi yerleşik: "her nefeste yeniden yaratılış" iddiası iki ayrı Fütûhât alıntısına (Cilt XV, 416. Bölüm; Cilt XIV, 408. Bölüm) doğrudan dayanıyor, kaynağın söylemediği bir kesinlik eklenmedi. Doktrinin akademik okuması için Mohamed Haj Yousef\'in "Ibn \'Arabî - Time and Cosmology" (Routledge, 2007) kitabına bakılabilir; ama kitabın kendi fizik-kıyasları (modern fizik teorileriyle karşılaştırma) yayınlanmış eleştirilerde aşırı iddialı bulunmuş — bu sahne o kıyaslara hiç başvurmuyor, yalnız doktrinin kendisini taşıyor.',
  },
  en:{
    title:'Perpetual Renewal',
    sub:'The world is not something created once and left — it is recreated at every breath. We do not notice, because two successive creations resemble each other so closely.',
    hint:'Slow down',
    fast:'Continuous',
    slow:'Slow',
    caption:'The scene looks still. In fact it vanishes each frame and reappears almost — but not quite — where it was. Slow it down and the moment of absence becomes visible.',
    honesty:"This scene's confidence level is well-established: the claim of \"perpetual re-creation with every breath\" rests directly on two separate Futuhat passages (Vol. XV, Chapter 416; Vol. XIV, Chapter 408), with no certainty added beyond what the source states. For an academic treatment of the doctrine, see Mohamed Haj Yousef's \"Ibn 'Arabi - Time and Cosmology\" (Routledge, 2007); but the book's own physics comparisons (drawing parallels with modern physical theories) have been called overreaching in published reviews — this scene does not draw on those comparisons, only on the doctrine itself.",
  },
  pt:{
    title:'Renovação Perpétua',
    sub:'O mundo não é algo criado uma vez e deixado — é recriado a cada alento. Não damos por isso, porque duas criações sucessivas se assemelham muito.',
    hint:'Desacelerar',
    fast:'Contínuo',
    slow:'Lento',
    caption:'A cena parece imóvel. Na verdade, a cada quadro ela desaparece por inteiro e retorna quase — não exatamente — onde estava. Ao desacelerar, o instante de ausência se torna visível.',
    honesty:'O nível de confiança desta cena é consolidado: a afirmação de "recriação perpétua a cada alento" assenta diretamente em duas passagens separadas das Futuhat (Vol. XV, Capítulo 416; Vol. XIV, Capítulo 408), sem qualquer certeza acrescentada além do que a fonte afirma. Para uma leitura académica da doutrina, pode consultar-se o livro de Mohamed Haj Yousef, "Ibn \'Arabi - Time and Cosmology" (Routledge, 2007); mas as próprias comparações do livro com a física (traçando paralelos com teorias físicas modernas) foram consideradas excessivas em avaliações publicadas — esta cena não recorre a essas comparações, apenas à doutrina em si.',
  },
};

let curLang='tr';
const $=id=>document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderAll(){
  const d=LA[curLang];
  $('hTitle').textContent=d.title;
  $('hSub').textContent=d.sub;
  $('hHonesty').textContent=d.honesty;
  $('hintText').textContent=d.hint;
  $('labelFast').textContent=d.fast;
  $('labelSlow').textContent=d.slow;
  $('captionText').textContent=d.caption;
  $('slider').setAttribute('aria-label',d.hint);
}
function setLang(l){ if(!LA[l]) return; curLang=l; renderAll(); }

function detectLang(){
  const dl = document.documentElement.getAttribute('data-lang') || document.documentElement.lang || 'tr';
  const l = dl.slice(0,2).toLowerCase();
  return LA[l] ? l : 'tr';
}
curLang = detectLang();
renderAll();

// ── Sahne: bir siluet alanı, her karede yeniden yaratılıyor ────────────────
// GORSEL_DIL.md: kavramı değil davranışını resmet. Sahne hiç "kaymıyor" --
// her tık'ta bütünüyle GÖRÜNMEZ oluyor (yokluk ânı), sonra neredeyse aynı
// konumlarda, küçük bir sapmayla YENİDEN BELİRİYOR. Çözünürlük yüksekken
// (tık aralığı ~55ms, yokluk ~0ms) bu göz için süreklilik olarak okunuyor --
// tıpkı 416. Bölüm'ün "başkaları o yaratılıştan perdelenmiştir" dediği gibi.
// Kaydırıcı "sürekli↔yavaş" arasında DÜNYANIN hızını değiştirmiyor, yalnız
// tık aralığını ve aradaki yokluk payını büyütüyor -- yavaşladıkça karartı
// görünür oluyor.
const svgNS='http://www.w3.org/2000/svg';
const rand=(seed => () => (seed = (seed * 9301 + 49297) % 233280) / 233280)(31);

const sceneG=document.getElementById('sceneG');
const shapes={
  cypress:'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  hill:'M 0 40 Q 20 8 40 40 Z',
  arch:'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  bird:'M 0 6 Q 8 -2 14 4 Q 20 -2 28 6',
  leaf:'M 20 4 Q 32 20 20 40 Q 8 20 20 4 Z',
  moon:'M 30 8 A 16 16 0 1 0 30 40 A 12 14 0 1 1 30 8 Z',
  door:'M 4 40 L 4 14 Q 4 2 20 2 Q 36 2 36 14 L 36 40 Z',
};
const filled=new Set(['cypress','hill','arch','leaf','moon','door']);
const keys=Object.keys(shapes);

const items=[];
const placed=[];
let attempts=0;
const target=70;
while(placed.length<target && attempts<target*40){
  attempts++;
  const x=60+rand()*1480;
  const y=60+rand()*880;
  const scale=0.6+rand()*1.2;
  const minDist=90*scale;
  let ok=true;
  for(const p of placed){
    const dx=p.x-x, dy=p.y-y;
    if(dx*dx+dy*dy<minDist*minDist){ ok=false; break; }
  }
  if(!ok) continue;
  placed.push({x,y,scale});
  const kind=keys[Math.floor(rand()*keys.length)];
  const g=document.createElementNS(svgNS,'g');
  const el=document.createElementNS(svgNS,'path');
  el.setAttribute('d',shapes[kind]);
  if(filled.has(kind)){
    el.setAttribute('fill','var(--text)'); el.setAttribute('stroke','none');
  } else {
    el.setAttribute('fill','none'); el.setAttribute('stroke','var(--text)');
    el.setAttribute('stroke-width',1.4); el.setAttribute('stroke-linecap','round');
  }
  const baseOp=0.75+rand()*0.2;
  el.setAttribute('opacity',baseOp.toFixed(2));
  g.appendChild(el);
  sceneG.appendChild(g);
  items.push({g,el,x,y,scale,baseOp,w:40*scale,h:40*scale});
}
// Bir de her seferinde yeniden yaratılan ince bir toz katmanı.
const dust=[];
for(let i=0;i<180;i++){
  const c=document.createElementNS(svgNS,'circle');
  const x=rand()*1600, y=rand()*1000;
  const r=0.8+rand()*1.1;
  const op=0.35+rand()*0.35;
  c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
  c.setAttribute('fill','var(--text)'); c.setAttribute('opacity',op.toFixed(2));
  sceneG.appendChild(c);
  dust.push({el:c,x,y,r,op});
}

function recreate(){
  // Her yeni dünya öncekinden çok küçük bir farkla ayrılıyor -- fark edilmez.
  for(const it of items){
    const jx=(Math.random()-0.5)*2.2;
    const jy=(Math.random()-0.5)*2.2;
    const jr=(Math.random()-0.5)*0.9;
    it.g.setAttribute('transform',`translate(${it.x-it.w/2+jx} ${it.y-it.h+jy}) scale(${it.scale}) rotate(${jr} ${it.w/(2*it.scale)} ${it.h/(2*it.scale)})`);
    it.el.setAttribute('opacity',(it.baseOp+(Math.random()-0.5)*0.06).toFixed(3));
  }
  for(const d of dust){
    d.el.setAttribute('cx',(d.x+(Math.random()-0.5)*1.4).toFixed(2));
    d.el.setAttribute('cy',(d.y+(Math.random()-0.5)*1.4).toFixed(2));
    d.el.setAttribute('opacity',(d.op+(Math.random()-0.5)*0.08).toFixed(3));
  }
}
recreate();

const slider=$('slider');
const hint=$('hint');
let t=0; // yavaşlama 0..1

// Döngü: görünür → yokluk → yeniden yaratılış → görünür.
// t=0: görünür ~55ms, yokluk ~0ms → süreklilik olarak okunur.
// t=1: görünür ~1400ms, yokluk ~900ms → kesinti açıkça görünür.
let phase='visible';
let phaseStart=performance.now();
let rafId=0;
function loop(now){
  const visMs=55+t*t*1400;
  const voidMs=t*t*900;
  const elapsed=now-phaseStart;
  if(phase==='visible'){
    sceneG.setAttribute('opacity','1');
    if(elapsed>=visMs){
      if(voidMs>8){
        phase='void';
        phaseStart=now;
        sceneG.setAttribute('opacity','0');
      } else {
        recreate();
        phaseStart=now;
      }
    }
  } else {
    if(elapsed>=voidMs){
      recreate();
      phase='visible';
      phaseStart=now;
      sceneG.setAttribute('opacity','1');
    }
  }
  rafId=requestAnimationFrame(loop);
}

slider.addEventListener('input',e=>{
  t=(+e.target.value)/100;
  if(hint) hint.style.animation='none';
});

if(reduceMotion){
  // Hareket taklit edilmiyor -- tek, sabit bir kare; başlık her zaman görünür.
  sceneG.setAttribute('opacity','1');
  const cap=$('caption');
  cap.style.animation='none'; cap.style.opacity='1';
  if(hint) hint.style.animation='none';
} else {
  rafId=requestAnimationFrame(loop);
}

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
</body>
</html>
