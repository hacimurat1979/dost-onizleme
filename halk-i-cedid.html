<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Halk-ı Cedîd — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D2) -->
<title>Halk-ı Cedîd — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}
.honesty{color:var(--muted);font-size:.72rem;line-height:1.6;max-width:520px;margin:.6rem auto 0;padding:.6rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--surface)}

/* Sahne: bir siluet alanı, her karede tümüyle yok olup neredeyse aynı
   yerde yeniden beliriyor. Kaydırıcı "sürekli↔yavaş" arasında dünyanın
   hızını değil, tık aralığını uzatıyor -- aradaki yokluk ânı görünür olur. */
.stage-frame{position:relative;width:min(640px,92vw);aspect-ratio:16/10;max-height:58vh;margin:.4rem auto 1rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.stage-frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:10px;right:14px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s ease}
@keyframes s2Pulse{0%,100%{opacity:.6}50%{opacity:1}}
body.sahne-bitti .hint{opacity:.7;animation:s2Pulse 3s ease-in-out .3s 3}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin:.3rem 0 .2rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--muted);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--liminal);color:var(--text)}

.sahne-kunye{width:min(560px,92vw);margin:1rem auto 0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;font-size:.82rem;line-height:1.7}
.sahne-kunye summary{cursor:pointer;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye summary:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}
.sahne-metni{list-style:none;margin-top:.7rem;font-style:italic}

.track-wrap{width:min(560px,92vw);margin:0 auto 1.2rem;text-align:center;opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .track-wrap{opacity:1;max-height:160px}
.track-labels{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
#slider{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;padding:0;margin:0;cursor:pointer;display:block}
#slider::-webkit-slider-runnable-track{height:2px;background:var(--border);border-radius:2px}
#slider::-moz-range-track{height:2px;background:var(--border);border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);margin-top:-10px;box-shadow:0 0 0 1px var(--liminal)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal)}
#slider:focus{outline:none}
#slider:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 1px var(--liminal),0 0 0 5px var(--border)}
#slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 1px var(--liminal),0 0 0 5px var(--border)}

.caption{font-size:clamp(.82rem,1.6vw,.92rem);line-height:1.65;color:var(--text);opacity:0;transform:translateY(4px);transition:opacity .8s ease,transform .8s ease;padding:.9rem .4rem 0;max-width:560px;margin:0 auto;min-height:3em;text-wrap:pretty}
.caption.gorunur{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){
  [data-anim]{animation:none!important}
}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="hTitle">Halk-ı Cedîd</h1>
  <p class="sub" id="hSub">Âlem bir kez yaratılıp bırakılmış değil — her nefeste yeniden yaratılıyor. Biz bunu fark etmiyoruz, çünkü ardışık iki yaratılış birbirine çok benziyor.</p>
  <p class="honesty" id="hHonesty"></p>
</header>

<div class="stage-frame">
  <svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Her karede yeniden beliren bir siluet alanı">
    <g id="sceneG" opacity="0"></g>
  </svg>
  <div class="hint" id="hint"><span id="hintText"></span></div>
</div>
<div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>

<p class="caption" id="caption" aria-live="polite"><span id="captionText"></span></p>

<div class="track-wrap">
  <div class="track-labels">
    <span id="labelFast"></span>
    <span id="labelSlow"></span>
  </div>
  <input id="slider" type="range" min="0" max="100" value="0" disabled>
</div>

<div id="kunyeYuvasi"></div>

<!-- i18n.js önce yüklenmeli: sahne-motoru.js modül-yükleme anında
     window.DostI18n.pick3'ü okuyor (2026-08-15 bulgusu, bkz. hayret.html/
     kandil.html/kalbe-sigan.html/nefes-i-rahmani.html/berzah.html aynı
     düzeltme). -->
<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script>
const LA={
  tr:{
    title:'Halk-ı Cedîd',
    sub:'Âlem bir kez yaratılıp bırakılmış değil — her nefeste yeniden yaratılıyor. Biz bunu fark etmiyoruz, çünkü ardışık iki yaratılış birbirine çok benziyor.',
    hint:'Sahne durdu — artık hızını sen ayarla',
    fast:'Sabit',
    slow:'Titrek',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?',
    caption:'Sahne duruyor gibi görünüyor. Aslında her karede tümüyle yok oluyor ve neredeyse aynı yerde yeniden beliriyor. Yavaşlattıkça aradaki yokluk anı görünür oluyor.',
    honesty:'Bu sahnenin güven düzeyi yerleşik: "her nefeste yeniden yaratılış" iddiası iki ayrı Fütûhât alıntısına (Cilt XV, 416. Bölüm; Cilt XIV, 408. Bölüm) doğrudan dayanıyor, kaynağın söylemediği bir kesinlik eklenmedi. Doktrinin akademik okuması için Mohamed Haj Yousef\'in "Ibn \'Arabî - Time and Cosmology" (Routledge, 2007) kitabına bakılabilir; ama kitabın kendi fizik-kıyasları (modern fizik teorileriyle karşılaştırma) yayınlanmış eleştirilerde aşırı iddialı bulunmuş — bu sahne o kıyaslara hiç başvurmuyor, yalnız doktrinin kendisini taşıyor.',
  },
  en:{
    title:'Perpetual Renewal',
    sub:'The world is not something created once and left — it is recreated at every breath. We do not notice, because two successive creations resemble each other so closely.',
    hint:'The scene has settled — now set the pace yourself',
    fast:'Steady',
    slow:'Flickering',
    kunyeBaslik:'Sources — where this scene comes from',
    caption:'The scene looks still. In fact it vanishes each frame and reappears almost — but not quite — where it was. Slow it down and the moment of absence becomes visible.',
    honesty:"This scene's confidence level is well-established: the claim of \"perpetual re-creation with every breath\" rests directly on two separate Futuhat passages (Vol. XV, Chapter 416; Vol. XIV, Chapter 408), with no certainty added beyond what the source states. For an academic treatment of the doctrine, see Mohamed Haj Yousef's \"Ibn 'Arabi - Time and Cosmology\" (Routledge, 2007); but the book's own physics comparisons (drawing parallels with modern physical theories) have been called overreaching in published reviews — this scene does not draw on those comparisons, only on the doctrine itself.",
  },
  pt:{
    title:'Renovação Perpétua',
    sub:'O mundo não é algo criado uma vez e deixado — é recriado a cada alento. Não damos por isso, porque duas criações sucessivas se assemelham muito.',
    hint:'A cena parou — agora ajuste você mesmo o ritmo',
    fast:'Estável',
    slow:'A tremeluzir',
    kunyeBaslik:'Fontes — de onde vem esta cena',
    caption:'A cena parece imóvel. Na verdade, a cada quadro ela desaparece por inteiro e retorna quase — não exatamente — onde estava. Ao desacelerar, o instante de ausência se torna visível.',
    honesty:'O nível de confiança desta cena é consolidado: a afirmação de "recriação perpétua a cada alento" assenta diretamente em duas passagens separadas das Futuhat (Vol. XV, Capítulo 416; Vol. XIV, Capítulo 408), sem qualquer certeza acrescentada além do que a fonte afirma. Para uma leitura académica da doutrina, pode consultar-se o livro de Mohamed Haj Yousef, "Ibn \'Arabi - Time and Cosmology" (Routledge, 2007); mas as próprias comparações do livro com a física (traçando paralelos com teorias físicas modernas) foram consideradas excessivas em avaliações publicadas — esta cena não recorre a essas comparações, apenas à doutrina em si.',
  },
};

let curLang='tr';
let sonMetin=null;
const $=id=>document.getElementById(id);

// Künye kutusu — assets/sahne-cizim.js'teki kunye() işlevine denk, bu
// sahne kendi içinde kuruyor (self-contained). Bu sahnede ayrı sourced
// alıntı satırları yok (honesty bloğu zaten iki Fütûhât referansını
// taşıyor) -- künye burada yalnız sahne metnini barındırıyor.
function kunyeOlustur(container, baslikObj){
  const det=document.createElement('details'); det.className='sahne-kunye';
  const sum=document.createElement('summary'); det.appendChild(sum);
  const ol=document.createElement('ol'); ol.className='sahne-metni'; det.appendChild(ol);
  container.appendChild(det);
  return { el:det, ol, guncelle:function(l){
    sum.textContent=(baslikObj&&(baslikObj[l]||baslikObj.tr))||'Künye';
  }};
}
const kunye=kunyeOlustur($('kunyeYuvasi'), {});

let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniGuncelle(){
  if(!partisyonRef) return;
  sahneMetniEl=kunye.ol;
  sahneMetniEl.innerHTML='';
  partisyonRef.olcuLer.forEach(function(o){
    if(!o.metin) return;
    const li=document.createElement('li');
    li.textContent=o.metin[curLang]||o.metin.tr;
    sahneMetniEl.appendChild(li);
  });
}

function renderAll(){
  const d=LA[curLang];
  $('hTitle').textContent=d.title;
  $('hSub').textContent=d.sub;
  $('hHonesty').textContent=d.honesty;
  $('hintText').textContent=d.hint;
  $('labelFast').textContent=d.fast;
  $('labelSlow').textContent=d.slow;
  if(sonMetin) $('captionText').textContent=sonMetin[curLang]||sonMetin.tr;
  else $('captionText').textContent=d.caption;
  $('slider').setAttribute('aria-label',d.hint);
  kunye.guncelle(curLang);
  sahneMetniniGuncelle();
}
function setLang(l){ if(!LA[l]) return; curLang=l; renderAll(); }

function detectLang(){
  const dl = document.documentElement.getAttribute('data-lang') || document.documentElement.lang || 'tr';
  const l = dl.slice(0,2).toLowerCase();
  return LA[l] ? l : 'tr';
}
curLang = detectLang();
renderAll();

// ── Sahne: bir siluet alanı, her karede yeniden yaratılıyor ────────────────
// GORSEL_DIL.md: kavramı değil davranışını resmet. Sahne hiç "kaymıyor" --
// her tık'ta bütünüyle GÖRÜNMEZ oluyor (yokluk ânı), sonra neredeyse aynı
// konumlarda, küçük bir sapmayla YENİDEN BELİRİYOR. Çözünürlük yüksekken
// (tık aralığı ~55ms, yokluk ~0ms) bu göz için süreklilik olarak okunuyor --
// tıpkı 416. Bölüm'ün "başkaları o yaratılıştan perdelenmiştir" dediği gibi.
// Kaydırıcı "sürekli↔yavaş" arasında DÜNYANIN hızını değiştirmiyor, yalnız
// tık aralığını ve aradaki yokluk payını büyütüyor -- yavaşladıkça karartı
// görünür oluyor.
const svgNS='http://www.w3.org/2000/svg';
const rand=(seed => () => (seed = (seed * 9301 + 49297) % 233280) / 233280)(31);

const sceneG=document.getElementById('sceneG');

// Ufuk: "dünya"yı tek tek saçılmış simgeler değil, tanınabilir bir YER
// olarak kuran zemin (kullanıcı bulgusu, 2026-08-21: önceki dağılım rastgele
// duran ikonlar gibi okunuyordu, bir dünya gibi değil). Ufuk sabit kalır --
// üzerindeki ağaç/kapı/kuş/toz "patchy" fazında tek tek titrer, ama zemin
// hiç kaybolmaz: "dünya hiç tümüyle kaybolmaz" burada doğrudan görsel.
function horizonY(x){
  return 760 + 55*Math.sin(x/410+1.1) + 22*Math.sin(x/160+3.0) + 9*Math.sin(x/68+0.4);
}
{
  let d='M 0 '+horizonY(0).toFixed(1);
  for(let x=20;x<=1600;x+=20) d+=' L '+x+' '+horizonY(x).toFixed(1);
  d+=' L 1600 1000 L 0 1000 Z';
  const ground=document.createElementNS(svgNS,'path');
  ground.setAttribute('d',d);
  ground.setAttribute('fill','var(--text)');
  ground.setAttribute('opacity','0.16');
  sceneG.appendChild(ground);
}

const shapes={
  cypress:'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  hill:'M 0 40 Q 20 8 40 40 Z',
  arch:'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  bird:'M 0 6 Q 8 -2 14 4 Q 20 -2 28 6',
  leaf:'M 20 4 Q 32 20 20 40 Q 8 20 20 4 Z',
  moon:'M 30 8 A 16 16 0 1 0 30 40 A 12 14 0 1 1 30 8 Z',
  door:'M 4 40 L 4 14 Q 4 2 20 2 Q 36 2 36 14 L 36 40 Z',
};
const filled=new Set(['cypress','hill','arch','leaf','moon','door']);

function makeItem(kind,x,y,scale){
  const g=document.createElementNS(svgNS,'g');
  const el=document.createElementNS(svgNS,'path');
  el.setAttribute('d',shapes[kind]);
  if(filled.has(kind)){
    el.setAttribute('fill','var(--text)'); el.setAttribute('stroke','none');
  } else {
    el.setAttribute('fill','none'); el.setAttribute('stroke','var(--text)');
    el.setAttribute('stroke-width',1.4); el.setAttribute('stroke-linecap','round');
  }
  const baseOp=0.75+rand()*0.2;
  el.setAttribute('opacity',baseOp.toFixed(2));
  g.appendChild(el);
  sceneG.appendChild(g);
  return {g,el,x,y,scale,baseOp,w:40*scale,h:40*scale};
}

const items=[];

// Zemine dayanan öğeler: taban ufka değecek şekilde, ufuk boyunca aralıklı.
const groundKinds=[
  ...Array(7).fill('cypress'), ...Array(5).fill('hill'),
  ...Array(2).fill('arch'), ...Array(2).fill('door'), ...Array(8).fill('leaf'),
];
{
  const placedX=[];
  for(const kind of groundKinds){
    let x, tries=0;
    do{ x=70+rand()*1460; tries++; } while(placedX.some(px=>Math.abs(px-x)<95) && tries<40);
    placedX.push(x);
    const scale=kind==='cypress'?0.85+rand()*0.5:kind==='hill'?0.7+rand()*0.6:0.6+rand()*0.35;
    items.push(makeItem(kind,x,horizonY(x)+rand()*6,scale));
  }
}

// Gökteki öğeler: ufkun üstünde, dünyadan bağımsız -- ay ve kuşlar.
items.push(makeItem('moon',1300+rand()*120,130+rand()*40,1.3));
for(let i=0;i<5;i++){
  items.push(makeItem('bird',100+rand()*1400,90+rand()*260,0.7+rand()*0.5));
}

// Bir de her seferinde yeniden yaratılan ince bir toz katmanı.
const dust=[];
for(let i=0;i<140;i++){
  const c=document.createElementNS(svgNS,'circle');
  const x=rand()*1600, y=rand()*1000;
  const r=0.8+rand()*1.1;
  const op=0.3+rand()*0.3;
  c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
  c.setAttribute('fill','var(--text)'); c.setAttribute('opacity',op.toFixed(2));
  sceneG.appendChild(c);
  dust.push({el:c,x,y,r,op});
}

function recreate(){
  // Her yeni dünya öncekinden çok küçük bir farkla ayrılıyor -- fark edilmez.
  for(const it of items){
    const jx=(Math.random()-0.5)*2.2;
    const jy=(Math.random()-0.5)*2.2;
    const jr=(Math.random()-0.5)*0.9;
    it.g.setAttribute('transform',`translate(${it.x-it.w/2+jx} ${it.y-it.h+jy}) scale(${it.scale}) rotate(${jr} ${it.w/(2*it.scale)} ${it.h/(2*it.scale)})`);
    it.el.setAttribute('opacity',(it.baseOp+(Math.random()-0.5)*0.06).toFixed(3));
  }
  for(const d of dust){
    d.el.setAttribute('cx',(d.x+(Math.random()-0.5)*1.4).toFixed(2));
    d.el.setAttribute('cy',(d.y+(Math.random()-0.5)*1.4).toFixed(2));
    d.el.setAttribute('opacity',(d.op+(Math.random()-0.5)*0.08).toFixed(3));
  }
}
recreate();

// ── 2026-08-20 yeniden düzenleme (kullanıcı notu) ───────────────────────────
// Akış artık tek bir sürekli "hiz" parametresiyle kuruluyor -- ölçüler
// arasında hedefler değiştikçe (0.22 → 1.5 → 0) aynı yumuşak-yaklaşma
// eğrisi önce hızlanıp sonra kendiliğinden yavaşlıyor; ayrı bir "ivme"
// kodu gerekmiyor (nefes-i-rahmani.html'deki posHedefiVer deseninin aynısı).
// faz: 'fadein' (dünya belirir) → 'patchy' (parçalar halinde titreşir,
// dünya hiç tümüyle kaybolmaz) → 'blink' (dünya TÜMÜYLE kaybolup geri
// gelir; hiz bu fazın periyodunu sürer) → 'fadeout' (dünya çekilir).
const svgAll=[...items.map(it=>({el:it.el,baseOp:it.baseOp})), ...dust.map(d=>({el:d.el,baseOp:d.op}))];
function tumunuGoster(){
  for(const f of svgAll) f.el.setAttribute('opacity', f.baseOp.toFixed(3));
}

const slider=$('slider');
const hint=$('hint');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let faz='fadein';
let hiz=0, targetHiz=0;
let patchyHiz=1;
let lastEase=performance.now();
let blinkPhase='visible';
let blinkPhaseStart=performance.now();
let patchyState=new Map(); // el -> {nextToggle, on}
let rafId=0;

function fazUygula(yeniFaz, gecisSn){
  const eskiFaz=faz;
  faz=yeniFaz;
  sceneG.style.transition='opacity '+(gecisSn||1.8)+'s ease';
  if(yeniFaz==='fadein'){
    sceneG.setAttribute('opacity','0');
    requestAnimationFrame(()=>{ sceneG.setAttribute('opacity','1'); });
  } else if(yeniFaz==='fadeout'){
    tumunuGoster();
    sceneG.setAttribute('opacity','1');
    requestAnimationFrame(()=>{ sceneG.setAttribute('opacity','0'); });
  } else {
    sceneG.setAttribute('opacity','1');
    if(eskiFaz==='patchy'||eskiFaz==='fadein') tumunuGoster();
    if(yeniFaz==='blink'){ blinkPhase='visible'; blinkPhaseStart=performance.now(); }
  }
}

function patchyStep(now){
  for(const f of svgAll){
    let s=patchyState.get(f.el);
    if(!s){ s={nextToggle:now+Math.random()*500, on:true}; patchyState.set(f.el,s); }
    if(now>=s.nextToggle){
      s.on=!s.on;
      f.el.setAttribute('opacity', s.on?f.baseOp.toFixed(3):'0');
      const hiz2=Math.max(0.2, patchyHiz);
      s.nextToggle=now+(260+Math.random()*900)/hiz2;
    }
  }
}

// Döngü SÜREKLİ çalışır (narasyon sırasında da, sahne bittikten sonra da,
// yalnız 'blink' fazındayken görünür etkisi olur); hiz'in hedefi motordan
// (ya da kendim gezineyim kaydırıcısından) gelir.
// hiz≈0: dünya sabit kalır (kesinti yok). hiz büyüdükçe tam-yokluk/tam-
// varlık döngüsü kısalır -- göz kırpar gibi titrer.
function loop(now){
  const dt=Math.min(80, now-lastEase); lastEase=now;
  if(Math.abs(targetHiz-hiz)>0.001) hiz+=(targetHiz-hiz)*Math.min(1, dt/1100);
  else hiz=targetHiz;

  if(faz==='patchy'){
    patchyStep(now);
  } else if(faz==='blink'){
    if(hiz<=0.03){
      if(blinkPhase!=='visible'){ blinkPhase='visible'; sceneG.setAttribute('opacity','1'); }
    } else {
      const visMs=140+900/hiz;
      const voidMs=60+280/hiz;
      const elapsed=now-blinkPhaseStart;
      if(blinkPhase==='visible'){
        if(elapsed>=visMs){
          blinkPhase='void'; blinkPhaseStart=now;
          sceneG.setAttribute('opacity','0');
        }
      } else if(elapsed>=voidMs){
        recreate();
        blinkPhase='visible'; blinkPhaseStart=now;
        sceneG.setAttribute('opacity','1');
      }
    }
  }
  rafId=requestAnimationFrame(loop);
}
function hizHedefiVer(v){ targetHiz=v; }

slider.addEventListener('input',e=>{
  if(!document.body.classList.contains('sahne-bitti')) return;
  hizHedefiVer((+e.target.value)/100*1.6);
  if(hint) hint.style.animation='none';
});

if(!reduced) rafId=requestAnimationFrame(loop);

function metinYaz(m){
  sonMetin=m;
  const t2=m?(m[curLang]||m.tr||''):'';
  const cap=$('caption');
  cap.classList.remove('gorunur');
  window.setTimeout(function(){
    $('captionText').textContent=t2;
    if(t2) cap.classList.add('gorunur');
  }, t2?150:0);
}

let motorAPI=null;
(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/halk-i-cedid.json').then(function(r){ return r.json(); }).then(function(p){
    partisyonRef=p;
    sahneMetniniGuncelle();
    motorAPI=window.__sahneMotoru.yarat({
      container:document.querySelector('.stage-frame'), partisyon:p,
      applyOlcu:function(o){
        const hal=o.hedef_hal||{};
        if(hal.patchyHiz!==undefined) patchyHiz=hal.patchyHiz;
        if(hal.hiz!==undefined) targetHiz=hal.hiz;
        if(reduced){
          // reduced-motion: motor bütün ölçülerin hedef_hal'ini TEK sentetik
          // çağrıda birleştiriyor (sahne-motoru.js) -- "faz" burada kümülatif
          // bir özellik değil, ayrık bir GEÇİŞ olduğu için son ölçünün
          // ("fadeout") kazanması yanlış: ekranı boş bırakırdı, hiçbir şey
          // öğretmezdi (/sahne ilkesi: bitiş hâli okunaklı olmalı). Reduced-
          // motion'da her zaman dünyanın kendisi görünür kalır; "sönüş"
          // fikri birleştirilmiş altyazı metniyle (metinGoster) taşınıyor.
          sceneG.style.transition='none';
          tumunuGoster();
          sceneG.setAttribute('opacity','1');
        } else if(hal.faz){
          fazUygula(hal.faz, o.gecis_sure_sn);
        }
      },
      metinGoster:metinYaz,
      olcuGoster:function(i,tot){ $('olcuGosterge').textContent=(i+1)+' / '+tot; },
      biterEl:$('motorBiter'),
      tepki:function(ev){
        if(ev.tip==='bitti'){
          document.body.classList.add('sahne-bitti');
          if(faz==='fadeout'){
            // Bitiş hâli "sahnenin özeti" olmalı (/sahne ilkesi) -- kendim
            // gezineyim kipine geçince dünya tekrar sabit görünür olsun,
            // kaydırıcı 0'dan (durgun) başlasın.
            fazUygula('blink', 1.2);
            targetHiz=0;
          }
          slider.disabled=false;
          slider.value=Math.round(Math.min(1,targetHiz/1.6)*100);
        }
      },
    });
  });
})();

document.querySelector('.stage-frame').setAttribute('tabindex','0');
document.querySelector('.stage-frame').addEventListener('keydown', function(e){
  if(!motorAPI || e.target===slider) return;
  if(e.key===' '){ e.preventDefault(); if(motorAPI.durum==='oynuyor') motorAPI.pause(); else if(motorAPI.durum==='durakli') motorAPI.resume(); return; }
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return;
  e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0, Math.min(motorAPI.olcuSayisi-1, motorAPI.aktifIdx+y)));
});

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
