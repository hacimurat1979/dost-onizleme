<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Karanlığı Görmek (hayret) — Dost Arabi. docs/04-sahne-storyboard.md S1;
     teknik karar: docs/05-teknik-plan.md §3. Bulanıklık animasyonu YOK —
     net+bulanık çift katman, yalnız opaklık crossfade. Işık kısma nötr
     örtüyle. GSAP kullanılmıyor: S1'in hiçbir ölçüsünde ölçü-içi
     mikro-zamanlama yok, CSS transition yetiyor. -->
<title>Karanlığı Görmek — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem;max-width:560px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--gold);margin-bottom:.45rem}
.sub{color:var(--muted);font-size:.88rem;font-style:italic;line-height:1.65}

.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px}

/* Sahne kutusu: kendi ışık mantığını taşır (bkz. aşağıdaki script) —
   bu renkler site temasını değil, sahnenin kendi "yanlış aydınlık / gerçek
   biçim" karşıtlığını temsil eder; bu yüzden kart ÇERÇEVESİ site
   değişkenleriyle, kart İÇERİĞİ (SVG'nin kendi renkleri) sabit sıcak
   tonlarla kalıyor — halka-i cedîd'deki gradyanın aynı gerekçesi
   (parlak-Zât yasağı: kaynak nokta viewBox dışında, burada da ışığın
   "kaynağı" yok, yalnız bir örtünün açılıp kapanması var).
*/
#stageWrap{position:relative;width:min(640px,92vw);aspect-ratio:16/10;margin:.4rem auto 1rem;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.ipucu{position:absolute;top:12px;right:14px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@keyframes ipucuNabiz{0%,100%{opacity:.55}50%{opacity:1}}
.ipucu{animation:ipucuNabiz 3s ease-in-out 1.5s 3}

.kaydirici-blok{width:min(560px,92vw);margin:0 auto 1rem}
.uc-etiket{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
#isikKaydirici{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:44px;padding:0;margin:0;cursor:pointer}
#isikKaydirici::-webkit-slider-runnable-track{height:2px;background:var(--border);border-radius:2px}
#isikKaydirici::-moz-range-track{height:2px;background:var(--border);border-radius:2px}
#isikKaydirici::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal);margin-top:-10px}
#isikKaydirici::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--liminal)}
#isikKaydirici:focus-visible{outline:none}
#isikKaydirici:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--liminal)}
#isikKaydirici:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--liminal)}

.caption{text-align:center;font-size:.88rem;line-height:1.7;color:var(--text);opacity:0;padding:.7rem 4px 0;max-width:520px;margin:0 auto;min-height:3em}
@keyframes captionGir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.caption{animation:captionGir 900ms 900ms ease-out forwards}
@media(prefers-reduced-motion:reduce){.sw [data-anim]{animation:none!important}}

/* Künye — kapalı gelir; içinde Dost'un cümleleri ile bizim okumamız ayrık. */
.sahne-kunye{width:min(560px,92vw);margin-top:.3rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye summary:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}
.sahne-kunye ul{list-style:none;margin-top:.7rem}
.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--muted)}
.sahne-kunye li.sahne-kunye__serh{color:var(--muted);font-size:.76rem}
.sahne-kunye a{color:var(--liminal);text-decoration:none;border-bottom:1px solid var(--border);white-space:nowrap}
.sahne-kunye a:hover,.sahne-kunye a:focus-visible{border-bottom-color:var(--liminal)}

.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script>
// Sitenin tema seçimini miras al (perde-zinciri.html'deki desenin aynısı).
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 id="i-title">Karanlığı Görmek</h1>
  <p class="sub" id="i-sub">Işık kısıldıkça sahne netleşir — hayret körlük değil, bir durak</p>
</header>

<div class="sw">
  <div id="stageWrap">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aydınlıkta bulanık duran sade bir manzara, ışık kısıldıkça netleşir" style="width:100%;height:100%;display:block">
      <defs>
        <filter id="hayret-blur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="14"></feGaussianBlur>
        </filter>
      </defs>
      <rect id="taban" x="0" y="0" width="1600" height="1000" fill="#efe6d6"></rect>
      <g id="katKaba" style="filter:url(#hayret-blur)"></g>
      <g id="katInce" style="opacity:0"></g>
      <rect id="ortu" x="0" y="0" width="1600" height="1000" fill="#efe6d6" opacity="0.55" style="pointer-events:none"></rect>
    </svg>
    <div class="ipucu" data-anim="" id="ipucu"><span id="ipucuMetin"></span></div>
  </div>

  <div class="kaydirici-blok">
    <div class="uc-etiket"><span id="etikBol"></span><span id="etikAz"></span></div>
    <input id="isikKaydirici" type="range" min="0" max="100" value="100" aria-label="Işık">
    <p class="caption" id="caption" data-anim="" aria-live="polite"><span id="captionMetin"></span></p>
  </div>

  <div id="kunyeYuvasi"></div>
</div>

<script>
const LA={
  tr:{
    title:'Karanlığı Görmek',
    sub:'Işık kısıldıkça sahne netleşir — hayret körlük değil, bir durak',
    hint:'Işığı kıs',
    bright:'Bol ışık',
    dim:'Az ışık',
    caption:'Bol ışık göze her şeyi gördüğünü söyler. Işık kısıldıkça sahne netleşir; başta görünmeyen katman ortaya çıkar.',
    sceneLabel:'Aydınlıkta bulanık duran sade bir manzara, ışık kısıldıkça netleşir',
    sliderLabel:'Işık',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?'
  },
  en:{
    title:'Seeing the Darkness',
    sub:'As the light dims, the scene sharpens — bewilderment is not blindness but a resting',
    hint:'Dim the light',
    bright:'Bright',
    dim:'Dim',
    caption:'Bright light tells the eye it sees everything. As the light dims, the scene sharpens; a layer that was not visible at first appears.',
    sceneLabel:'A plain landscape, blurred in bright light, sharpens as the light dims',
    sliderLabel:'Light',
    kunyeBaslik:'Sources — where this scene comes from'
  },
  pt:{
    title:'Ver a Escuridão',
    sub:'Quando a luz esmorece, a cena aguça-se — o espanto não é cegueira, é um repouso',
    hint:'Diminua a luz',
    bright:'Muita luz',
    dim:'Pouca luz',
    caption:'A luz forte diz ao olho que ele vê tudo. À medida que a luz diminui, a cena se aguça; uma camada antes invisível aparece.',
    sceneLabel:'Uma paisagem simples, desfocada em luz forte, torna-se nítida à medida que a luz diminui',
    sliderLabel:'Luz',
    kunyeBaslik:'Fontes — de onde vem esta cena'
  }
};

// Künye kayıtları: Dost'un cümleleri (dost) / bizim okumamız (okuma) / şerh (serh).
// Alıntılar p-blok doğrulamalı (docs/04-sahne-storyboard.md, S1).
const KUNYE=[
  {tur:'dost',
   metin:{tr:'“Karanlık bu menzilden öğrenilir; karanlık körlük ve dalalet demektir ki, o da hayrettir.”',
          en:'“Darkness is learned from this waypoint; darkness means blindness and error, which is bewilderment.”',
          pt:'“A escuridão aprende-se nesta estação; escuridão significa cegueira e erro, que é o espanto.”'},
   kaynak:{href:'futuhat/c14k153',etiket:'Fütûhât, bab 378 (c14k153)'}},
  {tur:'dost',
   metin:{tr:'“Allah hakkında en güçlü hayret, Allah’ı bilenlerde meydana gelir” — delili de Peygamber’in duası: “Benim Sendeki hayretimi artır.”',
          en:'“The strongest bewilderment regarding God occurs in those who know God” — with the Prophet’s prayer as evidence: “Increase me in bewilderment concerning You.”',
          pt:'“O mais forte espanto acerca de Deus ocorre naqueles que conhecem Deus” — com a oração do Profeta como prova: “Aumenta o meu espanto a Teu respeito.”'},
   kaynak:{href:'futuhat/c14k153',etiket:'Fütûhât, bab 378 (c14k153)'}},
  {tur:'dost',
   metin:{tr:'Bab 559, bab 39’dan aktarıyor: “dalalet hayret demektir.”',
          en:'Chapter 559 quotes chapter 39: “error means bewilderment.”',
          pt:'O capítulo 559 cita o capítulo 39: “erro significa espanto.”'},
   kaynak:{href:'futuhat/c17k224',etiket:'Fütûhât, bab 559 (c17k224)'}},
  {tur:'okuma',
   metin:{tr:'Hayret, sitenin Hâller sarmalında yolun son durağı olarak zaten duruyor; bu sahne o durağın bab 378 ile 559\'dan gelen yüzünü gösteriyor.',
          en:'Bewilderment already stands as the final station of this site\'s helix of States; this scene shows the face of that station as it comes from chapters 378 and 559.',
          pt:'O espanto já está presente como a estação final da hélice dos Estados deste site; esta cena mostra a face dessa estação tal como vem dos capítulos 378 e 559.'},
   kaynak:{href:'hal/hayret',etiket:'Hâller — Hayret'}},
  {tur:'okuma',
   metin:{tr:'Bize göre körlük de basiret de hayrette toplanıyor: biri dalalete doğru açılıyor, öteki kalp içinden geçiyor. Bu bir sonuç değil, elimizdeki pasajlardan bir okuma.',
          en:'In our reading, both blindness and insight gather in bewilderment: one opens toward error, the other passes through the heart. Not a conclusion — a reading of the passages we have.',
          pt:'Na nossa leitura, tanto a cegueira quanto a clarividência se reúnem no espanto: uma abre-se para o erro, a outra passa pelo coração. Não é uma conclusão — é uma leitura das passagens que temos.'},
   kaynak:{href:'futuhat/c16k218',etiket:'c16k218'}},
  {tur:'serh',
   metin:{tr:'Bab 39’daki “dalalet”in bağlamı Arapça asıldan henüz doğrulanmadı; sahne bu yüzden iki babın aynı cümleyi kurduğunu söylüyor, aynı iddia olduğunu değil.',
          en:'The context of “error” in chapter 39 is not yet verified against the Arabic original; hence the scene says the two chapters build the same sentence, not that they make the same claim.',
          pt:'O contexto de “erro” no capítulo 39 ainda não foi verificado no original árabe; por isso a cena diz que os dois capítulos constroem a mesma frase, não que fazem a mesma afirmação.'}}
];

const $=id=>document.getElementById(id);
let lang='tr';

function setLang(l){
  if(!LA[l]) return;
  lang=l;
  const d=LA[l];
  $('i-title').textContent=d.title;
  $('i-sub').textContent=d.sub;
  $('ipucuMetin').textContent=d.hint;
  $('etikBol').textContent=d.bright;
  $('etikAz').textContent=d.dim;
  $('captionMetin').textContent=d.caption;
  $('isikKaydirici').setAttribute('aria-label',d.sliderLabel);
  $('scene').setAttribute('aria-label',d.sceneLabel);
  kunye.guncelle(l);
}

// ── Künye bloğu (sahne-cizim.js'teki kunye() ile aynı desen, bu sahne
//    kendi kendine yeten olduğu için burada da doğrudan) ─────────────────
function kunyeKur(container, kayitlar, baslikMap){
  const det=document.createElement('details');
  det.className='sahne-kunye';
  const sum=document.createElement('summary');
  det.appendChild(sum);
  const ul=document.createElement('ul');
  det.appendChild(ul);
  const hucreLer=kayitlar.map(function(k){
    const li=document.createElement('li');
    li.className='sahne-kunye__'+(k.tur||'dost');
    const span=document.createElement('span');
    li.appendChild(span);
    if(k.kaynak){
      const a=document.createElement('a');
      a.href=k.kaynak.href;
      a.textContent=k.kaynak.etiket;
      li.appendChild(document.createTextNode(' — '));
      li.appendChild(a);
    }
    ul.appendChild(li);
    return span;
  });
  container.appendChild(det);
  return { el:det, guncelle:function(l){
    sum.textContent=(baslikMap && (baslikMap[l]||baslikMap.tr))||'Künye';
    kayitlar.forEach(function(k,i){ hucreLer[i].textContent=k.metin[l]||k.metin.tr; });
  }};
}
const kunye=kunyeKur($('kunyeYuvasi'), KUNYE, {tr:LA.tr.kunyeBaslik,en:LA.en.kunyeBaslik,pt:LA.pt.kunyeBaslik});

// ── Sahne: bol ışık ↔ az ışık ────────────────────────────────────────────
// GORSEL_DIL: davranış resmedilir, kavram değil. "Hayret" burada bir
// körlük değil — fazla ışığın gözü yanılttığı, ışık kısıldıkça asıl
// dokunun ortaya çıktığı bir an. KABA katman (bulanık, birkaç sıcak leke)
// bol ışıkta gözün "her şeyi gördüğünü sandığı" hâl; İNCE katman (net
// silüetler + toz + ipuçları) ışık kısıldıkça beliren, başta hiç
// görünmeyen asıl doku. İkisi de aynı sahnede hep var oldu — değişen
// yalnız üstlerindeki örtünün açıklığı.
const svgNS='http://www.w3.org/2000/svg';
const rand=(seed=>()=>(seed=(seed*9301+49297)%233280)/233280)(23);

const katKaba=$('katKaba');
const coarseBlobs=[
  { x:340, y:380, r:260 },
  { x:900, y:300, r:200 },
  { x:1200, y:620, r:300 },
  { x:600, y:720, r:240 },
  { x:1050, y:500, r:160 }
];
coarseBlobs.forEach(b=>{
  const c=document.createElementNS(svgNS,'circle');
  c.setAttribute('cx',b.x); c.setAttribute('cy',b.y); c.setAttribute('r',b.r);
  c.setAttribute('fill','#c9b48d');
  c.setAttribute('opacity',0.55);
  katKaba.appendChild(c);
});

const katInce=$('katInce');
const shapes={
  cypress:'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  hill:   'M 0 40 Q 20 8 40 40 Z',
  hill2:  'M 0 40 Q 12 22 22 30 Q 32 18 44 40 Z',
  bird:   'M 0 6 Q 8 -2 14 4 Q 20 -2 28 6',
  figure: 'M 20 6 A 4 4 0 1 1 19.9 6 M 20 12 L 20 28 L 12 40 M 20 28 L 28 40',
  arch:   'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  door:   'M 4 40 L 4 14 Q 4 2 20 2 Q 36 2 36 14 L 36 40 Z',
  moon:   'M 30 8 A 16 16 0 1 0 30 40 A 12 14 0 1 1 30 8 Z',
  leaf:   'M 20 4 Q 32 20 20 40 Q 8 20 20 4 Z',
  wave:   'M 0 20 Q 10 8 20 20 T 40 20'
};
const filled=new Set(['cypress','hill','hill2','arch','door','moon','leaf','figure']);
const keys=Object.keys(shapes);

const placed=[];
const target=130;
let attempts=0;
while(placed.length<target && attempts<target*40){
  attempts++;
  const x=40+rand()*1520;
  const y=40+rand()*920;
  const scale=0.5+rand()*1.1;
  const minDist=62*scale;
  let ok=true;
  for(const p of placed){
    const dx=p.x-x, dy=p.y-y;
    if(dx*dx+dy*dy<minDist*minDist){ ok=false; break; }
  }
  if(!ok) continue;
  placed.push({ x, y, scale, kind:keys[Math.floor(rand()*keys.length)] });
}
for(const p of placed){
  const g=document.createElementNS(svgNS,'g');
  const w=40*p.scale, h=40*p.scale;
  g.setAttribute('transform',`translate(${p.x-w/2} ${p.y-h}) scale(${p.scale})`);
  const el=document.createElementNS(svgNS,'path');
  el.setAttribute('d',shapes[p.kind]);
  if(filled.has(p.kind)){
    el.setAttribute('fill','#1a1108'); el.setAttribute('stroke','none');
  } else {
    el.setAttribute('fill','none'); el.setAttribute('stroke','#1a1108');
    el.setAttribute('stroke-width',1.4); el.setAttribute('stroke-linecap','round');
  }
  el.setAttribute('opacity',(0.7+rand()*0.25).toFixed(2));
  g.appendChild(el);
  katInce.appendChild(g);
}
// ince toz, silüetler arasında
for(let i=0;i<220;i++){
  const c=document.createElementNS(svgNS,'circle');
  c.setAttribute('cx',rand()*1600);
  c.setAttribute('cy',rand()*1000);
  c.setAttribute('r',0.7+rand()*1.1);
  c.setAttribute('fill','#1a1108');
  c.setAttribute('opacity',(0.35+rand()*0.35).toFixed(2));
  katInce.appendChild(c);
}
// belli belirsiz iplikler
for(let i=0;i<40;i++){
  const l=document.createElementNS(svgNS,'path');
  const x=rand()*1600, y=rand()*1000;
  const dx=(rand()-0.5)*260, dy=(rand()-0.5)*40;
  l.setAttribute('d',`M ${x} ${y} q ${dx/2} ${dy-8} ${dx} 0`);
  l.setAttribute('stroke','#1a1108');
  l.setAttribute('stroke-width',0.9);
  l.setAttribute('fill','none');
  l.setAttribute('opacity',(0.28+rand()*0.22).toFixed(2));
  katInce.appendChild(l);
}

const taban=$('taban');
const ortu=$('ortu');
const kaydirici=$('isikKaydirici');
const ipucu=$('ipucu');

// parlaklık: 100 = tam aydınlık (ince katman gizli, kaba katman baskın)
//             0   = kısık   (ince katman net, kaba katman sönük)
function isikUygula(v){
  const t=v/100;
  ortu.setAttribute('opacity',(0.15+t*0.75).toFixed(3));
  const inceOp=Math.max(0,1-t*1.15);
  katInce.style.opacity=inceOp.toFixed(3);
  katKaba.style.opacity=(0.35+t*0.55).toFixed(3);
  const bgL=(0.94-(1-t)*0.10).toFixed(3);
  taban.setAttribute('fill',`oklch(${bgL} 0.015 70)`);
  ortu.setAttribute('fill',`oklch(${bgL} 0.015 70)`);
}

kaydirici.addEventListener('input',e=>{
  isikUygula(+e.target.value);
  ipucu.style.animation='none';
});
kaydirici.step='1';

isikUygula(100);

const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion){
  // "Hayret" durağını sabit göster: ne tam aydınlık ne tam kısık, ikisi
  // birden okunabilir olsun.
  kaydirici.value=45;
  isikUygula(45);
  const cap=$('caption');
  cap.style.animation='none';
  cap.style.opacity='1';
  ipucu.style.animation='none';
}

setLang('tr');
window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang' && LA[e.data.lang]) setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (site geneli desen; iframe içinde çizme).
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
</body>
</html>
