<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- İlâh-ı mu'tekad — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D14) -->
<title>İnandığın Tanrı — Dost Arabi</title>
<style>
:root{--bg:#09080F;--surface:#12101A;--border:#2A2438;--text:#E8E2D0;--muted:#6E6558;--gold:#FFC94D;--liminal:#C89040;--panel:#14101E}
@media(prefers-color-scheme:light){:root{--bg:#F5F2EA;--surface:#EDE8DC;--border:#C8BEA0;--text:#221810;--muted:#665845;--panel:#E8E2D4;--gold:#7A5200;--liminal:#7E5410}}
:root[data-theme=dark]{--bg:#09080F;--surface:#12101A;--border:#2A2438;--text:#E8E2D0;--muted:#6E6558;--panel:#14101E;--gold:#FFC94D;--liminal:#C89040}
:root[data-theme=light]{--bg:#F5F2EA;--surface:#EDE8DC;--border:#C8BEA0;--text:#221810;--muted:#665845;--panel:#E8E2D4;--gold:#7A5200;--liminal:#7E5410}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}

#stage{width:min(430px,92vw);height:min(430px,92vw);display:block;margin:.4rem auto .9rem;background:var(--panel);border:1px solid var(--border);border-radius:12px}

.soru-alani{width:min(560px,96vw);min-height:8.4rem}
.soru{font-size:.95rem;line-height:1.6;margin-bottom:.9rem;text-align:center}
.secenekler{display:flex;flex-direction:column;gap:.5rem}
.secenek{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem .85rem;font:inherit;font-size:.85rem;line-height:1.5;text-align:left;cursor:pointer;transition:border-color .2s,color .2s}
.secenek:hover{border-color:var(--liminal)}
.secenek:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}
.secenek.secili{border-color:var(--gold);color:var(--gold)}

.ilerleme{font-size:.74rem;color:var(--muted);text-align:center;margin-bottom:.7rem;letter-spacing:.05em}

.kapanis{width:min(560px,96vw);text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1.2s ease,transform 1.2s ease}
.kapanis.show{opacity:1;transform:none}
.kapanis-1{font-size:1rem;line-height:1.8;color:var(--text);margin-bottom:.5rem}
.kapanis-2{font-size:1rem;line-height:1.8;color:var(--liminal);font-style:italic}

.quote-box{width:min(560px,96vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-top:1.3rem}
.quote-text{font-size:.87rem;line-height:1.75;font-style:italic}
.quote-src{font-size:.72rem;color:var(--muted);margin-top:.55rem}

.eylemler{display:flex;gap:.7rem;justify-content:center;margin-top:1.1rem;flex-wrap:wrap}
.eylem{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:2rem;padding:.4rem 1rem;font:inherit;font-size:.78rem;cursor:pointer;transition:.2s}
.eylem:hover{border-color:var(--liminal);color:var(--text)}
.eylem:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}

.kardes{width:min(560px,96vw);text-align:center;margin-top:1.1rem;font-size:.75rem;line-height:1.6}
.kardes a{color:var(--liminal);text-decoration:none;border-bottom:1px solid var(--border)}
.kardes a:hover,.kardes a:focus-visible{border-bottom-color:var(--liminal)}

.yontem{width:min(560px,96vw);margin-top:1.4rem;font-size:.74rem;line-height:1.7;color:var(--muted);text-align:center}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}

/* ETKILESIM_DILI.md: hareket "atlanır, taklit edilmez". Kardeş sahneler
   (berzah, nefes-i-rahmani...) bu kuralı baştan taşıyordu; bu sayfada
   unutulmuştu -- 2026-08-05 çapraz denetiminde yedi sayfada birden
   yakalandı. Süreleri sıfırlamak animasyonun SON karesini gösterir:
   içerik kaybolmaz, yalnız hareket kalkar. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>

<header>
  <h1 id="hTitle">İnandığın Tanrı</h1>
  <p class="sub" id="hSub"></p>
</header>

<svg id="stage" viewBox="0 0 430 430" role="img" aria-label="Verilen cevaplarla kapanan bir sınır"></svg>

<p class="ilerleme" id="ilerleme"></p>

<div class="soru-alani" id="soruAlani">
  <p class="soru" id="soruMetni"></p>
  <div class="secenekler" id="secenekler" role="group"></div>

  <p class="kapanis-1" id="kapanis1"></p>

</div>

<div class="eylemler">
  <button class="eylem" id="geriBtn" type="button"></button>
  <button class="eylem" id="yenidenBtn" type="button"></button>
</div>

<div class="quote-box">

<p class="kardes"><a id="kardesLink" href="perde-zinciri.html"></a></p>

<p class="yontem" id="yontem"></p>

<script>
// ── Metin ────────────────────────────────────────────────────────────────────
// Sorular bir kişilik testi DEĞİL: her biri geleneğin kendi ekseni olan
// tenzih (O'nu her benzerlikten uzaklaştırmak) ile teşbih (O'nu benzerlikle
// anmak) arasında bir yerde duruyor. Hiçbir cevap ötekinden "daha doğru"
// değil -- sahnenin iddiası zaten bu değil.
const LA={
  tr:{
    title:'İnandığın Tanrı',
    sub:'Dost’a göre herkes kendi inancındaki Tanrı’ya inanır ve O’nu öyle görür. Aşağıdaki beş soru bir sınav değil; cevapların bir sûret çiziyor. Sonunda ne olduğuna bak.',
    ilerleme:(a,b)=>`${a} / ${b} soru`,
    geri:'← bir soru geri',
    yeniden:'baştan',
    kapanis1:'İşte bu senin ilâhın — dünyada tuttuğun sûret.',
    kapanis2:'Ve O, bu sûretin de ötesinde: “herhangi bir sınır altına girmekten münezzeh.”',
    kardes:'Kardeş sahne: Perde Zinciri — bütün perdeler aralanır, merkez yine de netleşmez →',
    yontem:'İki alıntı Dost’un: rü’yetin dünyadaki inanca bağlı oluşu (s. 342) ve hiçbir sınıra girmeyişi (s. 343). Soruları ve “her cevap bir sınır çizer” okumasını biz kurduk. Bunun “her inanç eşit derecede doğrudur” demek olup olmadığı metinde net bir çizgiyle ayrılmıyor; biz tek bir kısımdan kesin bir okuma çıkarmaktan kaçınıyoruz.',
    sorular:[
      { q:'O’nu düşündüğünde bir sûret canlanıyor mu?',
        a:['Hayır — hiçbir şeye benzemiyor','Bir şey canlanıyor ama tutamıyorum','Evet, oldukça belirgin'] },
      { q:'Sana yakın mı, yoksa erişilmez mi?',
        a:['Şah damarımdan yakın','İkisi birden — ve bunu çözemiyorum','Mutlak olarak ötede'] },
      { q:'O’nu daha çok neyle tanıyorsun?',
        a:['Akılla, düşünerek','Yaşayarak, kalple','Bir başkasının sözüne güvenerek'] },
      { q:'Sana hitap ediyor mu?',
        a:['Evet, karşılıklı bir konuşma','Bazen — ve emin olamıyorum','Hayır, hitabın ötesinde'] },
      { q:'Senin gibi bir şeye benziyor mu?',
        a:['Hiçbir şekilde','Bir yanıyla evet, bir yanıyla hayır','Bir bakıma evet'] },
    ],
    quotes:[
      { text:'"Ziyaret günü (Hakkı) görmek, dünyadaki inançlara bağlıdır." — "Böyle yaparsa, inanç her ne olursa olsun, Ziyaret günü onun ürününü devşirir. İşte bu, geniş ilahi bilgidir."', src:'Fütûhât-ı Mekkiyye, Cilt VI, Kısım LXXXV — s. 342' },
      { text:'"Allah, herhangi bir sınır altına girmekten ya da -biri değil de- diğer bir suretle sınırlanmaktan münezzehtir. Buradan Allah’ın bütün yaratıklarına ait genel mutluluk ve her şeyi kuşatan rahmetin genişliği öğrenilir."', src:'Fütûhât-ı Mekkiyye, Cilt VI, Kısım LXXXV — s. 343' },
    ],
  },
  en:{
    title:'The God You Believe In',
    sub:'For Dost, everyone believes in the God of their own belief, and sees Him accordingly. The five questions below are not a test; your answers draw a form. Look at what happens at the end.',
    ilerleme:(a,b)=>`${a} / ${b} questions`,
    geri:'← one question back',
    yeniden:'start over',
    kapanis1:'This is your god — the form you held in this world.',
    kapanis2:'And He is beyond this form too: “beyond entering under any limit whatsoever.”',
    kardes:'Sibling scene: Chain of Veiling — every veil parts, and the centre still does not resolve →',
    yontem:'Two quotations are Dost’s: that the vision depends on belief held in this world (p. 342), and that He enters under no limit (p. 343). The questions, and the reading that “every answer draws a limit,” are ours. Whether this amounts to “every belief is equally true” is not settled by a clear line in the text; we avoid drawing a firm reading from a single part.',
    sorular:[
      { q:'When you think of Him, does a form appear?',
        a:['No — nothing resembles Him','Something appears, but I cannot hold it','Yes, quite distinctly'] },
      { q:'Is He near to you, or out of reach?',
        a:['Nearer than my jugular vein','Both at once — and I cannot resolve it','Absolutely beyond'] },
      { q:'How do you mostly come to know Him?',
        a:['By reason, by thinking','By living it, with the heart','By trusting another’s word'] },
      { q:'Does He address you?',
        a:['Yes, a conversation both ways','Sometimes — and I cannot be sure','No, beyond address'] },
      { q:'Does He resemble anything like you?',
        a:['In no way at all','In one respect yes, in another no','In a manner of speaking, yes'] },
    ],
    quotes:[
      { text:'"Seeing (the Real) on the Day of Visitation depends upon the beliefs held in this world." — "If one does so, then whatever the belief may be, on the Day of Visitation he harvests its fruit. This is the vast divine knowledge."', src:'al-Futuhat al-Makkiyya, Vol. VI, Part LXXXV — p. 342' },
      { text:'"God is beyond entering under any limit, or being confined by one form rather than another. From this is learned the breadth of the general felicity belonging to all His creatures, and of the all-encompassing mercy."', src:'al-Futuhat al-Makkiyya, Vol. VI, Part LXXXV — p. 343' },
    ],
  },
  pt:{
    title:'O Deus em Que Você Crê',
    sub:'Para Dost, cada um crê no Deus da sua própria crença e O vê conforme ela. As cinco perguntas abaixo não são um teste; suas respostas desenham uma forma. Veja o que acontece no fim.',
    ilerleme:(a,b)=>`${a} / ${b} perguntas`,
    geri:'← uma pergunta atrás',
    yeniden:'recomeçar',
    kapanis1:'Este é o seu deus — a forma que você sustentou neste mundo.',
    kapanis2:'E Ele está além desta forma também: “além de entrar sob qualquer limite.”',
    kardes:'Cena irmã: Cadeia de Véus — todos os véus se afastam, e o centro ainda não se resolve →',
    yontem:'Duas citações são de Dost: que a visão depende da crença mantida neste mundo (p. 342) e que Ele não entra sob limite algum (p. 343). As perguntas, e a leitura de que “cada resposta traça um limite”, são nossas. Se isso equivale a “toda crença é igualmente verdadeira” não é separado por uma linha clara no texto; evitamos extrair uma leitura firme de uma única parte.',
    sorular:[
      { q:'Quando você pensa Nele, surge uma forma?',
        a:['Não — nada se parece com Ele','Algo surge, mas não consigo segurar','Sim, bastante nítida'] },
      { q:'Ele está perto de você ou fora de alcance?',
        a:['Mais perto que minha veia jugular','Ambos ao mesmo tempo — e não resolvo isso','Absolutamente além'] },
      { q:'Como você mais O conhece?',
        a:['Pela razão, pensando','Vivendo, com o coração','Confiando na palavra de outrem'] },
      { q:'Ele se dirige a você?',
        a:['Sim, uma conversa de mão dupla','Às vezes — e não tenho certeza','Não, além de toda fala'] },
      { q:'Ele se parece com algo como você?',
        a:['De modo algum','Num aspecto sim, noutro não','De certa maneira, sim'] },
    ],
    quotes:[
      { text:'"Ver (o Real) no Dia da Visitação depende das crenças mantidas neste mundo." — "Se assim fizer, qualquer que seja a crença, no Dia da Visitação ele colhe o seu fruto. Este é o vasto conhecimento divino."', src:'al-Futuhat al-Makkiyya, Vol. VI, Parte LXXXV — p. 342' },
      { text:'"Deus está além de entrar sob qualquer limite, ou de ser confinado a uma forma em vez de outra. Disto se aprende a amplitude da felicidade geral pertencente a todas as Suas criaturas, e da misericórdia que tudo abarca."', src:'al-Futuhat al-Makkiyya, Vol. VI, Parte LXXXV — p. 343' },
    ],
  },
};

let curLang='tr', adim=0, cevaplar=[], quoteIdx=0;
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const svg=$('stage');
const CX=215, CY=215;
const N=5;                      // soru sayısı = sınırın kenar sayısı
const RADYUS=[150,112,74];      // cevap indeksi → sınırın o yöndeki uzaklığı

// ── Sahne ────────────────────────────────────────────────────────────────────
// GORSEL_DIL.md: Zât'ı parlak bir cisim gibi ÇİZME. Bu yüzden sahnede
// çizilen tek şey KULLANICININ kendi sınırı. Karanlık alan boyanmıyor,
// adlandırılmıyor, ışıtılmıyor -- yalnız duruyor ve hiç küçülmüyor.
// Sessizlik, yokluk ve imkânsız derinlik: dosyanın istediği tam olarak bu.
//
// Her cevap bir KENAR çiziyor: bir imkânı kapatıyor. Cevaplar arttıkça
// sûret hem netleşiyor hem KÜÇÜLÜYOR -- çünkü her itikat bir sınırdır.
// Sınır kapanmadan (son soruya kadar) çokgen AÇIK kalıyor; kapanmamış bir
// inanç, henüz kapanmamış bir sûrettir.
svg.innerHTML=`
<defs>
  <radialGradient id="gIc" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="var(--gold)"    stop-opacity=".20"/>
    <stop offset="70%"  stop-color="var(--liminal)" stop-opacity=".10"/>
    <stop offset="100%" stop-color="var(--liminal)" stop-opacity="0"/>
  </radialGradient>
  <filter id="derinlik" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="5" seed="41" result="n"/>
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.05  0 0 0 0 0.042  0 0 0 0 0.035  0 0 0 1.5 -0.46"/>
  </filter>
  <clipPath id="cl"><rect x="0" y="0" width="430" height="430" rx="12"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect x="-40" y="-40" width="510" height="510" fill="#000" filter="url(#derinlik)" opacity=".55"/>
  <path id="dolgu" fill="url(#gIc)" opacity="0"></path>
  <path id="sinir" fill="none" stroke="var(--gold)" stroke-width="1.6"
        stroke-linejoin="round" stroke-linecap="round" opacity=".92"></path>
  <g id="isaretler"></g>
</g>`;

// Beş yön: tepeden başlayıp saat yönünde. Her soru bir yöne karşılık geliyor.
function yon(i){ const a=-Math.PI/2 + (i/N)*2*Math.PI; return {x:Math.cos(a), y:Math.sin(a)}; }
function nokta(i, r){ const d=yon(i); return [CX+d.x*r, CY+d.y*r]; }

// Cevaplanmamış yönler için "henüz sınır yok": çok uzakta, karanlığa karışan
// bir uç. Sınır oraya kadar çizilmiyor -- yol açık bırakılıyor.
function cizim(){
  const pts=[];
  for(let i=0;i<N;i++){
    // Yalnız GERÇEKTEN verilmiş kararlar sınır çiziyor. Bir soru geri
    // alındığında o kenar da kalkar -- yoksa sahne yalan söylerdi:
    // kapanmış bir sûret, geri alınmış bir cevapla kapalı kalamaz.
    const c = i < adim ? cevaplar[i] : undefined;
    pts.push(c===undefined ? null : nokta(i, RADYUS[c]));
  }
  // Yalnız ARDIŞIK iki cevaplı yön arasında kenar var.
  let d='';
  for(let i=0;i<N;i++){
    const a=pts[i], b=pts[(i+1)%N];
    if(a && b){ d += `M ${a[0].toFixed(1)} ${a[1].toFixed(1)} L ${b[0].toFixed(1)} ${b[1].toFixed(1)} `; }
  }
  $('sinir').setAttribute('d', d.trim());

  // Kapanmış mı? Hepsi cevaplandıysa çokgen kapanır ve içi ışır.
  const kapali = pts.every(Boolean);
  if(kapali){
    let dd='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(let i=1;i<N;i++) dd+=' L '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);
    dd+=' Z';
    $('dolgu').setAttribute('d', dd);
    $('dolgu').setAttribute('opacity','1');
  } else {
    $('dolgu').setAttribute('opacity','0');
  }

  // Cevaplanan her yönün ucunda küçük bir işaret: verilmiş bir karar.
  const g=$('isaretler'); g.innerHTML='';
  pts.forEach((p)=>{
    if(!p) return;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',p[0].toFixed(1)); c.setAttribute('cy',p[1].toFixed(1));
    c.setAttribute('r','2.6'); c.setAttribute('fill','var(--gold)');
    g.appendChild(c);
  });
}

// ── Akış ─────────────────────────────────────────────────────────────────────
function render(){
  const t=LA[curLang];
  $('hTitle').textContent=t.title;
  $('hSub').textContent=t.sub;
  $('geriBtn').textContent=t.geri;
  $('yenidenBtn').textContent=t.yeniden;
  $('kapanis1').textContent=t.kapanis1;
  $('kapanis2').textContent=t.kapanis2;
  $('kardesLink').textContent=t.kardes;
  $('yontem').textContent=t.yontem;
  const q=t.quotes[quoteIdx];
  $('quoteText').textContent=q.text;
  $('quoteSrc').textContent=q.src;

  const bitti = adim>=N;
  $('ilerleme').textContent = t.ilerleme(Math.min(adim,N), N);
  $('soruAlani').style.display = bitti ? 'none' : '';
  $('geriBtn').style.display = adim>0 ? '' : 'none';
  $('yenidenBtn').style.display = adim>0 ? '' : 'none';
  $('kapanis').classList.toggle('show', bitti);

  if(!bitti){
    const s=t.sorular[adim];
    $('soruMetni').textContent=s.q;
    const kutu=$('secenekler'); kutu.innerHTML='';
    kutu.setAttribute('aria-label', s.q);
    s.a.forEach((metin,i)=>{
      const b=document.createElement('button');
      b.type='button'; b.className='secenek'+(cevaplar[adim]===i?' secili':'');
      b.textContent=metin;
      b.addEventListener('click',()=>{ cevaplar[adim]=i; adim++; cizim(); render(); });
      kutu.appendChild(b);
    });
    const ilk=kutu.querySelector('.secenek');
    if(ilk && document.activeElement && document.activeElement.classList.contains('secenek')) ilk.focus();
  }
  cizim();
}

function setLang(l){ if(LA[l]){ curLang=l; document.documentElement.lang=l; render(); } }

$('geriBtn').addEventListener('click',()=>{ if(adim>0){ adim--; render(); } });
$('yenidenBtn').addEventListener('click',()=>{ adim=0; cevaplar=[]; $('kapanis').classList.remove('show'); render(); });

setInterval(()=>{
  const qs=LA[curLang].quotes;
  quoteIdx=(quoteIdx+1)%qs.length;
  $('quoteText').textContent=qs[quoteIdx].text;
  $('quoteSrc').textContent=qs[quoteIdx].src;
}, 11000);

render();

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "\u2190 " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
