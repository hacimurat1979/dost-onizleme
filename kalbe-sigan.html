<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Sığmayanın Sığdığı — Dost Arabi. docs/04 S4. Kudsî hadis dört ciltte.
     "İçi dışı kadar parlak" — çevre aydınlığı diner + kabın iç degradesi
     sabit kalır (storyboard iki prototipinden birincisi seçildi). -->
<title>Sığmayanın Sığdığı — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614}
:root[data-theme=light]{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--go);margin-bottom:.45rem}
.sub{color:var(--mu);font-size:.88rem;font-style:italic;line-height:1.65;max-width:520px}
.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px}

.stage-wrap{position:relative;width:min(640px,92vw);aspect-ratio:16/10;margin:.5rem auto 1rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:12px;right:16px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);animation:ks-pulse 3s ease-in-out 1.2s 3}
#ksGok,#ksYer,#ksKalpDis,#ksKalpIci,#ksOuterContent,#ksOuterBound{transition:opacity 1.6s ease}

.track-wrap{width:min(560px,92vw);margin:0 auto}
.track-labels{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mu);margin-bottom:.5rem}
#slider{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;padding:0;margin:0;cursor:pointer;display:block}
#slider::-webkit-slider-runnable-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-moz-range-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--go);border:2px solid var(--pa);margin-top:-10px;box-shadow:0 0 0 1px var(--am)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--go);border:2px solid var(--pa);box-shadow:0 0 0 1px var(--am)}
#slider:focus{outline:none}
#slider:focus-visible::-webkit-slider-thumb,#slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--am)}

.caption-wrap{width:min(560px,92vw);margin:.75rem auto 0;text-align:center;opacity:0;transition:opacity 1s ease}
.caption-wrap.gorunur{opacity:1}
.caption{font-size:.88rem;line-height:1.75;color:var(--tx);min-height:3.2em}

@keyframes ks-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.hint{animation:none}}

.track-wrap,.hint{opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .track-wrap,body.sahne-bitti .hint{opacity:1;max-height:80px}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.5rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--mu);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--bo);color:var(--mu);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--am);color:var(--tx)}

@media(prefers-reduced-motion:no-preference){
  .ks-nefes{animation:ksNefes 7s ease-in-out infinite}
}
@keyframes ksNefes{0%,100%{opacity:1}50%{opacity:.85}}

.sahne-kunye{width:min(560px,92vw);margin-top:1.2rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye ul{list-style:none;margin-top:.7rem}.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--mu)}
.sahne-kunye li.sahne-kunye__serh{color:var(--mu);font-size:.76rem}
.sahne-kunye a{color:var(--am);text-decoration:none;border-bottom:1px solid var(--bo);white-space:nowrap}

.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;font-family:inherit;text-decoration:none;opacity:.72;border:1px solid var(--bo);background:var(--su);color:var(--mu)}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;color:var(--tx);border-color:var(--go)}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}

/* Dört yer, tek kalp (Yakınsama Deseni, 2026-08-14): künyedeki dört gerçek
   geçiş, kabın çevresinde dört iz olarak beliriyor. */
#dortYer a{cursor:pointer}
#dortYer a:focus-visible{outline:2px solid var(--am);outline-offset:4px}
#dortYer a:hover .dort-yer-halka,#dortYer a:focus-visible .dort-yer-halka{opacity:1}
#dortYer a:hover .dort-yer-etiket,#dortYer a:focus-visible .dort-yer-etiket{opacity:1}
.dort-yer-etiket{opacity:.62;transition:opacity .2s ease}
.dort-yer-halka{transition:opacity .2s ease}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="i-title">Sığmayanın Sığdığı</h1>
  <p class="sub" id="i-sub">"Beni yerim ve göğüm sığdıramadı, mümin kulumun kalbi sığdırdı." — kudsî hadis, dört ciltte</p>
</header>

<div class="sw">
  <div class="stage-wrap">
    <svg id="scene" viewBox="0 0 1600 1000" role="group" aria-label="Kendi kendini anlatan sahne: taşan aydınlık, boş kalan iki büyük kap, dışı kadar parlayan küçük bir kalp">
      <defs>
        <radialGradient id="ksKapGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--go)" stop-opacity="0.95"/>
          <stop offset="45%" stop-color="var(--go)" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="var(--go)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Dış alan: sınır dikdörtgeni + toz + uzak silüetler. Kaydırıcı bu
           grubu merkez (800,500) etrafında ölçekler ve ters-kare söndürür. -->
      <g id="ksOuter" transform="translate(800 500) scale(1) translate(-800 -500)">
        <rect id="ksOuterBound" x="200" y="150" width="1200" height="700" fill="none" stroke="var(--bo)" stroke-width="1.5" opacity="0.5" stroke-dasharray="8 8"/>
        <g id="ksOuterContent"></g>
      </g>

      <!-- Üç kap: gök ve yer aydınlanır ama içleri boş kalır (yalnız ana
           hat + soluk hâle); kalp aydınlanınca içi de dışarısı kadar
           parlar (dolgu + çekirdek de belirir). Kaydırıcı (kendim
           gezineyim kipi) yalnız dış alanı ölçekler -- bu üç grup ondan
           bağımsız, motorun kendi ölçülerine göre değişir. -->
      <g id="ksGok" opacity="0" transform="translate(800 260)">
        <circle r="70" fill="url(#ksKapGlow)" opacity="0.4"></circle>
        <circle r="22" fill="none" stroke="var(--tx)" stroke-width="1.6"></circle>
      </g>
      <g id="ksYer" opacity="0" transform="translate(800 740)">
        <circle r="70" fill="url(#ksKapGlow)" opacity="0.4"></circle>
        <circle r="22" fill="none" stroke="var(--tx)" stroke-width="1.6"></circle>
      </g>
      <g id="ksKalpDis" opacity="0" transform="translate(800 500)">
        <circle r="30" fill="none" stroke="var(--tx)" stroke-width="2"></circle>
      </g>
      <g id="ksKalpIci" opacity="0" transform="translate(800 500)">
        <circle r="120" fill="url(#ksKapGlow)"></circle>
        <circle r="28" fill="var(--go)"></circle>
        <circle r="6" fill="var(--tx)"></circle>
      </g>
    </svg>
    <div class="hint" id="hint"><span id="hintText"></span></div>
  </div>

  <div class="track-wrap">
    <div class="track-labels">
      <span id="lblNear"></span>
      <span id="lblFar"></span>
    </div>
    <input id="slider" type="range" min="0" max="100" value="20" aria-label="Dış alanın ölçeği">
  </div>
  <div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>
  <div class="caption-wrap" id="captionWrap">
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <div id="kunyeYuvasi"></div>
</div>

<!-- i18n.js önce yüklenmeli: sahne-motoru.js modül-yükleme anında
     window.DostI18n.pick3'ü okuyor (2026-08-15 bulgusu, bkz. hayret.html/
     kandil.html aynı düzeltme). -->
<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script>
const L={
  tr:{
    title:'Sığmayanın Sığdığı',
    sub:'"Beni yerim ve göğüm sığdıramadı, mümin kulumun kalbi sığdırdı." — kudsî hadis, dört ciltte',
    hint:'Sahne durdu — dış alanı artık sen ölçekle', near:'Dar', far:'Uçsuz',
    sliderLabel:'Dış alanın ölçeği',
    caption:'Dış alan büyüdükçe yoğunluğu düşer; küçüldükçe artar. Ortadaki kap ise ne büyür ne söner — sığmaz görünen ona sığar, hacim işi değildir.',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?',
    dortYerLabel:'Aynı hadis, dört yerde',
  },
  en:{
    title:'What Cannot Be Contained, Contained',
    sub:'"Neither My earth nor My heaven contained Me, but the heart of My believing servant did." — a divine hadith across four volumes',
    hint:'The scene has settled — now scale the outer field yourself', near:'Narrow', far:'Vast',
    sliderLabel:'Scale of the outer field',
    caption:'As the outer field widens, its brightness thins; as it narrows, it swells. The vessel at the center neither grows nor dims — what cannot fit is held by it, and it is not a matter of volume.',
    kunyeBaslik:'Sources — where this scene comes from',
    dortYerLabel:'The same hadith, in four places',
  },
  pt:{
    title:'O que Não Cabe, Cabendo',
    sub:'"Nem a Minha terra nem o Meu céu Me contiveram, mas o coração do Meu servente crente conteve." — um hadith divino em quatro volumes',
    hint:'A cena parou — agora dimensione você mesmo a área externa', near:'Estreito', far:'Vasto',
    sliderLabel:'Escala do campo externo',
    caption:'À medida que a área externa se alarga, sua intensidade se dilui; ao estreitar-se, aumenta. O vaso central nem cresce nem se apaga — o que não caberia nele cabe, e isso não é uma questão de volume.',
    kunyeBaslik:'Fontes — de onde vem esta cena',
    dortYerLabel:'O mesmo hadith, em quatro lugares',
  }
};

const KUNYE=[
  {tur:'dost',metin:{tr:'“Beni yerim ve göğüm sığdıramadı, mümin kulumun kalbi sığdırdı.”',en:'“My earth and My heaven did not contain Me, but the heart of My believing servant did.”',pt:'“A Minha terra e o Meu céu não Me contiveram, mas o coração do Meu servente crente conteve.”'},kaynak:{href:'futuhat/c2k24',etiket:'Fütûhât (c2k24)'}},
  {tur:'dost',metin:{tr:'“Beni mümin kulumun kalbi sığdırdı” kudsî hadisi arifin kalbinin genişliğine bağlanıyor.',en:'The divine hadith “the heart of My believing servant contained Me” is tied to the breadth of the knower’s heart.',pt:'O hadith divino “o coração do Meu servente crente conteve-Me” é ligado à amplitude do coração do conhecedor.'},kaynak:{href:'futuhat/c4k42',etiket:'c4k42'}},
  {tur:'dost',metin:{tr:'Aynı hadis burada da: “Beni yerim ve göğüm sığdıramadı, mümin kulumun kalbi sığdırdı.”',en:'The same hadith here too: “My earth and My heaven did not contain Me, but the heart of My believing servant did.”',pt:'O mesmo hadith aqui também: “A Minha terra e o Meu céu não Me contiveram, mas o coração do Meu servente crente conteve.”'},kaynak:{href:'futuhat/c14k165',etiket:'c14k165'}},
  {tur:'dost',metin:{tr:'“Dayanağı da kutsî hadis: ‘Beni mümin kulumun kalbi sığdırdı.’”',en:'“Its ground is the divine hadith: ‘the heart of My believing servant contained Me.’”',pt:'“O seu fundamento é o hadith divino: ‘o coração do Meu servente crente conteve-Me.’”'},kaynak:{href:'futuhat/c15k190',etiket:'c15k190'}},
  {tur:'okuma',metin:{tr:'Bu sahne S3 ile aynı aileden ama iddiası farklı: S3’te kaplar ışığa göre değişir; burada ışık kaba sığar. İçin dışarısı kadar parlak olabilmesi için çevre aydınlığı diner — hacim kaybı değil, ölçünün gramerinin gereği.',en:'This scene is of the same family as S3 but its claim differs: in S3 vessels vary with the light; here the light fits itself into the vessel. For the inside to be as bright as the outside, the outer brightness quiets — not a loss of scale, but a requirement of the measure’s grammar.',pt:'Esta cena pertence à mesma família que S3, mas a sua afirmação difere: em S3 os vasos variam com a luz; aqui a luz cabe-se no vaso. Para que o interior seja tão brilhante quanto o exterior, a luminosidade exterior aquieta-se — não é uma perda de escala, mas uma exigência da gramática do compasso.'}},
  {tur:'serh',metin:{tr:'Bu kudsî hadisin senedi tartışmalıdır (`hadis-dizini.json` bunu kendi notunda söylüyor); yaygın kabulüne rağmen kaynakta bir açık soru olarak duruyor.',en:'The chain of transmission of this divine hadith is disputed (as `hadis-dizini.json` itself notes); despite its wide acceptance, it stands as an open question in the source.',pt:'A cadeia de transmissão deste hadith divino é disputada (como o próprio `hadis-dizini.json` observa); apesar da sua ampla aceitação, permanece como uma questão em aberto na fonte.'}}
];

const $=id=>document.getElementById(id);
let lang='tr';

// ── Künye bloğu (assets/sahne-cizim.js'in kunye() işlevine denk, bu sahne
// içinde bağımsız kuruluyor — sahne artık paylaşılan çizim script'ine muhtaç
// değil). Kapalı <details>, panel varsayılan kapalı (ETKILESIM_DILI).
function kunyeOlustur(container, kayitlar, baslik){
  const det=document.createElement('details'); det.className='sahne-kunye';
  const sum=document.createElement('summary'); det.appendChild(sum);
  const ul=document.createElement('ul'); det.appendChild(ul);
  const hucreler=kayitlar.map(k=>{
    const li=document.createElement('li'); li.className='sahne-kunye__'+(k.tur||'dost');
    const span=document.createElement('span'); li.appendChild(span);
    if(k.kaynak){
      const a=document.createElement('a'); a.href=k.kaynak.href; a.textContent=k.kaynak.etiket;
      li.appendChild(document.createTextNode(' — ')); li.appendChild(a);
    }
    ul.appendChild(li); return span;
  });
  container.appendChild(det);
  function guncelle(l){
    sum.textContent=(baslik&&(baslik[l]||baslik.tr))||'Künye';
    kayitlar.forEach((k,i)=>{ hucreler[i].textContent=k.metin[l]||k.metin.tr; });
  }
  return {el:det, guncelle};
}
const kunye=kunyeOlustur($('kunyeYuvasi'), KUNYE, {tr:L.tr.kunyeBaslik,en:L.en.kunyeBaslik,pt:L.pt.kunyeBaslik});

function setLang(l){
  if(!L[l]) return;
  lang=l;
  const d=L[l];
  $('i-title').textContent=d.title;
  $('i-sub').textContent=d.sub;
  $('hintText').textContent=d.hint;
  $('lblNear').textContent=d.near;
  $('lblFar').textContent=d.far;
  if(sonMetin) $('caption').textContent=sonMetin[l]||sonMetin.tr;
  $('slider').setAttribute('aria-label', d.sliderLabel);
  kunye.guncelle(l);
  if(dortYerLabelEl) dortYerLabelEl.textContent=d.dortYerLabel;
  sahneMetniniGuncelle();
}
let sonMetin=null;

// ── Sahne: dış alan uzaklaştıkça sönüyor, kap hiç değişmiyor ───────────────
// GORSEL_DIL.md: soyut ok yok, iç içe eşmerkezli çember yok, sahte 3B yok.
// Kap parlak bir "Zât" değil — sabit güçte bir ışık kaynağı; asıl gösterilen
// davranış dış alanın ölçekle ters-kare sönmesi.
const svgNS='http://www.w3.org/2000/svg';
const outerContent=$('ksOuterContent');

let seed=71;
const rand=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };

for(let i=0;i<260;i++){
  const x=220+rand()*1160, y=170+rand()*660;
  const dx=x-800, dy=y-500;
  if(dx*dx+dy*dy<190*190) continue;
  const c=document.createElementNS(svgNS,'circle');
  c.setAttribute('cx',x); c.setAttribute('cy',y);
  c.setAttribute('r',(0.8+rand()*1.4).toFixed(2));
  c.setAttribute('fill','var(--tx)');
  c.setAttribute('opacity',(0.45+rand()*0.4).toFixed(2));
  outerContent.appendChild(c);
}

const shapes={
  cypress:'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  arch:   'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  hill:   'M 0 40 Q 20 12 40 40 Z',
  moon:   'M 30 8 A 16 16 0 1 0 30 40 A 12 14 0 1 1 30 8 Z',
};
const shapeKeys=Object.keys(shapes);
for(let i=0;i<22;i++){
  const side=i%4, t=rand();
  let x,y;
  if(side===0){ x=220+t*1160; y=830+rand()*20; }
  else if(side===1){ x=220+t*1160; y=165+rand()*20; }
  else if(side===2){ x=210+rand()*20; y=180+t*640; }
  else{ x=1370+rand()*20; y=180+t*640; }
  const dx=x-800, dy=y-500;
  if(dx*dx+dy*dy<200*200) continue;
  const kind=shapeKeys[Math.floor(rand()*shapeKeys.length)];
  const scale=0.7+rand()*0.8;
  const g=document.createElementNS(svgNS,'g');
  g.setAttribute('transform',`translate(${x-20*scale} ${y-40*scale}) scale(${scale})`);
  const p=document.createElementNS(svgNS,'path');
  p.setAttribute('d',shapes[kind]);
  p.setAttribute('fill','var(--tx)');
  p.setAttribute('opacity','0.85');
  g.appendChild(p);
  outerContent.appendChild(g);
}

const slider=$('slider');
const hint=$('hint');
const outer=$('ksOuter');
const outerBound=$('ksOuterBound');

function apply(v){
  // s ∈ [0.35, 3.6]. Büyüdükçe dış alan genişler ve söner.
  const t=v/100;
  const s=0.35+t*3.25;
  outer.setAttribute('transform',`translate(800 500) scale(${s.toFixed(3)}) translate(-800 -500)`);
  const bright=1/(s*s);
  outerContent.setAttribute('opacity', Math.max(0.02,Math.min(1,bright)).toFixed(3));
  outerBound.setAttribute('opacity', Math.max(0.08,Math.min(0.6,0.6/s)).toFixed(3));
  // Kap bu işlevin dışında — DOM'u burada hiç değişmiyor.
}

slider.addEventListener('input', e=>{
  if(!document.body.classList.contains('sahne-bitti')) return;
  apply(+e.target.value);
  if(hint) hint.style.animation='none';
});

// ── Ölçü hedef_hal'leri kümülatiftir (her ölçü yalnız kendi değişen
// anahtarlarını taşır) -- sonHal deseni, bkz. hayret.html/kandil.html/
// uc-kap.html. ──────────────────────────────────────────────────────────
const ksGok=$('ksGok'), ksYer=$('ksYer'), ksKalpDis=$('ksKalpDis'), ksKalpIci=$('ksKalpIci');
let sonHal={};
function uygulaHal(hamHal){
  sonHal=Object.assign({}, sonHal, hamHal);
  const hal=sonHal;
  const disAydinlik=hal.disAydinlik!==undefined?hal.disAydinlik:0;
  outerContent.setAttribute('opacity', disAydinlik.toFixed(3));
  outerBound.setAttribute('opacity', (disAydinlik*0.6).toFixed(3));
  ksGok.setAttribute('opacity', String(hal.gokKap!==undefined?hal.gokKap:0));
  ksYer.setAttribute('opacity', String(hal.yerKap!==undefined?hal.yerKap:0));
  ksKalpDis.setAttribute('opacity', String(hal.kalp!==undefined?hal.kalp:0));
  ksKalpIci.setAttribute('opacity', String(hal.kalpIci!==undefined?hal.kalpIci:0));
  ksKalpIci.classList.toggle('ks-nefes', !!hal.nefes);
}

let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniKur(){
  if(sahneMetniEl||!partisyonRef) return;
  sahneMetniEl=document.createElement('ol');
  sahneMetniEl.className='sahne-metni';
  kunye.el.appendChild(sahneMetniEl);
  sahneMetniniGuncelle();
}
function sahneMetniniGuncelle(){
  if(!sahneMetniEl||!partisyonRef) return;
  sahneMetniEl.innerHTML='';
  partisyonRef.olcuLer.forEach(function(o){
    if(!o.metin) return;
    const li=document.createElement('li');
    li.textContent=o.metin[lang]||o.metin.tr;
    sahneMetniEl.appendChild(li);
  });
}

function metinYaz(m){
  sonMetin=m;
  const t=m?(m[lang]||m.tr||''):'';
  $('captionWrap').classList.remove('gorunur');
  window.setTimeout(function(){
    $('caption').textContent=t;
    if(t) $('captionWrap').classList.add('gorunur');
  }, t?150:0);
}

let motorAPI=null, reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/kalbe-sigan.json').then(function(r){ return r.json(); }).then(function(p){
    partisyonRef=p;
    sahneMetniniKur();
    motorAPI=window.__sahneMotoru.yarat({
      container:document.querySelector('.stage-wrap'), partisyon:p,
      applyOlcu:function(o){ uygulaHal(o.hedef_hal||{}); },
      metinGoster:metinYaz,
      olcuGoster:function(i,t){ $('olcuGosterge').textContent=(i+1)+' / '+t; },
      biterEl:$('motorBiter'),
      tepki:function(ev){
        if(ev.tip==='bitti'){
          document.body.classList.add('sahne-bitti');
          // apply() BİLEREK çağrılmıyor: motorun bıraktığı hâl (dış aydınlık
          // dindi) korunur, slider yalnız kullanıcı GERÇEKTEN sürüklediğinde
          // devreye girer (yukarıdaki 'input' dinleyicisi).
          if(reduced){
            dortYerNoktalar.forEach(function(d){ d.a.style.transition='none'; });
            dortYerLabelEl.style.transition='none';
          }
          dortYerYerlestir();
        }
      },
    });
  });
})();

const stageWrap=document.querySelector('.stage-wrap');
stageWrap.setAttribute('tabindex','0');
stageWrap.addEventListener('keydown', function(e){
  if(!motorAPI) return;
  if(e.key===' '){ e.preventDefault(); if(motorAPI.durum==='oynuyor') motorAPI.pause(); else if(motorAPI.durum==='durakli') motorAPI.resume(); return; }
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return;
  e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0, Math.min(motorAPI.olcuSayisi-1, motorAPI.aktifIdx+y)));
});

// ── Dört yer, tek kalp (Yakınsama Deseni, 2026-08-14) ───────────────────────
// Künye'de zaten duran dört gerçek geçiş (aynı kudsî hadis, dört ayrı cilt)
// burada kabın çevresinde dört iz olarak beliriyor -- kap zaten hiç
// değişmiyordu (yukarıdaki asıl ilke); şimdi "kaça sığdığı" da görünür:
// dört ayrı yerden, aynı kaba. Yeni veri icat edilmedi, KUNYE'nin kendi
// kaynak alanları kullanıldı. Sürgünün kendi anlamına (dış alan ölçeği)
// dokunulmuyor -- bu ayrı, küçük bir keşif katmanı.
const DORT_YER=KUNYE.filter(k=>k.kaynak).map(k=>({href:k.kaynak.href, etiket:k.kaynak.etiket}));
const DORT_YER_ACI=[-45,45,135,225];
const R_UZAK=300, R_YAKIN=148;
const dortYerG=document.createElementNS(svgNS,'g');
dortYerG.setAttribute('id','dortYer');
$('scene').appendChild(dortYerG);

const dortYerLabelEl=document.createElementNS(svgNS,'text');
dortYerLabelEl.setAttribute('x','800'); dortYerLabelEl.setAttribute('y','325');
dortYerLabelEl.setAttribute('text-anchor','middle');
dortYerLabelEl.setAttribute('font-family','Georgia, serif');
dortYerLabelEl.setAttribute('font-size','15');
dortYerLabelEl.setAttribute('letter-spacing','.5');
dortYerLabelEl.setAttribute('fill','var(--mu)');
dortYerLabelEl.setAttribute('opacity','0');
dortYerLabelEl.style.transition='opacity 1.4s ease 1.1s';
dortYerG.appendChild(dortYerLabelEl);

const dortYerNoktalar=DORT_YER.map((yer,i)=>{
  const rad=DORT_YER_ACI[i]*Math.PI/180;
  const a=document.createElementNS(svgNS,'a');
  a.setAttribute('href', yer.href);
  a.setAttribute('aria-label', yer.etiket);
  const uzakX=800+Math.cos(rad)*R_UZAK, uzakY=500+Math.sin(rad)*R_UZAK;
  a.setAttribute('transform', `translate(${uzakX.toFixed(1)} ${uzakY.toFixed(1)})`);
  a.style.opacity='0';
  a.style.transition='transform 1.9s cubic-bezier(.22,.61,.36,1) '+(0.9+i*0.13).toFixed(2)+'s, opacity 1.3s ease '+(0.9+i*0.13).toFixed(2)+'s';
  // Görünmeyen ama gerçek bir dokunma alanı: nokta+halka görsel olarak
  // küçük (r=11), parmakla hedeflemesi zor olurdu.
  const dokunmaAlani=document.createElementNS(svgNS,'circle');
  dokunmaAlani.setAttribute('r','26'); dokunmaAlani.setAttribute('fill','transparent');
  a.appendChild(dokunmaAlani);
  const halka=document.createElementNS(svgNS,'circle');
  halka.setAttribute('class','dort-yer-halka');
  halka.setAttribute('r','11'); halka.setAttribute('fill','none');
  halka.setAttribute('stroke','var(--go)'); halka.setAttribute('stroke-width','1.2'); halka.setAttribute('opacity','0.55');
  a.appendChild(halka);
  const nokta=document.createElementNS(svgNS,'circle');
  nokta.setAttribute('r','5'); nokta.setAttribute('fill','var(--go)');
  a.appendChild(nokta);
  const etiket=document.createElementNS(svgNS,'text');
  etiket.setAttribute('class','dort-yer-etiket');
  etiket.setAttribute('y','-18'); etiket.setAttribute('text-anchor','middle');
  etiket.setAttribute('font-family','Georgia, serif'); etiket.setAttribute('font-size','13');
  etiket.setAttribute('fill','var(--tx)');
  etiket.textContent=yer.etiket;
  a.appendChild(etiket);
  dortYerG.appendChild(a);
  return {a, rad};
});

function dortYerYerlestir(){
  dortYerNoktalar.forEach(d=>{
    const x=800+Math.cos(d.rad)*R_YAKIN, y=500+Math.sin(d.rad)*R_YAKIN;
    d.a.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    d.a.style.opacity='0.9';
  });
  dortYerLabelEl.setAttribute('opacity','0.85');
}
// Tetikleme artık motorun 'bitti' tepkisinden -- bkz. yukarıdaki
// window.__sahneMotoru.yarat({... tepki ...}) çağrısı. İlk oynatma
// bitmeden hiçbir kontrol/ikincil katman görünmez (/sahne ilkesi).

setLang('tr');
window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr"; try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}
  var a = document.createElement("a"); a.className = "sahne-geri"; a.href = "sahneler/";
  a.textContent = "← " + ETIKET[dil]; document.body.appendChild(a);
  function geriGit(){try{if(document.referrer&&history.length>1&&new URL(document.referrer).origin===location.origin){history.back();return;}}catch(e){} location.href="sahneler/";}
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return; var el=document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault(); geriGit();
  });
})();
</script>
