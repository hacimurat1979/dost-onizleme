<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Kandil — Sınırlanınca Görünen. docs/04 S5. Nûr 24:35 ailesi. -->
<title>Kandil — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.06em;color:var(--gold);margin-bottom:.45rem}
.sub{color:var(--muted);font-size:.88rem;font-style:italic;line-height:1.65}

.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px}
.scene-wrap{position:relative;width:min(94vw,640px);aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#F5E3BC}
.scene-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#kdl-hit{cursor:grab}
#kdl-hit:active{cursor:grabbing}
#kdl-hit:focus-visible{outline:2px solid var(--liminal);outline-offset:-3px}

.stage{width:min(94vw,640px);text-align:center;margin-top:.75rem}
.caption{font-size:.9rem;line-height:1.75;font-style:italic;color:var(--liminal);max-width:520px;margin:0 auto;opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease}
.caption.show{opacity:1;transform:none}
.gezin-ipucu{font-size:.75rem;color:var(--muted);font-style:italic;margin-top:.6rem;transition:opacity .5s ease}
.gezin-ipucu.gone{opacity:.3}

.sahne-kunye{width:min(94vw,640px);margin-top:1.2rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye summary:focus-visible{outline:2px solid var(--liminal);outline-offset:2px}
.sahne-kunye ul{list-style:none;margin-top:.7rem}
.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--muted)}
.sahne-kunye li.sahne-kunye__serh{color:var(--muted);font-size:.76rem}
.sahne-kunye a{color:var(--liminal);text-decoration:none;border-bottom:1px solid var(--border);white-space:nowrap}
.sahne-kunye a:hover,.sahne-kunye a:focus-visible{border-bottom-color:var(--liminal)}

@keyframes kdl-ignite{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes kdl-drift{0%{transform:translate(0,0)}25%{transform:translate(6%,-3%)}50%{transform:translate(2%,4%)}75%{transform:translate(-5%,-2%)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){.scene-wrap [data-anim]{animation:none!important}.caption{transition:none}}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 id="hTitle">Kandil — Sınırlanınca Görünen</h1>
  <p class="sub" id="hSub">Nûr 24:35 — sınırsız nûr kandile girer, sahne ilk kez okunur; kandil çekilir, ışık da</p>
</header>

<div class="sw">
  <div class="scene-wrap">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="kdl-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#F5E3BC"/>
          <stop offset="55%" stop-color="#F5E3BC"/>
          <stop offset="100%" stop-color="#E8D2A4"/>
        </radialGradient>
        <radialGradient id="kdl-lamp" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#000" stop-opacity="0.78"/>
          <stop offset="35%" stop-color="#000" stop-opacity="0.55"/>
          <stop offset="70%" stop-color="#000" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <filter id="kdl-soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
        <mask id="kdl-mask">
          <rect x="0" y="0" width="1600" height="1000" fill="black"/>
          <circle id="kdl-mask-c" cx="800" cy="500" r="180" fill="white" filter="url(#kdl-soft)"/>
        </mask>
      </defs>

      <rect x="0" y="0" width="1600" height="1000" fill="url(#kdl-glow)"/>

      <g id="kdl-layer" mask="url(#kdl-mask)" opacity="0.92" style="filter:url(#kdl-soft)"></g>

      <g id="kdl-lamp-g" data-anim style="animation:kdl-ignite 1600ms 900ms both, kdl-drift 14s 2500ms ease-in-out infinite">
        <circle id="kdl-lamp-c" cx="800" cy="500" r="230" fill="url(#kdl-lamp)"/>
      </g>

      <rect id="kdl-hit" x="0" y="0" width="1600" height="1000" fill="transparent" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></rect>
    </svg>
  </div>
  <div class="stage">
    <p class="caption" id="caption" aria-live="polite"><span id="captionText"></span></p>
    <p class="gezin-ipucu" id="gezinIpucu"></p>
  </div>
  <div id="kunyeYuvasi"></div>
</div>

<script>
const LA={
  tr:{
    title:'Kandil — Sınırlanınca Görünen',
    sub:'Nûr 24:35 — sınırsız nûr kandile girer, sahne ilk kez okunur; kandil çekilir, ışık da',
    caption:'Her yer eşit aydınlıkken hiçbir şey okunmuyordu. Sınır belirince sahne okundu; sınır çekilince okuma da çekildi.',
    hint:'Kandili sürükle; ok tuşları da çalışır.',
    hitLabel:'Kandilin ışığının sınırı — sürükleyerek taşı',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?'
  },
  en:{
    title:'The Lamp — What Becomes Visible When Bounded',
    sub:'Al-Nūr 24:35 — the boundless light enters the lamp and the scene becomes readable; the lamp withdraws, and so does the light',
    caption:'When everything shone equally, nothing could be read. A boundary appeared and the scene became legible; when it withdrew, so did the reading.',
    hint:'Drag the lamp; arrow keys work too.',
    hitLabel:'The boundary of the lamp’s light — drag to move it',
    kunyeBaslik:'Sources — where this scene comes from'
  },
  pt:{
    title:'A Lâmpada — O que Se Torna Visível quando Limitado',
    sub:'Al-Nūr 24:35 — a luz sem limites entra na lâmpada e a cena torna-se legível; a lâmpada retira-se, e a luz também',
    caption:'Quando tudo brilhava por igual, nada podia ser lido. Um limite surgiu e a cena tornou-se legível; ao retirar-se, a leitura também partiu.',
    hint:'Arraste a lâmpada; as setas também funcionam.',
    hitLabel:'O limite da luz da lâmpada — arraste para mover',
    kunyeBaslik:'Fontes — de onde vem esta cena'
  }
};

const KUNYE=[
  {tur:'dost',metin:{tr:'“Allah göklerin ve yerin nûrudur…” (Nûr 24:35)',en:'“God is the light of the heavens and the earth…” (Al-Nūr 24:35)',pt:'“Deus é a luz dos céus e da terra…” (Al-Nūr 24:35)'},kaynak:{href:'futuhat/c15k173',etiket:'Fütûhât, bab 426 (c15k173)'}},
  {tur:'dost',metin:{tr:'“…nuru sınırlıyor ve ardından bu sınırlı nuru bir kandile benzetiyor. Ama bir kandilin ışığı ile gökleri ve yeri aydınlatan ışık bir olabilir mi?”',en:'“…it bounds the light and then likens the bounded light to a lamp. Yet can the lamp’s light and the light that illumines the heavens and the earth be one?”',pt:'“…limita a luz e depois compara essa luz limitada a uma lâmpada. Mas poderá a luz da lâmpada e a luz que ilumina os céus e a terra ser uma só?”'},kaynak:{href:'futuhat/c3k35',etiket:'c3k35'}},
  {tur:'dost',metin:{tr:'“Suret ile ruhaninin ilişkisine örnek olarak ışığı duvarlara yayılan kandil ve onun ışığını verebiliriz. Kandilin cismi gizlendiğinde ışık da kaybolur.” Başka bir bahiste, bir ruhanî varlığın nasıl sûrete girip göründüğünü anlatmak için kullanılıyor — doğrudan Nûr 24:35 üzerine değil, ama aynı imge.',en:'“As an example of the relation between a form and a spirit, we may cite the lamp whose light spreads to the walls, and its light. When the lamp’s body is hidden, the light too disappears.” From a different passage, used to describe how a spiritual being enters and appears through a form — not a direct reading of Al-Nūr 24:35, but the same image.',pt:'“Como exemplo da relação entre uma forma e um espírito, podemos citar a lâmpada cuja luz se espalha pelas paredes, e a sua luz. Quando o corpo da lâmpada se esconde, a luz também desaparece.” De uma passagem diferente, usada para descrever como um ser espiritual entra e aparece através de uma forma — não uma leitura direta de An-Nūr 24:35, mas a mesma imagem.'},kaynak:{href:'futuhat/c1k12',etiket:'c1k12'}},
  {tur:'okuma',metin:{tr:'Ayna-v4 ve S4 ile aynı büyük aile — “sonsuzun kaba girmesi.” Farkı bitişte: ayna çoğaltır (v4), kalp sığdırır (S4), kandil görünür kılar ve çekilir.',en:'Same broad family as Mirror-v4 and S4 — “the boundless entering a vessel.” The difference is at the close: the mirror multiplies (v4), the heart contains (S4), the lamp makes visible and then withdraws.',pt:'Da mesma família alargada que o Espelho-v4 e S4 — “o sem-limites entrando num vaso.” A diferença está no final: o espelho multiplica (v4), o coração contém (S4), a lâmpada torna visível e depois retira-se.'}},
  {tur:'serh',metin:{tr:'Âyetin kendisi tek bir kandilden çok daha katmanlı: “mişkât” (hücre), “mısbah” (kandil), “zücâce” (cam), “zeytin ağacı” art arda geçer. Bu sahne o zinciri tek bir kandile indirdi — katmanları art arda çizmek eşmerkezli çember yasağına çok yaklaşırdı.',en:'The verse itself is far more layered than a single lamp: it moves through “niche” (mishkāt), “lamp” (miṣbāḥ), “glass” (zujāja), “olive tree” in sequence. This scene reduced that chain to one lamp — drawing the layers one inside another would have come too close to the ban on concentric circles.',pt:'O próprio versículo é muito mais estratificado do que uma única lâmpada: passa por “nicho” (mishkāt), “lâmpada” (miṣbāḥ), “vidro” (zujāja), “oliveira” em sequência. Esta cena reduziu essa cadeia a uma única lâmpada — desenhar as camadas uma dentro da outra teria chegado demasiado perto da proibição dos círculos concêntricos.'}}
];

const $=id=>document.getElementById(id);

// Künye kutusu — assets/sahne-cizim.js'teki kunye() ile aynı davranış, ama
// bu sahne artık o paylaşılan script'e bağlı değil (self-contained tasarım).
function kunyeOlustur(container, kayitlar, baslik){
  const det=document.createElement('details'); det.className='sahne-kunye';
  const sum=document.createElement('summary'); det.appendChild(sum);
  const ul=document.createElement('ul'); det.appendChild(ul);
  const hucreler=kayitlar.map(function(k){
    const li=document.createElement('li'); li.className='sahne-kunye__'+(k.tur||'dost');
    const span=document.createElement('span'); li.appendChild(span);
    if(k.kaynak){
      const a=document.createElement('a'); a.href=k.kaynak.href; a.textContent=k.kaynak.etiket;
      li.appendChild(document.createTextNode(' — ')); li.appendChild(a);
    }
    ul.appendChild(li); return span;
  });
  container.appendChild(det);
  return { el:det, guncelle:function(l){
    sum.textContent=(baslik && (baslik[l]||baslik.tr))||'Künye';
    kayitlar.forEach(function(k,i){ hucreler[i].textContent=k.metin[l]||k.metin.tr; });
  }};
}
const kunye=kunyeOlustur($('kunyeYuvasi'), KUNYE, {tr:LA.tr.kunyeBaslik,en:LA.en.kunyeBaslik,pt:LA.pt.kunyeBaslik});

const hit=$('kdl-hit');
let lang='tr';
function renderChrome(){
  const d=LA[lang];
  $('hTitle').textContent=d.title;
  $('hSub').textContent=d.sub;
  $('captionText').textContent=d.caption;
  $('gezinIpucu').textContent=d.hint;
  hit.setAttribute('aria-label', d.hitLabel);
  kunye.guncelle(lang);
}
function setLang(l){ if(!LA[l]) return; lang=l; renderChrome(); }

// ── Siluet dünyası: sabit tohumlu rastgele dağılım, biçim sözlüğü marka/dinî
// imge içermez (kemer, kapı, servi, ev, tepe, testi, kayık, kuş, insan
// figürü, kubbe, ay, kuyu, ağaç, fener) ────────────────────────────────────
const layer=$('kdl-layer');
const rand=(function(seed){ return function(){ seed=(seed*9301+49297)%233280; return seed/233280; }; })(11);
const svgNS='http://www.w3.org/2000/svg';

const shapes={
  arch:     'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  door:     'M 4 40 L 4 14 Q 4 2 20 2 Q 36 2 36 14 L 36 40 Z',
  cypress:  'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  house:    'M 2 40 L 2 20 L 20 6 L 38 20 L 38 40 Z',
  hill:     'M 0 40 Q 20 8 40 40 Z',
  hill2:    'M 0 40 Q 12 22 22 30 Q 32 18 44 40 Z',
  pitcher:  'M 14 40 Q 8 32 10 22 Q 8 18 12 14 L 28 14 Q 32 18 30 22 Q 32 32 26 40 Z M 30 22 Q 38 22 38 28 Q 38 34 30 32',
  boat:     'M 2 30 Q 20 42 38 30 L 34 24 L 6 24 Z M 20 24 L 20 8 L 30 12 L 20 20',
  bird:     'M 0 6 Q 8 -2 14 4 Q 20 -2 28 6',
  figure:   'M 20 6 A 4 4 0 1 1 19.9 6 M 20 12 L 20 28 L 12 40 M 20 28 L 28 40 M 20 16 L 10 20 M 20 16 L 30 20',
  dome:     'M 4 40 L 4 26 Q 4 8 20 8 Q 36 8 36 26 L 36 40 Z M 20 8 L 20 2',
  moon:     'M 30 8 A 16 16 0 1 0 30 40 A 12 14 0 1 1 30 8 Z',
  well:     'M 6 40 L 10 20 L 30 20 L 34 40 Z M 4 20 L 36 20 M 20 20 L 20 8',
  tree:     'M 20 40 L 20 22 M 20 22 Q 8 22 6 12 M 20 22 Q 32 22 34 12 M 20 22 Q 20 10 12 6 M 20 22 Q 20 10 28 6',
  lantern:  'M 20 4 L 20 8 M 12 8 L 28 8 L 26 30 L 14 30 Z M 14 30 L 12 36 L 28 36 L 26 30 M 20 36 L 20 40'
};
const filled=new Set(['arch','door','cypress','house','hill','hill2','dome','moon','figure']);
const keys=Object.keys(shapes);

// Poisson-vari dağılım: benzer ölçekte birbirine çok yakın iki biçim reddedilir.
const placed=[];
const target=90;
let attempts=0;
while(placed.length<target && attempts<target*40){
  attempts++;
  const x=40+rand()*1520;
  const y=40+rand()*920;
  const scale=0.55+rand()*1.15;
  const minDist=70*scale;
  let ok=true;
  for(const p of placed){
    const dx=p.x-x, dy=p.y-y;
    if(dx*dx+dy*dy<minDist*minDist){ ok=false; break; }
  }
  if(!ok) continue;
  placed.push({ x:x, y:y, scale:scale, kind:keys[Math.floor(rand()*keys.length)] });
}

for(const p of placed){
  const g=document.createElementNS(svgNS,'g');
  const w=40*p.scale, h=40*p.scale;
  g.setAttribute('transform','translate('+(p.x-w/2)+' '+(p.y-h)+') scale('+p.scale+')');
  const el=document.createElementNS(svgNS,'path');
  el.setAttribute('d', shapes[p.kind]);
  if(filled.has(p.kind)){
    el.setAttribute('fill','#3A2F1E');
    el.setAttribute('stroke','none');
  } else {
    el.setAttribute('fill','none');
    el.setAttribute('stroke','#3A2F1E');
    el.setAttribute('stroke-width', 1.6);
    el.setAttribute('stroke-linecap','round');
    el.setAttribute('stroke-linejoin','round');
  }
  el.setAttribute('opacity', (0.7+rand()*0.25).toFixed(2));
  g.appendChild(el);
  layer.appendChild(g);
}

// Siluetler arasına, sahneye doku katan minik izler.
for(let i=0;i<140;i++){
  const c=document.createElementNS(svgNS,'circle');
  c.setAttribute('cx', rand()*1600);
  c.setAttribute('cy', rand()*1000);
  c.setAttribute('r', 0.8+rand()*1.2);
  c.setAttribute('fill','#3A2F1E');
  c.setAttribute('opacity', (0.35+rand()*0.3).toFixed(2));
  layer.appendChild(c);
}

// ── Kandili sürükleme: konum, ışığın (maskenin) ve kandil gövdesinin
// sınırını birlikte taşır. Sınır neredeyse orada, dünya okunur olur; başka
// yerde eşit aydınlık geri döner. ──────────────────────────────────────────
const maskC=$('kdl-mask-c');
const lampG=$('kdl-lamp-g');
const lampC=$('kdl-lamp-c');

let cx=800, cy=500;
function setPos(x,y){
  cx=Math.max(160, Math.min(1440, x));
  cy=Math.max(160, Math.min(840, y));
  maskC.setAttribute('cx', cx); maskC.setAttribute('cy', cy);
  lampC.setAttribute('cx', cx); lampC.setAttribute('cy', cy);
  hit.setAttribute('aria-valuenow', Math.round((cx/1600)*100));
}

const svgEl=hit.ownerSVGElement;
function toSvg(clientX, clientY){
  const pt=svgEl.createSVGPoint();
  pt.x=clientX; pt.y=clientY;
  const m=svgEl.getScreenCTM();
  if(!m) return { x:cx, y:cy };
  const p=pt.matrixTransform(m.inverse());
  return { x:p.x, y:p.y };
}

let dragging=false, interacted=false;
function firstInteract(){
  if(interacted) return;
  interacted=true;
  lampG.style.animation='kdl-ignite 400ms both';
  $('gezinIpucu').classList.add('gone');
}

hit.addEventListener('pointerdown', function(e){
  dragging=true; hit.style.cursor='grabbing'; firstInteract();
  try{ hit.setPointerCapture(e.pointerId); }catch(_){}
  const p=toSvg(e.clientX, e.clientY); setPos(p.x, p.y);
  e.preventDefault();
});
hit.addEventListener('pointermove', function(e){
  if(!dragging) return;
  const p=toSvg(e.clientX, e.clientY); setPos(p.x, p.y);
});
['pointerup','pointercancel'].forEach(function(t){
  hit.addEventListener(t, function(){ dragging=false; hit.style.cursor='grab'; });
});

hit.addEventListener('keydown', function(e){
  const step=40;
  let handled=true;
  if(e.key==='ArrowLeft') setPos(cx-step, cy);
  else if(e.key==='ArrowRight') setPos(cx+step, cy);
  else if(e.key==='ArrowUp') setPos(cx, cy-step);
  else if(e.key==='ArrowDown') setPos(cx, cy+step);
  else handled=false;
  if(handled){ firstInteract(); e.preventDefault(); }
});

const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced){
  lampG.style.animation='none';
  $('caption').classList.add('show');
} else {
  setTimeout(function(){ $('caption').classList.add('show'); }, 8200);
}

renderChrome();
window.addEventListener('message', function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>

<script src="assets/edit-mode.js" defer></script>
</body>
