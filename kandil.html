<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Kandil — Sınırlanınca Görünen (2026-08-19 okuma-öncelikli yeniden üretim,
     yeni /sahne yöntemi). İki kayıt: c3k35 (tamlama ile sınırlanan nur,
     kandil benzetmesi, "bir olamaz") + c15k173/426 ("nur kendisiyle
     perdelenmiştir; hiçbir zaman görülemez").
     DELTA: görünürlüğü ışık değil SINIR yapar. Işık niceliği bütün sahne
     boyunca SABİTTİR (arka plan opaklığı hiç değişmez -- koddaki güvence);
     değişen yalnız kontrast/gölge katmanı. Kandil biçimi bilerek yok
     (sığlık kalıbı: metaforun nesnesi çizilmez); sınır nötr kapalı eğri. -->
<title>Kandil — Sınırlanınca Görünen — Dost Arabi</title>
<style>
:root{--bg:#E9E5DB;--su:#F2EFE7;--bo:#C9C4B6;--tx:#1A1A1A;--mu:#6F6D65;--go:#8A6100;--am:#8C6D1A;--pa:#EDE9DF;--golge:#4A463C}
@media(prefers-color-scheme:dark){:root{--bg:#D8D3C6;--su:#E2DED2;--bo:#B5B0A2;--tx:#141414;--mu:#5C5A52;--go:#6E4E00;--am:#6E5615;--pa:#DDD8CB;--golge:#3A362E}}
:root[data-theme=dark]{--bg:#D8D3C6;--su:#E2DED2;--bo:#B5B0A2;--tx:#141414;--mu:#5C5A52;--go:#6E4E00;--am:#6E5615;--pa:#DDD8CB;--golge:#3A362E}
:root[data-theme=light]{--bg:#E9E5DB;--su:#F2EFE7;--bo:#C9C4B6;--tx:#1A1A1A;--mu:#6F6D65;--go:#8A6100;--am:#8C6D1A;--pa:#EDE9DF;--golge:#4A463C}
/* Sahne bilerek AÇIK zeminli: "okunamaz aydınlık" koyu temada bile aydınlıktır --
   eşit ışık hali sahnenin iddiasının kendisi, tema tercihine çevrilmez. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--go);margin-bottom:.45rem}
.sub{color:var(--mu);font-size:.88rem;font-style:italic;line-height:1.65;max-width:560px}
.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px}

.stage-wrap{position:relative;width:min(640px,92vw);aspect-ratio:16/10;margin:.5rem auto 1rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#kdGolgeKatmani,#kdSinir,#kdIz,#kdPay{transition:opacity 1.8s ease}

.track-wrap{width:min(560px,92vw);margin:0 auto}
.track-labels{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mu);margin-bottom:.5rem}
#slider{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;padding:0;margin:0;cursor:pointer;display:block}
#slider::-webkit-slider-runnable-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-moz-range-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--go);border:2px solid var(--pa);margin-top:-10px;box-shadow:0 0 0 1px var(--am)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--go);border:2px solid var(--pa);box-shadow:0 0 0 1px var(--am)}
#slider:focus{outline:none}
#slider:focus-visible::-webkit-slider-thumb,#slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--am)}

.caption-wrap{width:min(560px,92vw);margin:.75rem auto 0;text-align:center;opacity:0;transition:opacity 1s ease}
.caption-wrap.gorunur{opacity:1}
.caption{font-size:.88rem;line-height:1.75;color:var(--tx);min-height:3.2em}

.track-wrap,.hint{opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .track-wrap,body.sahne-bitti .hint{opacity:1;max-height:80px}
.hint{position:absolute;top:12px;right:16px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.5rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--mu);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--bo);color:var(--mu);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--am);color:var(--tx)}

.sahne-kunye{width:min(560px,92vw);margin-top:1.2rem;background:var(--su);border:1px solid var(--bo);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye ul{list-style:none;margin-top:.7rem}.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--mu)}
.sahne-kunye li.sahne-kunye__serh{color:var(--mu);font-size:.76rem}
.sahne-kunye a{color:var(--am);text-decoration:none;border-bottom:1px solid var(--bo);white-space:nowrap}
.sahne-metni{margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--bo);font-size:.78rem;line-height:1.7;color:var(--mu);list-style:decimal inside}
.sahne-metni li{margin-bottom:.4rem}

.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;font-family:inherit;text-decoration:none;opacity:.72;border:1px solid var(--bo);background:var(--su);color:var(--mu)}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;color:var(--tx);border-color:var(--go)}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="i-title">Kandil — Sınırlanınca Görünen</h1>
  <p class="sub" id="i-sub">Işık her yerdeyken hiçbir şey görünmez; bir sınır çizilince sahne okunur; sınır çekilince görünmezlik geri gelir</p>
</header>

<div class="sw">
  <div class="stage-wrap">
    <svg id="scene" viewBox="0 0 1600 1000" role="group" aria-label="Kendi kendini anlatan sahne: eşit ve okunamaz bir aydınlık; bir sınır çizilince biçimler ilk kez seçiliyor; sınır çekilince karanlık değil görünmezlik dönüyor">
      <defs>
        <!-- Gölge katmanının sınır çevresine kilitlenmiş maskesi: kontrast
             yalnız sınırın erişebildiği payda doğar. Maske merkezi sınırın
             merkezi; erişim yarıçapı sınırın 2.2 katı. -->
        <radialGradient id="kdErisim" cx="0" cy="0" r="620" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="55%" stop-color="#fff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="kdMask">
          <rect x="0" y="0" width="1600" height="1000" fill="#000"/>
          <circle id="kdMaskDaire" cx="640" cy="470" r="620" fill="url(#kdErisim)"/>
        </mask>
      </defs>

      <!-- Sahnede ASLINDA hep duran biçimler: eşit ışık halinde zeminle
           hemen hemen aynı tonda (görünmez); gölge katmanı (aynı geometri,
           koyu) yalnız maske + okunurluk opaklığıyla belirir. Işık niceliği
           (zemin) HİÇ değişmez -- değişen yalnız bu kontrast katmanı. -->
      <g id="kdBicimler"></g>
      <g id="kdGolgeKatmani" mask="url(#kdMask)" opacity="0"></g>

      <!-- Aydınlatılamayan pay: sınırın erişiminin BİTTİĞİ yerde, görünen
           ile görünmeyenin yan yana durduğunu söyleyen çok soluk kesik
           eğri. Ölçü 3'te belirir. -->
      <path id="kdPay" d="M 1150 130 A 620 620 0 0 1 1230 830" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0"></path>

      <!-- Sınır: ışığı ÜRETMEYEN, yalnız sınırlayan nötr kapalı eğri.
           Kandil illüstrasyonu bilerek değil. -->
      <circle id="kdSinir" cx="640" cy="470" r="190" fill="none" stroke="var(--golge)" stroke-width="2.5" opacity="0"></circle>
      <!-- Sınırın hatırası: çekildikten sonra kalan çok soluk iz. Geç
           gelen biri son kareden "burada bir sınır vardı"yı okuyabilsin. -->
      <circle id="kdIz" cx="640" cy="470" r="190" fill="none" stroke="var(--golge)" stroke-width="1.2" stroke-dasharray="2 9" opacity="0"></circle>
    </svg>
    <div class="hint" id="hint"><span id="hintText"></span></div>
  </div>

  <div class="track-wrap">
    <div class="track-labels">
      <span id="lblYok"></span>
      <span id="lblGenis"></span>
    </div>
    <input id="slider" type="range" min="0" max="100" value="55" aria-label="Sınırın genişliği">
  </div>
  <div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>
  <div class="caption-wrap" id="captionWrap">
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <div id="kunyeYuvasi"></div>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script src="assets/sahne-cizim.js"></script>
<script>
const L={
  tr:{
    title:'Kandil — Sınırlanınca Görünen',
    sub:'Işık her yerdeyken hiçbir şey görünmez; bir sınır çizilince sahne okunur; sınır çekilince görünmezlik geri gelir',
    hint:'Sahne durdu — sınırı artık sen genişlet', yok:'Sınır yok', genis:'Geniş sınır',
    sliderLabel:'Sınırın genişliği',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?',
  },
  en:{
    title:'The Lamp — What Becomes Visible When Bounded',
    sub:'When light is everywhere nothing is visible; when a boundary is drawn the scene reads; when it withdraws, invisibility returns',
    hint:'The scene has settled — now widen the boundary yourself', yok:'No boundary', genis:'Wide boundary',
    sliderLabel:'Width of the boundary',
    kunyeBaslik:'Sources — where this scene comes from',
  },
  pt:{
    title:'A Lâmpada — O que Se Torna Visível quando Limitado',
    sub:'Quando a luz está em toda parte nada é visível; quando um limite é traçado a cena lê-se; quando ele se retira, a invisibilidade volta',
    hint:'A cena parou — agora alargue você mesmo o limite', yok:'Sem limite', genis:'Limite largo',
    sliderLabel:'Largura do limite',
    kunyeBaslik:'Fontes — de onde vem esta cena',
  }
};

const KUNYE=[
  {tur:'dost',metin:{
    tr:'Allah, tamlama kabul etmeyen “Mutlak Nur” adını değil, “göklerin ve yerin nuru” ifadesini kullanarak nuru sınırlıyor ve bu sınırlı nuru bir kandile benzetiyor. Ama bir kandilin ışığı ile gökleri ve yeri aydınlatan ışık bir olabilir mi?',
    en:'God, instead of the name “the Absolute Light” (which admits no genitive), uses “the light of the heavens and the earth,” thereby bounding the light — and likens this bounded light to a lamp. But can a lamp’s light be one with the light that illumines the heavens and the earth?',
    pt:'Deus, em vez do nome “a Luz Absoluta” (que não admite genitivo), usa “a luz dos céus e da terra”, limitando assim a luz — e compara essa luz limitada a uma lâmpada. Mas pode a luz de uma lâmpada ser una com a luz que ilumina os céus e a terra?',
  },kaynak:{href:'futuhat/c3k35',etiket:'Fütûhât (c3k35)'}},
  {tur:'dost',metin:{
    tr:'“Bu nur, O’ndan sana bir perde olduğu gibi sen de onun üzerinde perdesin… Böylece nur kendisiyle perdelenmiştir. Bu nedenle nur, hiçbir zaman görülemez.”',
    en:'“This light is a veil from Him upon you, just as you are a veil upon it… Thus light is veiled by itself. For this reason, light can never be seen.”',
    pt:'“Esta luz é um véu d’Ele sobre ti, assim como tu és um véu sobre ela… Assim a luz está velada por si mesma. Por isso, a luz nunca pode ser vista.”',
  },kaynak:{href:'futuhat/c15k173',etiket:'Fütûhât (c15k173, 426. bab)'}},
  {tur:'okuma',metin:{
    tr:'Sahnenin iddiası bu iki kaydın bileşimi: görünürlüğü ışık değil, ışığın SINIRLANIŞI kurar. Bu yüzden sahnede ışığın niceliği hiç değişmez; sınır çekildiğinde karanlık değil, görünmezlik döner. Kandilin kendisini bilerek çizmedik — çizseydik ışığı görünür yapmış, kaydın söylediğinin tersini söylemiş olurduk.',
    en:'The scene’s claim combines these two records: what founds visibility is not light but light’s BOUNDING. That is why the quantity of light in the scene never changes; when the boundary withdraws, what returns is not darkness but invisibility. We deliberately did not draw the lamp itself — drawing it would have made the light visible, saying the opposite of what the record says.',
    pt:'A afirmação da cena combina estes dois registos: o que funda a visibilidade não é a luz mas o LIMITAR da luz. Por isso a quantidade de luz na cena nunca muda; quando o limite se retira, o que volta não é a escuridão mas a invisibilidade. Deliberadamente não desenhámos a própria lâmpada — desenhá-la teria tornado a luz visível, dizendo o contrário do que o registo diz.',
  }},
  {tur:'serh',metin:{
    tr:'426’daki pasaj bizim okuma kaydımızın çevirisidir; “karanlık görülebilir” cümlesinin tam bağlamı kayıtta kısaltılmıştır. Kandil benzetmesinin âyetin kendi mişkât-misbah-zücâce zinciriyle ilişkisi bu iki kayıtta işlenmemiştir — bilinmiyor diye bırakıyoruz.',
    en:'The passage from 426 is our reading log’s translation; the full context of “darkness can be seen” is abridged in the log. How the lamp analogy relates to the verse’s own niche-lamp-glass chain is not treated in these two records — we leave it as unknown.',
    pt:'A passagem de 426 é a tradução do nosso registo de leitura; o contexto completo de “a escuridão pode ser vista” está abreviado no registo. Como a analogia da lâmpada se relaciona com a própria cadeia nicho-lâmpada-vidro do versículo não é tratado nestes dois registos — deixamo-lo como desconhecido.',
  }},
];

const $=id=>document.getElementById(id);
let lang='tr';
const kunye=window.DostSahneCizim.kunye($('kunyeYuvasi'), KUNYE, {tr:L.tr.kunyeBaslik,en:L.en.kunyeBaslik,pt:L.pt.kunyeBaslik});

function setLang(l){
  if(!L[l]) return;
  lang=l;
  const d=L[l];
  $('i-title').textContent=d.title;
  $('i-sub').textContent=d.sub;
  $('hintText').textContent=d.hint;
  $('lblYok').textContent=d.yok;
  $('lblGenis').textContent=d.genis;
  if(sonMetin) $('caption').textContent=sonMetin[lang]||sonMetin.tr;
  $('slider').setAttribute('aria-label', d.sliderLabel);
  kunye.guncelle(l);
  sahneMetniniGuncelle();
}
let sonMetin=null;

// ── Biçimler: sahnede HEP duran nötr siluet ailesi. Işık halinde zeminle
// hemen aynı tonda (görünmez); gölge katmanı aynı geometrinin koyusu.
const svgNS='http://www.w3.org/2000/svg';
let seed=137;
const rand=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
const SEKILLER={
  selvi:'M 20 40 L 12 34 Q 8 22 14 14 Q 16 6 20 0 Q 24 6 26 14 Q 32 22 28 34 L 20 40 Z',
  kemer:'M 0 40 L 0 18 Q 0 0 20 0 Q 40 0 40 18 L 40 40 Z',
  tepe: 'M 0 40 Q 20 12 40 40 Z',
  kubbe:'M 0 40 Q 0 8 20 8 Q 40 8 40 40 Z',
};
function bicimlerCiz(parent, koyu){
  const keys=Object.keys(SEKILLER);
  seed=137;
  for(let i=0;i<34;i++){
    const x=80+rand()*1440, y=120+rand()*760;
    const kind=keys[Math.floor(rand()*keys.length)];
    const s=0.9+rand()*1.6;
    const g=document.createElementNS(svgNS,'g');
    g.setAttribute('transform',`translate(${(x-20*s).toFixed(1)} ${(y-40*s).toFixed(1)}) scale(${s.toFixed(2)})`);
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('d',SEKILLER[kind]);
    if(koyu){ p.setAttribute('fill','var(--golge)'); p.setAttribute('opacity',(0.5+rand()*0.4).toFixed(2)); }
    else { p.setAttribute('fill','var(--su)'); p.setAttribute('opacity','0.5'); }
    g.appendChild(p);
    parent.appendChild(g);
  }
}
bicimlerCiz($('kdBicimler'), false);
bicimlerCiz($('kdGolgeKatmani'), true);

// ── Ölçü hedef_hal'leri kümülatiftir (sonHal deseni). Işık niceliği
// güvencesi: bu fonksiyon zemine/ışığa dokunan HİÇBİR şey yazmaz --
// yalnız sınır, gölge (kontrast) ve iz opaklıkları değişir. ─────────────
const kdSinir=$('kdSinir'), kdGolge=$('kdGolgeKatmani'), kdIz=$('kdIz'), kdPay=$('kdPay');
let sonHal={};
function uygulaHal(hamHal){
  sonHal=Object.assign({}, sonHal, hamHal);
  const hal=sonHal;
  kdSinir.setAttribute('opacity', String(hal.sinir!==undefined?hal.sinir:0));
  kdGolge.setAttribute('opacity', String((hal.okunurluk!==undefined?hal.okunurluk:0)*0.9));
  kdIz.setAttribute('opacity', String((hal.iz!==undefined?hal.iz:0)*0.35));
  kdPay.setAttribute('opacity', String((hal.payGoster!==undefined?hal.payGoster:0)*0.7));
}

let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniKur(){
  if(sahneMetniEl||!partisyonRef) return;
  sahneMetniEl=document.createElement('ol');
  sahneMetniEl.className='sahne-metni';
  kunye.el.appendChild(sahneMetniEl);
  sahneMetniniGuncelle();
}
function sahneMetniniGuncelle(){
  if(!sahneMetniEl||!partisyonRef) return;
  sahneMetniEl.innerHTML='';
  partisyonRef.olcuLer.forEach(function(o){
    if(!o.metin) return;
    const li=document.createElement('li');
    li.textContent=o.metin[lang]||o.metin.tr;
    sahneMetniEl.appendChild(li);
  });
}

function metinYaz(m){
  sonMetin=m;
  const t=m?(m[lang]||m.tr||''):'';
  $('captionWrap').classList.remove('gorunur');
  window.setTimeout(function(){
    $('caption').textContent=t;
    if(t) $('captionWrap').classList.add('gorunur');
  }, t?150:0);
}

// ── Kendim gezineyim: sınırın genişliğini kaydırıcıyla sen ayarla.
// 0 = sınır yok (eşit ışık, hiçbir şey görünmez); genişledikçe görünen
// pay büyür AMA keskinlik düşer -- sınır gevşedikçe okunurluk azalır;
// tam açık uçta yine okunamazlığa yaklaşır. Görünür sonuç: biçimlerin
// seçilebilirliği. ─────────────────────────────────────────────────────
function applySlider(v){
  const t=v/100;
  if(t<0.04){
    kdSinir.setAttribute('opacity','0');
    kdGolge.setAttribute('opacity','0');
    return;
  }
  const r=120+t*760;
  kdSinir.setAttribute('r', r.toFixed(0));
  kdIz.setAttribute('r', r.toFixed(0));
  $('kdMaskDaire').setAttribute('r', (r*3.2).toFixed(0));
  kdSinir.setAttribute('opacity','1');
  // Sınır genişledikçe kontrast düşer: t=0.2 civarı en keskin, uçta ~0.15.
  const keskinlik=Math.max(0.15, 1.05-t*0.95);
  kdGolge.setAttribute('opacity', (keskinlik*0.9).toFixed(3));
}
$('slider').addEventListener('input', e=>{
  if(!document.body.classList.contains('sahne-bitti')) return;
  applySlider(+e.target.value);
});

let motorAPI=null;
(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/kandil.json').then(function(r){ return r.json(); }).then(function(p){
    partisyonRef=p;
    sahneMetniniKur();
    motorAPI=window.__sahneMotoru.yarat({
      container:document.querySelector('.stage-wrap'), partisyon:p,
      applyOlcu:function(o){ uygulaHal(o.hedef_hal||{}); },
      metinGoster:metinYaz,
      olcuGoster:function(i,t){ $('olcuGosterge').textContent=(i+1)+' / '+t; },
      biterEl:$('motorBiter'),
      tepki:function(ev){
        if(ev.tip==='bitti'){ document.body.classList.add('sahne-bitti'); }
      },
    });
  });
})();

const stageWrap=document.querySelector('.stage-wrap');
stageWrap.setAttribute('tabindex','0');
stageWrap.addEventListener('keydown', function(e){
  if(!motorAPI) return;
  if(e.key===' '){ e.preventDefault(); if(motorAPI.durum==='oynuyor') motorAPI.pause(); else if(motorAPI.durum==='durakli') motorAPI.resume(); return; }
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return;
  e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0, Math.min(motorAPI.olcuSayisi-1, motorAPI.aktifIdx+y)));
});

// prefers-reduced-motion: motorun genel davranışı bütün hedef_hal'leri
// birleştirir; birleşim burada "iz" haline düşer (okunamaz aydınlık + iz).
// Statik biçim de bir şey GÖSTERSİN diye reduced-motion'da sınırlı hali
// (ölçü 2-3 birleşimi) elle uyguluyoruz -- metinler zaten sıralı statik.
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  window.setTimeout(function(){
    uygulaHal({sinir:1, okunurluk:1, payGoster:1, iz:0});
  }, 300);
}

setLang('tr');
window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr"; try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}
  var a = document.createElement("a"); a.className = "sahne-geri"; a.href = "sahneler/";
  a.textContent = "← " + ETIKET[dil]; document.body.appendChild(a);
  function geriGit(){try{if(document.referrer&&history.length>1&&new URL(document.referrer).origin===location.origin){history.back();return;}}catch(e){} location.href="sahneler/";}
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return; var el=document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault(); geriGit();
  });
})();
</script>
