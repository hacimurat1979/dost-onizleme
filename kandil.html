<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Kandil — Sınırlanınca Görünen. docs/04 S5. Nûr 24:35 ailesi.
     S1 ile ilk kare ayrımı: S1'de bulanık biçimler var; S5'te HİÇ biçim
     yok — boş, eşit, okunamaz aydınlık. -->
<title>Kandil — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614}
:root[data-theme=light]{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--go);margin-bottom:.45rem}
.sub{color:var(--mu);font-size:.88rem;font-style:italic;line-height:1.65;max-width:520px}
.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px}
#scene{width:440px;height:440px;max-width:92vw;display:block;border-radius:8px}
#scene:focus-visible{outline:2px solid var(--am);outline-offset:3px}
.stage{width:440px;max-width:92vw;text-align:center;margin-top:.5rem}
.state{font-size:.92rem;line-height:1.7;color:var(--mu);min-height:3.2rem}
.state.alinti{font-style:italic;color:var(--tx)}
.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.4rem;min-height:34px}
.olcu-gosterge{font-size:.7rem;color:var(--mu);letter-spacing:.15em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge,body.sahne-bitti .motor-kontroller{opacity:1}
.gezin-ipucu{font-size:.75rem;color:var(--mu);font-style:italic;margin-top:.35rem;opacity:0;transition:opacity .6s ease}
body.sahne-bitti .gezin-ipucu{opacity:.75}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--bo);color:var(--mu);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--am);color:var(--tx)}
.sahne-kunye{width:440px;max-width:92vw;margin-top:1.2rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye ul{list-style:none;margin-top:.7rem}.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--mu)}
.sahne-kunye li.sahne-kunye__serh{color:var(--mu);font-size:.76rem}
.sahne-kunye a{color:var(--am);text-decoration:none;border-bottom:1px solid var(--bo);white-space:nowrap}
.sahne-metni{margin:.8rem 0 0 1.1rem;padding-top:.7rem;border-top:1px solid var(--bo);color:var(--mu);font-size:.78rem}.sahne-metni li{margin-bottom:.3rem}
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;font-family:inherit;text-decoration:none;opacity:.72;border:1px solid var(--bo);background:var(--su);color:var(--mu)}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;color:var(--tx);border-color:var(--go)}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script>(function(){try{var s=localStorage.getItem("dost-theme");if(s==="light"||s==="dark")document.documentElement.setAttribute("data-theme",s);}catch(e){}})();</script>
</head>
<body>
<header>
  <h1 id="i-title">Kandil — Sınırlanınca Görünen</h1>
  <p class="sub" id="i-sub">Nûr 24:35 — sınırsız nûr kandile girer, sahne ilk kez okunur; kandil çekilir, ışık da</p>
</header>

<div class="sw">
  <svg id="scene" viewBox="0 0 440 440" tabindex="0" role="img"
       aria-label="Biçimsiz eşit aydınlık; bir kandil belirir, sahne okunur, sonra kandil ve ışık gizlenir">
    <defs>
      <clipPath id="cl"><rect x="0" y="0" width="440" height="440" rx="8"/></clipPath>
      <!-- Ölçü 1: her yer eşit, doygun aydınlık; kaynak yok (kaynak koordinatı viewBox dışında). -->
      <radialGradient id="gEsit" cx="220" cy="220" r="360" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F5E3BC"/><stop offset="100%" stop-color="#E8D2A4"/>
      </radialGradient>
      <!-- Kandilin yaydığı ışık: sınırlı radyal — degradenin bittiği yer 'karanlık payı'. -->
      <radialGradient id="gKandilIsik" cx="220" cy="220" r="150" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.95"/>
        <stop offset="60%" stop-color="#FFE9B8" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#FFE9B8" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g clip-path="url(#cl)">
      <!-- Zemin karanlık; ölçü 1'de üstüne 'esit aydınlık' örtüsü konur. -->
      <rect x="0" y="0" width="440" height="440" fill="#0A0912"/>
      <!-- 'Karanlık payı' hep vardır; ölçü 4'te aydınlığın erişmediği yer olarak görünür kalır. -->
      <rect id="karanlikPayi" x="0" y="0" width="440" height="440" fill="#0A0912" opacity="0" style="transition:opacity 2s ease"/>
      <!-- Ölçü 1'in eşit aydınlığı (biçimsiz, okunamaz): açık bir renkli örtü. -->
      <rect id="esitAydinlik" x="0" y="0" width="440" height="440" fill="url(#gEsit)" opacity="1" style="transition:opacity 1.8s ease"/>
      <!-- Kandilin yaydığı sınırlı ışık: ölçü 2'de toplanır, ölçü 5'te söner. -->
      <rect id="kandilIsik" x="0" y="0" width="440" height="440" fill="url(#gKandilIsik)" opacity="0" style="transition:opacity 1.8s ease"/>
      <!-- Ölçü 3: sahne "okunur olur" — birkaç sade duvar/nişin siluet çizgisi. -->
      <g id="okunanBicimler" opacity="0" style="transition:opacity 1.8s ease">
        <path d="M 40 340 L 40 300 L 400 300 L 400 340" fill="none" stroke="#3A2F1E" stroke-width="2"/>
        <path d="M 90 300 L 90 240 L 130 240 L 130 300" fill="none" stroke="#3A2F1E" stroke-width="1.8"/>
        <path d="M 310 300 L 310 240 L 350 240 L 350 300" fill="none" stroke="#3A2F1E" stroke-width="1.8"/>
      </g>
      <!-- Kandil biçimi (sahne-cizim.js kap 'kandil' varyantı zarif, sade). -->
      <g id="kandilG" opacity="0" style="transition:opacity 1.8s ease" transform="translate(220 220)">
        <!-- fitil parlaması: iç minik radyal -->
        <circle cx="16" cy="-2" r="4" fill="#FFF3D6" opacity="0.85"/>
      </g>
      <!-- Ölçü 5'in "gizlenme örtüsü": son kararma. -->
      <rect id="sonSonme" x="0" y="0" width="440" height="440" fill="#050510" opacity="0" style="transition:opacity 2s ease"/>
    </g>
  </svg>
  <div class="stage">
    <p class="state" id="state" aria-live="polite"></p>
    <div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>
    <p class="gezin-ipucu" id="gezinIpucu"></p>
  </div>
  <div id="kunyeYuvasi"></div>
</div>

<script src="assets/sahne-motoru.js"></script>
<script src="assets/sahne-cizim.js"></script>
<script>
const L={
  tr:{title:'Kandil — Sınırlanınca Görünen',sub:'Nûr 24:35 — sınırsız nûr kandile girer, sahne ilk kez okunur; kandil çekilir, ışık da',gezin:'Ok tuşları ölçüler arasında gezdirir; boşluk duraklatır.',kunyeBaslik:'Künye — bu sahne nereden geliyor?'},
  en:{title:'The Lamp — What Becomes Visible When Bounded',sub:'Al-Nūr 24:35 — the boundless light enters the lamp and the scene becomes readable; the lamp withdraws, and so does the light',gezin:'Arrow keys move between measures; space pauses.',kunyeBaslik:'Sources — where this scene comes from'},
  pt:{title:'A Lâmpada — O que Se Torna Visível quando Limitado',sub:'Al-Nūr 24:35 — a luz sem limites entra na lâmpada e a cena torna-se legível; a lâmpada retira-se, e a luz também',gezin:'As setas percorrem os compassos; espaço pausa.',kunyeBaslik:'Fontes — de onde vem esta cena'}
};

const KUNYE=[
  {tur:'dost',metin:{tr:'“Allah göklerin ve yerin nûrudur…” (Nûr 24:35)',en:'“God is the light of the heavens and the earth…” (Al-Nūr 24:35)',pt:'“Deus é a luz dos céus e da terra…” (Al-Nūr 24:35)'},kaynak:{href:'futuhat/c15k173',etiket:'Fütûhât, bab 426 (c15k173)'}},
  {tur:'dost',metin:{tr:'“…nuru sınırlıyor ve ardından bu sınırlı nuru bir kandile benzetiyor. Ama bir kandilin ışığı ile gökleri ve yeri aydınlatan ışık bir olabilir mi?”',en:'“…it bounds the light and then likens the bounded light to a lamp. Yet can the lamp’s light and the light that illumines the heavens and the earth be one?”',pt:'“…limita a luz e depois compara essa luz limitada a uma lâmpada. Mas poderá a luz da lâmpada e a luz que ilumina os céus e a terra ser uma só?”'},kaynak:{href:'futuhat/c3k35',etiket:'c3k35'}},
  {tur:'dost',metin:{tr:'“Suret ile ruhaninin ilişkisine örnek olarak ışığı duvarlara yayılan kandil ve onun ışığını verebiliriz. Kandilin cismi gizlendiğinde ışık da kaybolur.” Başka bir bahiste, bir ruhanî varlığın nasıl sûrete girip göründüğünü anlatmak için kullanılıyor — doğrudan Nûr 24:35 üzerine değil, ama aynı imge.',en:'“As an example of the relation between a form and a spirit, we may cite the lamp whose light spreads to the walls, and its light. When the lamp’s body is hidden, the light too disappears.” From a different passage, used to describe how a spiritual being enters and appears through a form — not a direct reading of Al-Nūr 24:35, but the same image.',pt:'“Como exemplo da relação entre uma forma e um espírito, podemos citar a lâmpada cuja luz se espalha pelas paredes, e a sua luz. Quando o corpo da lâmpada se esconde, a luz também desaparece.” De uma passagem diferente, usada para descrever como um ser espiritual entra e aparece através de uma forma — não uma leitura direta de An-Nūr 24:35, mas a mesma imagem.'},kaynak:{href:'futuhat/c1k12',etiket:'c1k12'}},
  {tur:'okuma',metin:{tr:'Ayna-v4 ve S4 ile aynı büyük aile — “sonsuzun kaba girmesi.” Farkı bitişte: ayna çoğaltır (v4), kalp sığdırır (S4), kandil görünür kılar ve çekilir.',en:'Same broad family as Mirror-v4 and S4 — “the boundless entering a vessel.” The difference is at the close: the mirror multiplies (v4), the heart contains (S4), the lamp makes visible and then withdraws.',pt:'Da mesma família alargada que o Espelho-v4 e S4 — “o sem-limites entrando num vaso.” A diferença está no final: o espelho multiplica (v4), o coração contém (S4), a lâmpada torna visível e depois retira-se.'}},
  {tur:'serh',metin:{tr:'Âyetin kendisi tek bir kandilden çok daha katmanlı: “mişkât” (hücre), “mısbah” (kandil), “zücâce” (cam), “zeytin ağacı” art arda geçer. Bu sahne o zinciri tek bir kandile indirdi — katmanları art arda çizmek eşmerkezli çember yasağına çok yaklaşırdı.',en:'The verse itself is far more layered than a single lamp: it moves through “niche” (mishkāt), “lamp” (miṣbāḥ), “glass” (zujāja), “olive tree” in sequence. This scene reduced that chain to one lamp — drawing the layers one inside another would have come too close to the ban on concentric circles.',pt:'O próprio versículo é muito mais estratificado do que uma única lâmpada: passa por “nicho” (mishkāt), “lâmpada” (miṣbāḥ), “vidro” (zujāja), “oliveira” em sequência. Esta cena reduziu essa cadeia a uma única lâmpada — desenhar as camadas uma dentro da outra teria chegado demasiado perto da proibição dos círculos concêntricos.'}}
];

const $=id=>document.getElementById(id);
let lang='tr';
const scene=$('scene');
const C=window.DostSahneCizim;

// Kandil biçimini sahne-cizim.js'ten al
C.kap($('kandilG'), {bicim:'kandil', cx:0, cy:0, r:40, cizgi:'#E8D2A4', kalinlik:2.4});

function uygula(hal){
  // Ölçü 1: esit aydınlık tam açık. Ölçü 2'de kandil belirir + esit aydınlık
  // yerine kandil ışığı gelir (toplanma).
  if(typeof hal.kandilOpaklik==='number') $('kandilG').style.opacity=String(hal.kandilOpaklik);
  if(typeof hal.toplanma==='number'){
    $('esitAydinlik').style.opacity=String(1 - hal.toplanma);
    $('kandilIsik').style.opacity=String(hal.toplanma);
  }
  if(typeof hal.disKaranlik==='number'){
    // Ölçü 3: gölge/biçim ortaya çıkar. disKaranlik>0 ise okunanBicimler görünür.
    $('okunanBicimler').style.opacity=String(Math.min(1, hal.disKaranlik*2.5));
  }
  if(typeof hal.karanlikPayi==='number'){
    // Ölçü 4: karanlık payı görünür kalır. kandil ışığı zaten sınırlı;
    // karanlıkPayi katmanı üstte hafif bir mat perde olarak görünür.
    $('karanlikPayi').style.opacity=String(hal.karanlikPayi*0.35);
  }
  if(typeof hal.sonSonme==='number') $('sonSonme').style.opacity=String(hal.sonSonme*0.85);
  if(hal.nefes) document.body.classList.add('sahne-nefes');
}

const kunye=C.kunye($('kunyeYuvasi'), KUNYE, {tr:L.tr.kunyeBaslik,en:L.en.kunyeBaslik,pt:L.pt.kunyeBaslik});
let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniKur(p){ if(sahneMetniEl) return; sahneMetniEl=document.createElement('ol'); sahneMetniEl.className='sahne-metni'; kunye.el.appendChild(sahneMetniEl); sahneMetniniGuncelle(); }
function sahneMetniniGuncelle(){ if(!sahneMetniEl||!partisyonRef) return; sahneMetniEl.innerHTML=''; partisyonRef.olcuLer.forEach(o=>{if(!o.metin) return; const li=document.createElement('li'); li.textContent=o.metin[lang]||o.metin.tr; sahneMetniEl.appendChild(li);}); }

let motorAPI=null, sonMetin=null;
function metinYaz(m){ const s=$('state'); if(!m){s.textContent='';s.classList.remove('alinti');return;} const t=m[lang]||m.tr||''; s.textContent=t; s.classList.toggle('alinti', t.indexOf('“')===0); }
function setLang(l){lang=l;const d=L[l];$('i-title').textContent=d.title;$('i-sub').textContent=d.sub;$('gezinIpucu').textContent=d.gezin;kunye.guncelle(l);sahneMetniniGuncelle();if(sonMetin) metinYaz(sonMetin);}

// Kümülatif hâl (S1'deki desen): geri gezinme ve reduced-motion son ölçüde
// mutlak hâlin toplanmasını gerektirir.
function kumulatifHal(idx){
  const hal={kandilOpaklik:0,toplanma:0,disKaranlik:0,karanlikPayi:0,sonSonme:0,nefes:false};
  if(!partisyonRef) return hal;
  for(let i=0;i<=idx && i<partisyonRef.olcuLer.length;i++){
    const h=partisyonRef.olcuLer[i].hedef_hal||{};
    for(const k of Object.keys(h)){
      if(k==='nefes') hal.nefes=!!h[k];
      else if(typeof h[k]==='number') hal[k]=h[k];
    }
  }
  return hal;
}

(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/kandil.json').then(r=>r.json()).then(function(p){
    partisyonRef=p; sahneMetniniKur(p);
    motorAPI=window.__sahneMotoru.yarat({
      container:scene, partisyon:p,
      applyOlcu:function(o){
        const idx=p.olcuLer.findIndex(x=>x.id===o.id);
        uygula(kumulatifHal(idx<0?0:idx));
      },
      metinGoster:function(m){ sonMetin=m; metinYaz(m); },
      olcuGoster:function(i,t){ $('olcuGosterge').textContent=(i+1)+' / '+t; },
      biterEl:$('motorBiter'),
      tepki:function(ev){ if(ev.tip==='bitti') document.body.classList.add('sahne-bitti'); }
    });
  });
})();

scene.addEventListener('keydown',function(e){
  if(!motorAPI) return;
  if(e.key===' '){e.preventDefault(); if(motorAPI.durum==='oynuyor')motorAPI.pause(); else if(motorAPI.durum==='durakli')motorAPI.resume(); return;}
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return; e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0,Math.min(motorAPI.olcuSayisi-1,motorAPI.aktifIdx+y)));
});

setLang('tr');
window.addEventListener('message',function(e){ if(e.data&&e.data.type==='setLang'&&L[e.data.lang]) setLang(e.data.lang); });
</script>

<script>
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr"; try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}
  var a = document.createElement("a"); a.className = "sahne-geri"; a.href = "sahneler/";
  a.textContent = "← " + ETIKET[dil]; document.body.appendChild(a);
  function geriGit(){try{if(document.referrer&&history.length>1&&new URL(document.referrer).origin===location.origin){history.back();return;}}catch(e){} location.href="sahneler/";}
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return; var el=document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault(); geriGit();
  });
})();
</script>
</body>
</html>
