<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Meditasyon — Dost Arabi</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;
  --muted:#898781;--gold:#FFC233;--accent:#C98500;
}
@media(prefers-color-scheme:light){:root{
  --bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;
  --muted:#6F6D65;--gold:#8A6100;--accent:#8C6D1A;
}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--accent:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--gold:#8A6100;--accent:#8C6D1A}

html,body{height:100%;width:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:Georgia,'Times New Roman',serif;
  display:flex;flex-direction:column;overflow:hidden;height:100vh;
}

/* ── Header strip ─────────────────────────────── */
.hdr{
  display:flex;align-items:center;gap:.75rem;
  padding:.55rem 1.1rem;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.hdr-back{
  background:none;border:1px solid var(--border);color:var(--muted);
  font:inherit;font-size:.78rem;padding:.25rem .7rem;border-radius:2rem;
  cursor:pointer;transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;
}
.hdr-back:hover{border-color:var(--accent);color:var(--text)}
.hdr-tabs{display:flex;gap:.5rem;flex:1;justify-content:center}
.tab{
  background:none;border:1px solid transparent;color:var(--muted);
  font:inherit;font-size:.82rem;letter-spacing:.04em;
  padding:.28rem 1.1rem;border-radius:2rem;cursor:pointer;transition:.2s;
}
.tab:hover{color:var(--text);border-color:var(--border)}
.tab.on{
  background:var(--surface);border-color:var(--accent);
  color:var(--text);
}
.hdr-lang{display:flex;gap:.3rem}
.lbtn{
  background:none;border:1px solid var(--border);color:var(--muted);
  font:inherit;font-size:.76rem;padding:.22rem .55rem;border-radius:2rem;cursor:pointer;transition:.2s;
}
.lbtn.on,.lbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── iframe panels ───────────────────────────── */
.panels{flex:1;position:relative;overflow:hidden}
.panel{
  position:absolute;inset:0;border:none;width:100%;height:100%;
  display:none;
}
.panel.on{display:block}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}

/* ETKILESIM_DILI.md: hareket "atlanır, taklit edilmez". Kardeş sahneler
   (berzah, nefes-i-rahmani...) bu kuralı baştan taşıyordu; bu sayfada
   unutulmuştu -- 2026-08-05 çapraz denetiminde yedi sayfada birden
   yakalandı. Süreleri sıfırlamak animasyonun SON karesini gösterir:
   içerik kaybolmaz, yalnız hareket kalkar. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="hdr">
  <a href="/" class="hdr-back" id="back-lnk">← Haritaya</a>
  <div class="hdr-tabs">
    <button class="tab on" id="tab-perde" onclick="showTab('perde')">
      <span id="t-perde">Perde Zinciri</span>
    </button>
    <button class="tab" id="tab-ayna" onclick="showTab('ayna')">
      <span id="t-ayna">Ayna Metaforu</span>
    </button>
  </div>
  <div class="hdr-lang">
    <button class="lbtn on" id="ltr" onclick="setLang('tr')">TR</button>
    <button class="lbtn" id="len" onclick="setLang('en')">EN</button>
    <button class="lbtn" id="lpt" onclick="setLang('pt')">PT</button>
  </div>
</div>

<div class="panels">
  <iframe id="if-perde" class="panel on" src="perde-zinciri.html" title="Perde Zinciri" allow="same-origin"></iframe>
  <iframe id="if-ayna"  class="panel"    src="ayna-metaforu.html"  title="Ayna Metaforu"  allow="same-origin"></iframe>
</div>

<script>
const TABS = {
  tr:{perde:'Perde Zinciri', ayna:'Ayna Metaforu', back:'← Haritaya'},
  en:{perde:'Chain of Veiling', ayna:'Mirror Metaphor', back:'← Map'},
  pt:{perde:'Cadeia do Véu', ayna:'Metáfora do Espelho', back:'← Mapa'},
};

let curLang='tr', curTab='perde';
// Track which lang each iframe has received
const ifLang={perde:null, ayna:null};

function setLang(l){
  curLang=l;
  ['ltr','len','lpt'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById('l'+l).classList.add('on');
  const t=TABS[l];
  document.getElementById('t-perde').textContent=t.perde;
  document.getElementById('t-ayna').textContent=t.ayna;
  document.getElementById('back-lnk').textContent=t.back;
  // Push lang to both iframes (they listen for postMessage)
  ['perde','ayna'].forEach(id=>{
    const fr=document.getElementById('if-'+id);
    if(fr && fr.contentWindow){
      fr.contentWindow.postMessage({type:'setLang',lang:l},'*');
    }
  });
}

function showTab(tab){
  curTab=tab;
  ['perde','ayna'].forEach(id=>{
    document.getElementById('tab-'+id).classList.toggle('on',id===tab);
    document.getElementById('if-'+id).classList.toggle('on',id===tab);
  });
}

// Forward lang once each iframe finishes loading
['perde','ayna'].forEach(id=>{
  const fr=document.getElementById('if-'+id);
  fr.addEventListener('load',function(){
    if(curLang!=='tr'){
      try{ fr.contentWindow.postMessage({type:'setLang',lang:curLang},'*'); }
      catch(e){}
    }
  });
});
</script>

<script>
// ESC ile çıkış (2026-08-05 geri bildirimi) -- ama görünür bir "sahne-geri"
// düğmesi YOK burada: bu sayfanın kendi başlık şeridi zaten bir "Haritaya"
// bağlantısı taşıyor. Öteki kardeş sahnelerden (perde-zinciri.html,
// ayna-metaforu.html) kopyalanan görünür pilli düğme, bu sayfada başlığın
// üstüne bindirilip ikinci, gereksiz bir "kemer" gibi görünüyordu (kullanıcı
// bulgusu, 2026-08-06: "yukarda başka bir kemer daha görünüyor") -- üstelik
// bu iki kardeş sahne meditasyon.html içinde birer iframe olarak da gömülü
// olduğundan kendi düğmelerini bir KEZ DAHA, iframe'in kendi köşesinde
// çiziyorlardı. Kaldırılan yalnız görünür düğme; ESC davranışı (öteki
// sahnelerle aynı hedefe, sahneler galerisine döner) duruyor.
(function () {
  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
</body>
</html>
