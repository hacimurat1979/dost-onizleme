<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Nefes-i Rahmânî — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D12) -->
<title>Nefes-i Rahmânî — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}

#stage{width:min(640px,94vw);aspect-ratio:16/10;height:auto;display:block;margin:.4rem auto .7rem;background:var(--panel);border:1px solid var(--border);border-radius:12px;touch-action:none}

@keyframes fanHint{0%,100%{opacity:.6}50%{opacity:1}}
.fan-hint{fill:var(--muted);font-family:Georgia,'Times New Roman',serif;font-style:italic;animation:fanHint 3s ease-in-out 4s 3}
@media(prefers-reduced-motion:reduce){.fan-hint{animation:none}}

.fan-caption{width:min(640px,96vw);text-align:center;font-size:.86rem;line-height:1.75;color:var(--text);opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease;margin-bottom:1rem}
.fan-caption.show{opacity:1;transform:none}

.quote-box{width:min(560px,96vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem}
.quote-text{font-size:.88rem;line-height:1.75;font-style:italic}
.quote-src{font-size:.72rem;color:var(--muted);margin-top:.55rem}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 id="hTitle">Nefes-i Rahmânî</h1>
  <p class="sub" id="hSub">İlahî isimler göğüste birikir, dayanılmaz sınırda bir nefesle dışarı fışkırır — ve o tek nefes, harflere, harfler kelimeye ayrılır. Sürükleyerek geri aldığında, hepsi yeniden tek nefese döner.</p>
</header>

<svg id="stage" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <defs>
    <radialGradient id="fanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:var(--gold);stop-opacity:.55"/>
      <stop offset="100%" style="stop-color:var(--gold);stop-opacity:0"/>
    </radialGradient>
  </defs>
  <circle id="fanGlowC" cx="800" cy="820" r="0" fill="url(#fanGlow)"></circle>
  <g id="fanBranches"></g>
  <g id="fanTips"></g>
  <circle id="fanOrigin" cx="800" cy="820" r="6" fill="var(--gold)"></circle>
  <text id="fanHint" class="fan-hint" x="1560" y="60" text-anchor="end" font-size="28"></text>
  <rect id="fanHit" x="0" y="0" width="1600" height="1000" fill="transparent" style="cursor:grab"
    tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
    aria-label="Nefesin dallanma derecesini sürükle"></rect>
</svg>

<p class="fan-caption" id="fanCaption"></p>

<div class="quote-box">
  <p class="quote-text" id="quoteText"></p>
  <p class="quote-src" id="quoteSrc"></p>
</div>

<script>
const LA={
  tr:{
    title:'Nefes-i Rahmânî',
    sub:'İlahî isimler göğüste birikir, dayanılmaz sınırda bir nefesle dışarı fışkırır — ve o tek nefes, harflere, harfler kelimeye ayrılır. Sürükleyerek geri aldığında, hepsi yeniden tek nefese döner.',
    caption:'İsimler göğüste birikti; tek nefeste dışarı çıktı. Harflere, harfler kelimeye ayrıldı — ama kaynağa hep bağlı kaldı. Geri sürüklersen tek nefese döner.',
    hint:'Geri sürükle',
    quotes:[
      { text:'"Harekeleri küçük harfler olarak tanımlıyoruz... tıpkı insanın cisim ve ruh üflenmesinden var olması gibi, kelime de harf ve hareke bileşiminden bambaşka bir yaratılış olarak ortaya çıkar."', src:'Fütûhât-ı Mekkiyye, Kısım VIII (Harekeler: Kelimelerin Ruhu)' },
      { text:'İlahî isimler Hakk\'ın sinesinde basınç altında birikir (kerb); dayanılmaz son sınıra gelindiğinde bir nefes verişle (teneffüs) dışarı fışkırır — bu fışkırma âlemin varlık kazanmasıdır.', src:'felsefi-terimler.json, "nefes-i-rahmani" (Izutsu\'nun aktarımına dayanır)' },
    ],
  },
  en:{
    title:'The Breath of the All-Merciful',
    sub:'The divine names accumulate in the breast under pressure, then burst out in a single breath at the unbearable limit — and that one breath separates into letters, the letters into a word. Drag it back, and it all returns to a single breath.',
    caption:'The names gathered in the chest; a single breath released them. They divided into letters, letters into words — yet stayed tethered to their source. Drag back and they return to one breath.',
    hint:'Drag back',
    quotes:[
      { text:'"We define the vowel-marks as small letters... just as a human comes into being from body plus the breathing-in of spirit, a word too emerges as an entirely different kind of creation from the combination of letter plus vowel-mark."', src:'Al-Futuhat al-Makkiyya, Part VIII (Vowel-Marks: The Spirit of Words)' },
      { text:'The Divine Names accumulate under pressure in the Real\'s breast (karb); upon reaching an unbearable limit, they burst forth through an exhalation (tanaffus) — this bursting-forth is the world\'s coming into existence.', src:'felsefi-terimler.json, "nefes-i-rahmani" (as related by Izutsu)' },
    ],
  },
  pt:{
    title:'O Sopro do Misericordioso',
    sub:'Os nomes divinos se acumulam no peito sob pressão, e irrompem num único sopro no limite insuportável — e esse sopro se separa em letras, as letras numa palavra. Arraste de volta, e tudo retorna a um único sopro.',
    caption:'Os nomes acumularam-se no peito; um único sopro os libertou. Dividiram-se em letras, letras em palavras — mas mantiveram-se atados à origem. Arraste para trás e voltam a um só sopro.',
    hint:'Arraste para trás',
    quotes:[
      { text:'"Definimos as vogais como pequenas letras... assim como um humano vem à existência a partir do corpo mais o sopro do espírito, uma palavra também surge como um tipo inteiramente diferente de criação a partir da combinação de letra mais vogal."', src:'Al-Futuhat al-Makkiyya, Parte VIII (Vogais: O Espírito das Palavras)' },
      { text:'Os Nomes Divinos se acumulam sob pressão no peito do Real (karb); ao atingir um limite insuportável, irrompem através de uma exalação (tanaffus) — esse irromper é o vir-a-existir do mundo.', src:'felsefi-terimler.json, "nefes-i-rahmani" (conforme relatado por Izutsu)' },
    ],
  },
};

let curLang='tr', quoteIdx=0;
const $=id=>document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderAll(){
  const d=LA[curLang];
  $('hTitle').textContent=d.title;
  $('hSub').textContent=d.sub;
  $('fanHint').textContent=d.hint;
  $('fanCaption').textContent=d.caption;
  const q=d.quotes[quoteIdx];
  $('quoteText').textContent=q.text;
  $('quoteSrc').textContent=q.src;
}
function setLang(l){ if(!LA[l]) return; curLang=l; renderAll(); }

setInterval(()=>{ quoteIdx=(quoteIdx+1)%LA[curLang].quotes.length; const q=LA[curLang].quotes[quoteIdx]; $('quoteText').textContent=q.text; $('quoteSrc').textContent=q.src; }, 9000);

// ── Sahne: nefesin bir gövdeden yelpaze gibi dallanarak harflere/kelimelere
// ayrışması ("fan-tree") ─────────────────────────────────────────────────
// GORSEL_DIL.md: kavramı resmetme, davranışını resmet. Tek bir nokta
// (nefes) BASINÇ altında büyür (kerb), sonra bir gövde halinde yükselir,
// gövde beş ana dala yelpaze gibi açılır, her dal kendi içinde ikiye
// üçe bölünerek uçlarında harf/kelime izlerine dönüşür -- ama her dal
// zincirinin ilk ucu hep aynı kaynağa (nefes noktasına) bağlı kalır.
// Kullanıcı geri sürükleyince yelpaze kendi çizdiği yoldan katlanıp
// tek nefese döner -- ayrışma yok oluş değil, kaynaktan kopmayan bir açılış.
const svgNS='http://www.w3.org/2000/svg';
const branchesG=$('fanBranches');
const tipsG=$('fanTips');

let seed=41;
const rand=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };

const segments=[];
const tips=[];

function buildBranch(x,y,angle,length,depth,ts,te){
  const x2=x+Math.cos(angle)*length, y2=y+Math.sin(angle)*length;
  const w = depth===0 ? 3.2 : depth===1 ? 2.2 : depth===2 ? 1.5 : 1.1;
  segments.push({x1:x,y1:y,x2,y2,ts,te,w});
  if(depth<3){
    const childCount = depth===0 ? 5 : 2+Math.floor(rand()*2);
    const spread = depth===0 ? Math.PI*0.55 : Math.PI*0.4;
    const dts=te, dte=te+(te-ts)*0.9;
    for(let i=0;i<childCount;i++){
      const frac = childCount===1 ? 0.5 : i/(childCount-1);
      const childAngle = angle + (frac-0.5)*spread + (rand()-0.5)*0.08;
      const childLength = length*(0.62+rand()*0.12);
      buildBranch(x2,y2,childAngle,childLength,depth+1,dts,dte);
    }
  } else {
    tips.push({x:x2,y:y2,kind:'letter',ts:te,te:te+0.05});
    if(rand()<0.55){
      tips.push({x:x2+6,y:y2-2,kind:'word',ts:te+0.02,te:te+0.08});
      tips.push({x:x2-5,y:y2+3,kind:'word',ts:te+0.03,te:te+0.09});
    }
  }
}

const originX=800, originY=820;
const trunkEndX=800, trunkEndY=620;
segments.push({x1:originX,y1:originY,x2:trunkEndX,y2:trunkEndY,ts:0.18,te:0.35,w:3.6});

const primaryCount=5, primarySpread=Math.PI*0.85;
for(let i=0;i<primaryCount;i++){
  const frac=i/(primaryCount-1);
  const a=-Math.PI/2 + (frac-0.5)*primarySpread + (rand()-0.5)*0.06;
  const len=180+rand()*40;
  buildBranch(trunkEndX,trunkEndY,a,len,1,0.35,0.55);
}

const segEls=segments.map(s=>{
  const l=document.createElementNS(svgNS,'line');
  l.setAttribute('x1',s.x1); l.setAttribute('y1',s.y1);
  l.setAttribute('x2',s.x1); l.setAttribute('y2',s.y1);
  l.setAttribute('stroke','var(--gold)');
  l.setAttribute('stroke-width',s.w);
  l.setAttribute('stroke-linecap','round');
  l.setAttribute('opacity',0);
  branchesG.appendChild(l);
  return l;
});

const tipEls=tips.map(tp=>{
  const g=document.createElementNS(svgNS,'g');
  g.setAttribute('opacity',0);
  g.setAttribute('transform',`translate(${tp.x} ${tp.y})`);
  if(tp.kind==='letter'){
    const p=document.createElementNS(svgNS,'path');
    p.setAttribute('d','M -5 2 Q -1 -4 2 -1 Q 4 2 6 -2');
    p.setAttribute('stroke','var(--liminal)'); p.setAttribute('stroke-width',1.4);
    p.setAttribute('fill','none'); p.setAttribute('stroke-linecap','round');
    g.appendChild(p);
  } else {
    const c=document.createElementNS(svgNS,'circle');
    c.setAttribute('cx',0); c.setAttribute('cy',0); c.setAttribute('r',1.2);
    c.setAttribute('fill','var(--liminal)');
    g.appendChild(c);
  }
  tipsG.appendChild(g);
  return g;
});

const origin=$('fanOrigin');
const originGlow=$('fanGlowC');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

let pos=0;
function render(){
  const pressureP=clamp(pos/0.18,0,1);
  originGlow.setAttribute('r',(10+pressureP*70).toFixed(1));
  originGlow.setAttribute('opacity',(0.2+pressureP*0.7*(pos<0.35?1:Math.max(0,1-(pos-0.35)/0.4))).toFixed(3));
  origin.setAttribute('r',(5+pressureP*3).toFixed(2));

  segments.forEach((s,i)=>{
    const p=clamp((pos-s.ts)/(s.te-s.ts),0,1);
    if(p<=0){
      segEls[i].setAttribute('opacity',0);
      segEls[i].setAttribute('x2',s.x1);
      segEls[i].setAttribute('y2',s.y1);
      return;
    }
    const ep=1-Math.pow(1-p,2);
    const nx=s.x1+(s.x2-s.x1)*ep, ny=s.y1+(s.y2-s.y1)*ep;
    segEls[i].setAttribute('x2',nx.toFixed(2));
    segEls[i].setAttribute('y2',ny.toFixed(2));
    segEls[i].setAttribute('opacity',(0.7+p*0.3).toFixed(3));
  });

  tips.forEach((tp,i)=>{
    const p=clamp((pos-tp.ts)/(tp.te-tp.ts),0,1);
    tipEls[i].setAttribute('opacity',p.toFixed(3));
    const s=0.6+p*0.6;
    tipEls[i].setAttribute('transform',`translate(${tp.x} ${tp.y}) scale(${s.toFixed(2)})`);
  });

  $('fanHit').setAttribute('aria-valuenow',Math.round(pos*100));
}

let userActive=false, last=performance.now(), rafId=0;
const AUTO_SECONDS=5.5;
function loop(now){
  const dt=Math.min(80,now-last); last=now;
  if(!userActive && pos<1){
    pos=Math.min(1,pos+dt/(AUTO_SECONDS*1000));
    render();
  }
  rafId=requestAnimationFrame(loop);
}

const hit=$('fanHit');
const hint=$('fanHint');
const stageSvg=hit.ownerSVGElement;
function toSvg(clientX,clientY){
  const pt=stageSvg.createSVGPoint();
  pt.x=clientX; pt.y=clientY;
  const m=stageSvg.getScreenCTM();
  if(!m) return {x:0,y:0};
  return pt.matrixTransform(m.inverse());
}
let dragging=false, lastX=0;
function stopIntro(){ userActive=true; if(hint) hint.style.animation='none'; }

function onDown(e){
  dragging=true; hit.style.cursor='grabbing'; stopIntro();
  const ev=e.touches?e.touches[0]:e;
  const p=toSvg(ev.clientX,ev.clientY);
  lastX=p.x;
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  const ev=e.touches?e.touches[0]:e;
  const p=toSvg(ev.clientX,ev.clientY);
  const dx=p.x-lastX; lastX=p.x;
  pos=clamp(pos+dx/1400,0,1);
  render();
}
function onUp(){ dragging=false; hit.style.cursor='grab'; }

hit.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
hit.addEventListener('touchstart',onDown,{passive:false});
window.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp);
hit.addEventListener('keydown',e=>{
  let handled=true;
  if(e.key==='ArrowLeft') pos=clamp(pos-0.03,0,1);
  else if(e.key==='ArrowRight') pos=clamp(pos+0.03,0,1);
  else handled=false;
  if(handled){ stopIntro(); render(); e.preventDefault(); }
});

renderAll();
render();

if(reduceMotion){
  pos=1; render();
  $('fanCaption').classList.add('show');
} else {
  rafId=requestAnimationFrame(loop);
  setTimeout(()=>{ $('fanCaption').classList.add('show'); }, 5200);
}

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
</body>
</html>
