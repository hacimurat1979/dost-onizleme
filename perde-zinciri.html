<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Perde Zinciri — Dost Arabi -->
<title>Perde Zinciri — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--pa:#161614}
:root[data-theme=light]{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--go);margin-bottom:.45rem}
.sub{color:var(--mu);font-size:.88rem;font-style:italic;line-height:1.65;max-width:430px}
.layout{display:flex;gap:1.8rem;align-items:flex-start;flex-wrap:wrap;justify-content:center;width:100%;max-width:880px}
.sw{flex-shrink:0}
#scene{width:440px;height:440px;max-width:92vw;display:block;touch-action:none;cursor:ew-resize}
#scene:focus-visible{outline:2px solid var(--am);outline-offset:3px;border-radius:6px}
.stage{width:440px;max-width:92vw;text-align:center;margin-top:.4rem}
.state{font-size:.9rem;line-height:1.6;color:var(--mu);transition:color .35s;min-height:2.9rem}
.state.deep{color:var(--go)}
.grab-hint{font-size:.77rem;color:var(--mu);font-style:italic;margin-top:.5rem;transition:opacity .5s}
.grab-hint.gone{opacity:.28}
.aha{font-size:.85rem;font-style:italic;line-height:1.75;color:var(--am);margin-top:.7rem;white-space:pre-line;opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease}
.aha.show{opacity:1;transform:none}
/* /sahne motor: sahne oynarken sürükleme kapalı; bittikten sonra açılıyor. */
body:not(.sahne-bitti) #scene{cursor:default}
.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.4rem;min-height:34px}
.olcu-gosterge{font-size:.7rem;color:var(--mu);letter-spacing:.15em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge,body.sahne-bitti .motor-kontroller{opacity:1}
.kardes{margin-top:1rem;font-size:.75rem;line-height:1.6}
.kardes a{color:var(--am);text-decoration:none;border-bottom:1px solid var(--bo)}
.kardes a:hover,.kardes a:focus-visible{border-bottom-color:var(--am)}
.qp{flex:1;min-width:210px;max-width:310px;background:var(--pa);border:1px solid var(--bo);border-radius:12px;padding:1.3rem 1.1rem;min-height:250px}
.ql{font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;color:var(--mu);margin-bottom:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem}
.chip{background:transparent;border:1px solid var(--bo);color:var(--mu);border-radius:2rem;padding:.24rem .7rem;font:inherit;font-size:.76rem;cursor:pointer;transition:.2s}
.chip:hover,.chip.on{border-color:var(--am);color:var(--tx)}
.qt{font-size:1.15rem;margin-bottom:.7rem;color:var(--am)}
.qb{border-left:2px solid var(--am);padding-left:.85rem;margin-bottom:.7rem;display:none}
blockquote{font-size:.87rem;font-style:italic;line-height:1.8}
.qs{font-size:.72rem;color:var(--mu);margin-top:.35rem}
.qn{font-size:.82rem;color:var(--mu);line-height:1.6;font-style:italic}
@media(prefers-reduced-motion:no-preference){
  .drift{animation:drift 64s linear infinite}
  .drift2{animation:drift 88s linear infinite reverse}
  @keyframes drift{to{transform:rotate(360deg)}}
}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="i-title">Perde Zinciri</h1>
  <p class="sub" id="i-sub">Sıfatlar Zât'ı perdeler · Fiiller Sıfatları perdeler · Eserler Fiilleri perdeler</p>
</header>

<div class="layout">
  <div class="sw">
    <svg id="scene" viewBox="0 0 440 440" tabindex="0" role="application"
         aria-label="Perdeleri aralamak için sürükle / Drag to part the veils">
      <defs>
        <clipPath id="cl"><circle cx="220" cy="220" r="212"/></clipPath>
        <radialGradient id="gField" cx="220" cy="220" r="212" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#08060E" stop-opacity=".98"/>
          <stop offset="86%" stop-color="#08060E" stop-opacity=".93"/>
          <stop offset="100%" stop-color="#08060E" stop-opacity="0"/>
        </radialGradient>
        <!-- the centre: light is greatest just outside it and dies as it reaches it -->
        <radialGradient id="gCore" cx="220" cy="220" r="118" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#04030A"/>
          <stop offset="34%" stop-color="#08060E" stop-opacity=".98"/>
          <stop offset="62%" stop-color="#B87A26" stop-opacity=".85"/>
          <stop offset="80%" stop-color="#FFD87E" stop-opacity=".8"/>
          <stop offset="100%" stop-color="#FFC94D" stop-opacity="0"/>
        </radialGradient>
        <!-- three fogs, not three rings: real noise, so it reads as haze and not as geometry -->
        <filter id="fg1" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="5" seed="11" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.07  0 0 0 0 0.055  0 0 0 0 0.04  0 0 0 1.75 -0.42"/>
        </filter>
        <filter id="fg2" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="29" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.09  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 1.70 -0.40"/>
        </filter>
        <filter id="fg3" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="4" seed="53" result="n"/>
          <feColorMatrix in="n" type="matrix"
            values="0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0 0.06  0 0 0 1.65 -0.38"/>
        </filter>
        <filter id="blurCore" x="-70%" y="-70%" width="240%" height="240%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>
      </defs>

      <g clip-path="url(#cl)">
        <circle cx="220" cy="220" r="212" fill="url(#gField)"/>
        <!-- the centre never resolves: its blur is fixed, only its light grows -->
        <circle id="core" cx="220" cy="220" r="118" fill="url(#gCore)" filter="url(#blurCore)" opacity=".55"/>
        <!-- Sıfatlar: nearest the centre, the densest veil, and the last to thin -->
        <g id="vS" style="transform-origin:220px 220px">
          <rect class="drift" x="-90" y="-90" width="620" height="620" fill="#000" filter="url(#fg3)"
                style="transform-origin:220px 220px"/>
        </g>
        <g id="vF" style="transform-origin:220px 220px">
          <rect class="drift2" x="-90" y="-90" width="620" height="620" fill="#000" filter="url(#fg2)"
                style="transform-origin:220px 220px"/>
        </g>
        <g id="vE" style="transform-origin:220px 220px">
          <rect class="drift" x="-90" y="-90" width="620" height="620" fill="#000" filter="url(#fg1)"
                style="transform-origin:220px 220px"/>
        </g>
      </g>

      <!-- each label lives and dies with its own veil -->
      <text id="tE" x="220" y="44" text-anchor="middle" fill="#A98042" font-size="10.5" letter-spacing="3" font-family="Georgia,serif">ESERLER</text>
      <text id="tF" x="220" y="70" text-anchor="middle" fill="#B08838" font-size="10.5" letter-spacing="2.5" font-family="Georgia,serif">FİİLLER</text>
      <text id="tS" x="220" y="96" text-anchor="middle" fill="#D8A448" font-size="10.5" letter-spacing="2" font-family="Georgia,serif">SIFATLAR</text>
      <!-- named inside the darkness, never pointed at: the clearer the veils get, the more
           we know what it is we are not seeing -->
      <text id="tZ" x="220" y="226" text-anchor="middle" fill="#C89A50" font-size="10.5" letter-spacing="6" font-family="Georgia,serif" opacity=".42">ZÂT</text>
    </svg>
    <div class="stage">
      <p class="state" id="state"></p>
      <div class="motor-kontroller">
        <span class="olcu-gosterge" id="olcuGosterge" aria-live="polite"></span>
        <span id="motorBiter"></span>
      </div>
      <p class="grab-hint" id="grabHint"></p>
      <p class="aha" id="aha"></p>
    </div>
  </div>

  <div class="qp">
    <div class="ql" id="i-ql">HAKİKAT MERTEBELERİ</div>
    <div class="chips" id="chips"></div>
    <div class="qt" id="qt">Perde Zinciri</div>
    <div class="qb" id="qb">
      <blockquote id="qx"></blockquote>
      <div class="qs" id="qs"></div>
    </div>
    <p class="qn" id="qn">Bir mertebeye dokunarak ona ait söylemi gör.</p>
    <p class="kardes"><a id="kardesLink" href="berzah.html"></a></p>
  </div>
</div>

    aha:'You parted every veil. The light grew, but the centre did not clarify by a single step.\nSo it was not the veils that hid the Essence; hiddenness is Its own quality.',
    kardes:'Sibling scene: The Barzakh — only where you stand comes into focus →'},
  pt:{title:'Cadeia do Véu',sub:'Os Atributos velam a Essência · as Ações velam os Atributos · as Obras velam as Ações',

    kardes:'Cena irmã: O Barzakh — só o lugar onde você está fica nítido →'}

const D={
  rE:{k:0,
    q:{tr:'"Hakkın örtüsü senden başkası değildir. Hak seninle giyinir, sen O\'nun sûretisin."',en:'"Nothing veils the Real save yourself. The Real is clothed through you; you are Its image."',pt:'"Nada vela o Real senão tu mesmo. O Real Se veste através de ti; tu és a Sua imagem."'},
    src:'Esmâ-i Hüsnâ — el-Kebîr',
    n:{tr:'Eserler hem perde hem mazhar: Hakk\'ı gizlerler, ama aynı zamanda O\'nun tecellî ettiği yerdir. Perde ile ayna burada aynı şeydir.',en:'Effects are both veil and locus of manifestation: they conceal the Real and yet are where It appears. Veil and mirror here are the same thing.',pt:'As obras são ao mesmo tempo véu e lugar de manifestação: ocultam o Real e são simultaneamente onde Ele aparece. Véu e espelho aqui são a mesma coisa.'}},
  rF:{k:1,
    q:{tr:'"Kün emrinin anlamını ve kudretin kendisine yöneldiği şeye nasıl iliştiğini öğrendiğin müşahede mertebesidir."',en:'"It is the station of witnessing in which you learn the meaning of the command \'Be!\' and how power attaches to that toward which it is directed."',pt:'"É a estação de contemplação na qual aprendes o significado do comando \'Sê!\' e como o poder se liga àquilo para o qual é dirigido."'},
    src:'Fütûhât — 1. Bölüm (c1k3)',
    n:{tr:'Sıfatların işe dönüşmesi. Fiil perdesiyle Sıfat görünür olmaya başlar — ama eserde izini görmek, Sıfatın kendisini görmek değildir.',en:'The transformation of Attributes into action. Through the veil of Actions, Attribute begins to become visible — but seeing its trace in effects is not seeing the Attribute itself.',pt:'A transformação dos Atributos em ação. Através do véu das Ações, o Atributo começa a tornar-se visível — mas ver o seu rastro nas obras não é ver o próprio Atributo.'}},
  rS:{k:2,
    q:{tr:'"Sizi sıfatlarım vasıtasıyla zâtımdan perdelemem gerekir. Sıfatlar hem örten hem görünen — saklananın görünürken taşıdığı biçim."',en:'"I must veil you from My Essence through My Attributes. Attributes both conceal and appear — they are the form the hidden takes when becoming visible."',pt:'"Devo velar-vos da Minha Essência através dos Meus Atributos. Os Atributos tanto ocultam quanto aparecem — são a forma que o oculto assume ao tornar-se visível."'},
    src:'Fütûhât — c1k10 · c16k213',
    n:{tr:'En güçlü perde budur. Sıfatı gördüğümüzde Zât\'ı gördüğümüzü sanırız — oysa tam da bu yüzden Sıfat en büyük perdedir.',en:'This is the most powerful veil. When we see an Attribute, we think we see the Essence — yet for that very reason, Attribute is the greatest veil.',pt:'Este é o véu mais poderoso. Quando vemos um Atributo, pensamos que estamos a ver a Essência — mas é exatamente por isso que o Atributo é o maior véu.'}},

    src:'Fütûhât — 1. Bölüm (c1k3)',
    n:{tr:'"\'izzet perdesi\' üzerinde ebediyen kalır." (Esmâ — Ahad) Zât\'ın en gizli sıfatı zaten gizliliktir.',en:'"It remains for ever under the \'veil of majesty\'." (Names — Aḥad) The Essence\'s most hidden quality is hiddenness itself.',pt:'"Permanece para sempre sob o \'véu da majestade\'." (Nomes — Aḥad) A qualidade mais oculta da Essência é a própria ocultação.'}}
};

const IDS=['rE','rF','rS','rZ'];
const $=id=>document.getElementById(id);

let lang='tr', cur=null, t=0, touched=false;
// /sahne motor entegrasyonu
let motorBitti=false;
let tFrom=0, tTo=0;
function easeInOut(x){ return x<0.5 ? 2*x*x : 1 - Math.pow(-2*x+2,2)/2; }

// Her perde kendi payında incelir; Sıfatlar hiçbir zaman tam kalkmaz.
function veil(i){
  const start=i*0.30, span=0.44;
  const lift=Math.max(0,Math.min(1,(t-start)/span));
  const floor=[0,0.04,0.20][i];          // Sıfatlar bir tabanın altına inmez
  return floor+(1-floor)*(1-lift);
}

function render(){
  const oE=veil(0), oF=veil(1), oS=veil(2);
  $('vE').setAttribute('opacity',oE.toFixed(3));
  $('vF').setAttribute('opacity',oF.toFixed(3));
  $('vS').setAttribute('opacity',oS.toFixed(3));
  // perdeler inceldikçe ışık artar — ama çekirdeğin bulanıklığı sabittir
  $('core').setAttribute('opacity',(0.5+0.5*t).toFixed(3));
  // etiket kendi perdesiyle birlikte söner
  $('tE').setAttribute('opacity',(0.25+0.75*oE).toFixed(3));
  $('tF').setAttribute('opacity',(0.25+0.75*oF).toFixed(3));
  $('tS').setAttribute('opacity',(0.25+0.75*oS).toFixed(3));
  $('tZ').setAttribute('opacity',(0.30+0.28*t).toFixed(3));

  // v-tabanlı state metni yalnız keşif modunda (motor bittikten sonra)
  if(motorBitti){
    const d=L[lang];
    const step = t<0.22?0 : t<0.52?1 : t<0.84?2 : 3;
    $('state').textContent=d.st[step];
    $('state').classList.toggle('deep',step===3);
    if(t>0.97) $('aha').classList.add('show');
  } else {
    $('state').classList.toggle('deep', t>0.84);
  }
}

function setT(x){ t=Math.max(0,Math.min(1,x)); render(); }

const scene=$('scene');
let dragging=false,lastX=0,lastY=0;
function markTouched(){ if(!touched){touched=true;$('grabHint').classList.add('gone');} }
scene.addEventListener('pointerdown',e=>{
  if(!motorBitti) return; // motor konuşurken müdahale yok
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  try{scene.setPointerCapture(e.pointerId);}catch(_){}
  markTouched();e.preventDefault();
});
scene.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const r=scene.getBoundingClientRect();
  setT(t + ((e.clientX-lastX)-(e.clientY-lastY))/Math.max(1,r.width));
  lastX=e.clientX;lastY=e.clientY;
});
['pointerup','pointercancel','pointerleave'].forEach(k=>scene.addEventListener(k,()=>{dragging=false;}));
scene.addEventListener('keydown',e=>{
  if(!motorBitti) return; // motor konuşurken müdahale yok
  const k={ArrowRight:0.05,ArrowUp:0.05,ArrowLeft:-0.05,ArrowDown:-0.05}[e.key];
  if(k===undefined) return;
  markTouched();setT(t+k);e.preventDefault();
});

function renderChips(){
  const d=L[lang];
  $('chips').innerHTML=IDS.map(id=>
    `<button type="button" class="chip${cur===id?' on':''}" data-id="${id}">${d.rings[D[id].k]}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>{
    b.addEventListener('click',()=>{ cur===b.dataset.id?clr():show(b.dataset.id); });
  });
}

function show(id){
  cur=id;const d=D[id];
  $('qt').textContent=L[lang].rings[d.k];
  $('qx').textContent=d.q[lang];
  $('qs').textContent=d.src;
  $('qn').textContent=d.n[lang];
  $('qb').style.display='block';
  renderChips();
}

function clr(){
  cur=null;const d=L[lang];
  $('qt').textContent=d.dqt;
  $('qb').style.display='none';
  $('qn').textContent=d.dqn;
  renderChips();
}

function setLang(l){
  lang=l;const d=L[l];
  $('i-title').textContent=d.title;
  $('i-sub').textContent=d.sub;
  $('i-ql').textContent=d.ql;
  $('grabHint').textContent = motorBitti ? d.grab : "";
  $('aha').textContent=d.aha;
  $('kardesLink').textContent=d.kardes;
  $('tE').textContent=d.rings[0];
  $('tF').textContent=d.rings[1];
  $('tS').textContent=d.rings[2];
  $('tZ').textContent=d.rings[3];
  if(cur) show(cur); else clr();
  render();
}

setLang('tr');

// ── Motor entegrasyonu ──────────────────────────────────────────────────────
(function baslatMotor(){
  const base = (window.__dostRouteBase || "");
  const url = (base ? base + "/" : "") + "data/ibn-arabi/sahne-partisyonlari/perde-zinciri.json";
  fetch(url).then(function(r){ return r.json(); }).then(function(partisyon){
    if(!window.__sahneMotoru){ console.warn("sahne-motoru yüklenemedi"); return; }
    // İlk ölçünün hedef t değerine atla
    const ilk = partisyon.olcuLer[0];
    t = ilk.hedef_hal.t;
    tFrom = t; tTo = t;
    render();
    window.__sahneMotoru.yarat({
      container: scene,
      partisyon: partisyon,
      applyOlcu: function(olcu){
        tFrom = t;
        tTo = (olcu.hedef_hal && typeof olcu.hedef_hal.t === "number") ? olcu.hedef_hal.t : t;
        if(olcu.hedef_hal && olcu.hedef_hal.aha){ $('aha').classList.add('show'); }
      },
      frame: function(fraz, olcu){
        const e = easeInOut(fraz);
        t = tFrom + (tTo - tFrom) * e;
        render();
      },
      metinGoster: function(metin){
        if(!metin){ $('state').textContent = ""; return; }
        $('state').textContent = metin[lang] || metin.tr || "";
      },
      olcuGoster: function(idx, toplam){
        $('olcuGosterge').textContent = (idx+1) + " / " + toplam;
      },
      biterEl: $('motorBiter'),
      tepki: function(ev){
        if(ev.tip === "bitti"){
          motorBitti = true;
          document.body.classList.add('sahne-bitti');
          $('grabHint').textContent = L[lang].grab;
          const olcu = partisyon.olcuLer[partisyon.olcuLer.length - 1];
          if(olcu.hedef_hal && olcu.hedef_hal.aha) $('aha').classList.add('show');
        }
      },
    });
  }).catch(function(err){ console.warn("partisyon yüklenemedi", err); });
})();

window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
// 2026-08-06: bu sahne meditasyon.html içinde bir <iframe> olarak da gömülü
// (bkz. meditasyon.html'in kendi tab yapısı). Gömülüyken bu enjekte edilen
// pilli düğme iframe'in kendi köşesinde ikinci kez çiziliyor, ve
// meditasyon.html'in KENDİ başlık şeridinde zaten eşdeğer bir "Haritaya"
// bağlantısı olduğundan bu üst üste binen ikinci düğme gereksiz bir
// "kemer" gibi görünüyordu (kullanıcı bulgusu: "yukarda başka bir kemer
// daha görünüyor"). Yalnız üst pencerede (iframe DIŞINDA) çalış.
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "\u2190 " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
