<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Renkli Cam Analojisi — Dost Arabi. İbn Arabî'nin kendi kıyası
     (izutsu-anahtar 6994-7030): tek, tabiatı gereği renksiz bir ışık,
     camdan geçerken rengini alır GİBİ görünür. Duyu "yeşil" der, akıl
     "renksiz" der -- ikisi de haklı, çünkü ikisi de ışığa değil, camına
     bakıyor. sahne-cizim.js'in ortak imge ailesi burada TÜKETİLİYOR
     (kunye) -- bkz. scripts/varlik-denetimi.py BILINCLI_OKSUZLER notu. -->
<title>Renkli Cam Analojisi — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614;--cam:#6FA35A}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A;--cam:#4E7A3D}}
:root[data-theme=dark]{--bg:#0D0D0D;--su:#1A1A19;--bo:#2C2C2A;--tx:#EDE9E2;--mu:#898781;--go:#FFC233;--am:#C98500;--pa:#161614;--cam:#6FA35A}
:root[data-theme=light]{--bg:#F9F9F7;--su:#FCFCFB;--bo:#E1E0D9;--tx:#1A1A1A;--mu:#6F6D65;--pa:#FCFCFB;--go:#8A6100;--am:#8C6D1A;--cam:#4E7A3D}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1.1rem}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.07em;color:var(--go);margin-bottom:.45rem}
.sub{color:var(--mu);font-size:.88rem;font-style:italic;line-height:1.65;max-width:560px}
.sw{display:flex;flex-direction:column;align-items:center;width:100%;max-width:640px}

.stage-wrap{position:relative;width:min(640px,92vw);aspect-ratio:16/10;margin:.5rem auto 1rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#rcBeamPre,#rcBeamPost,#rcCam,#rcAkil,#rcDuyu{transition:opacity 1.7s ease}

.track-wrap{width:min(560px,92vw);margin:0 auto}
.track-labels{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--mu);margin-bottom:.5rem}
#slider{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;padding:0;margin:0;cursor:pointer;display:block}
#slider::-webkit-slider-runnable-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-moz-range-track{height:2px;background:var(--bo);border-radius:2px}
#slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--cam);border:2px solid var(--pa);margin-top:-10px;box-shadow:0 0 0 1px var(--am)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--cam);border:2px solid var(--pa);box-shadow:0 0 0 1px var(--am)}
#slider:focus{outline:none}
#slider:focus-visible::-webkit-slider-thumb,#slider:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--am)}

.caption-wrap{width:min(560px,92vw);margin:.75rem auto 0;text-align:center;opacity:0;transition:opacity 1s ease}
.caption-wrap.gorunur{opacity:1}
.caption{font-size:.88rem;line-height:1.75;color:var(--tx);min-height:3.2em}

.track-wrap,.hint{opacity:0;max-height:0;overflow:hidden;transition:opacity .5s ease}
body.sahne-bitti .track-wrap,body.sahne-bitti .hint{opacity:1;max-height:80px}
.hint{position:absolute;top:12px;right:16px;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

.motor-kontroller{display:flex;gap:.6rem;align-items:center;justify-content:center;margin-top:.5rem;min-height:30px}
.olcu-gosterge{font-size:.68rem;color:var(--mu);letter-spacing:.13em;opacity:0;transition:opacity .4s ease}
body.sahne-bitti .olcu-gosterge{opacity:.7}
button.sahne-motoru-tekrar{background:transparent;border:1px solid var(--bo);color:var(--mu);border-radius:2rem;padding:.28rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
button.sahne-motoru-tekrar:hover,button.sahne-motoru-tekrar:focus-visible{border-color:var(--am);color:var(--tx)}

/* "Birlikte" durağında ikisinin de aynı ışığın yüzü olduğunu göstermek
   için TEK bir paylaşılan nefes -- ayrı ayrı değil, aynı ritimde. */
@media(prefers-reduced-motion:no-preference){
  .rc-nefes #rcBeamPre,.rc-nefes #rcBeamPost{animation:rcNefes 6s ease-in-out infinite}
  .rc-nefes #rcAkil,.rc-nefes #rcDuyu{animation:rcEtiketNefes 6s ease-in-out infinite}
}
@keyframes rcNefes{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes rcEtiketNefes{0%,100%{opacity:1}50%{opacity:.78}}

.sahne-kunye{width:min(560px,92vw);margin-top:1.2rem;background:var(--pa);border:1px solid var(--bo);border-radius:12px;padding:.85rem 1rem;font-size:.82rem;line-height:1.75}
.sahne-kunye summary{cursor:pointer;color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em}
.sahne-kunye ul{list-style:none;margin-top:.7rem}.sahne-kunye li{margin-bottom:.65rem}
.sahne-kunye li.sahne-kunye__dost span{font-style:italic}
.sahne-kunye li.sahne-kunye__okuma span{color:var(--mu)}
.sahne-kunye li.sahne-kunye__serh{color:var(--mu);font-size:.76rem}
.sahne-kunye a{color:var(--am);text-decoration:none;border-bottom:1px solid var(--bo);white-space:nowrap}
.sahne-metni{margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--bo);font-size:.78rem;line-height:1.7;color:var(--mu);list-style:decimal inside}
.sahne-metni li{margin-bottom:.4rem}

.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;font-family:inherit;text-decoration:none;opacity:.72;border:1px solid var(--bo);background:var(--su);color:var(--mu)}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;color:var(--tx);border-color:var(--go)}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}
</style>
<script src="assets/sahne-tema.js"></script>
</head>
<body>
<header>
  <h1 id="i-title">Renkli Cam Analojisi</h1>
  <p class="sub" id="i-sub">Tek, tabiatı gereği renksiz bir ışık, camdan geçerken rengini alır GİBİ görünür — İbn Arabî'nin kendi kıyası</p>
</header>

<div class="sw">
  <div class="stage-wrap">
    <svg id="scene" viewBox="0 0 1600 1000" role="group" aria-label="Kendi kendini anlatan sahne: renksiz bir ışık camdan geçiyor, duyu yeşil görüyor, akıl renksiz diyor, ikisi de haklı">
      <defs>
        <linearGradient id="rcPreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--tx)" stop-opacity="0"/>
          <stop offset="55%" stop-color="var(--tx)" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="var(--tx)" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="rcPostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="var(--cam)" stop-opacity="0.95"/>
          <stop offset="70%" stop-color="var(--cam)" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="var(--cam)" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <g id="rcBeamPre" opacity="0">
        <rect x="60" y="462" width="720" height="76" rx="10" fill="url(#rcPreGrad)"></rect>
      </g>

      <rect id="rcCam" x="780" y="200" width="42" height="600" fill="var(--cam)" opacity="0"></rect>

      <g id="rcBeamPost" opacity="0">
        <rect x="822" y="462" width="720" height="76" rx="10" fill="url(#rcPostGrad)"></rect>
      </g>

      <g id="rcAkil" opacity="0">
        <text x="420" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="var(--tx)" id="rcAkilTitle">akıl</text>
        <text x="420" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="var(--mu)" id="rcAkilAlt">“renksiz”</text>
      </g>
      <g id="rcDuyu" opacity="0">
        <text x="1180" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="var(--cam)" id="rcDuyuTitle">duyu</text>
        <text x="1180" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="var(--mu)" id="rcDuyuAlt">“yeşil”</text>
      </g>
    </svg>
    <div class="hint" id="hint"><span id="hintText"></span></div>
  </div>

  <div class="track-wrap">
    <div class="track-labels">
      <span id="lblClear"></span>
      <span id="lblTinted"></span>
    </div>
    <input id="slider" type="range" min="0" max="100" value="70" aria-label="Camın rengi ne kadar baskın">
  </div>
  <div class="motor-kontroller"><span class="olcu-gosterge" id="olcuGosterge"></span><span id="motorBiter"></span></div>
  <div class="caption-wrap" id="captionWrap">
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <div id="kunyeYuvasi"></div>
</div>

<script src="assets/i18n.js"></script>
<script src="assets/sahne-motoru.js"></script>
<script src="assets/sahne-cizim.js"></script>
<script>
const L={
  tr:{
    title:'Renkli Cam Analojisi',
    sub:'Tek, tabiatı gereği renksiz bir ışık, camdan geçerken rengini alır GİBİ görünür — İbn Arabî’nin kendi kıyası',
    hint:'Sahne durdu — camın rengini artık sen ayarla', clear:'Renksiz', tinted:'Yeşil',
    sliderLabel:'Camın rengi ne kadar baskın',
    kunyeBaslik:'Künye — bu sahne nereden geliyor?',
    akilTitle:'akıl', akilAlt:'“renksiz”', duyuTitle:'duyu', duyuAlt:'“yeşil”',
  },
  en:{
    title:'The Tinted-Glass Analogy',
    sub:'A single light, colorless by its own nature, seems to take on a color as it passes through glass — Ibn Arabi’s own analogy',
    hint:'The scene has settled — now tune the glass’s tint yourself', clear:'Colorless', tinted:'Green',
    sliderLabel:'How dominant the glass’s tint is',
    kunyeBaslik:'Sources — where this scene comes from',
    akilTitle:'reason', akilAlt:'“colorless”', duyuTitle:'the senses', duyuAlt:'“green”',
  },
  pt:{
    title:'A Analogia do Vidro Colorido',
    sub:'Uma única luz, incolor pela sua própria natureza, parece adquirir uma cor ao passar pelo vidro — a própria analogia de Ibn Arabi',
    hint:'A cena parou — agora ajuste você mesmo a tonalidade do vidro', clear:'Incolor', tinted:'Verde',
    sliderLabel:'Quão dominante é a tonalidade do vidro',
    kunyeBaslik:'Fontes — de onde vem esta cena',
    akilTitle:'a razão', akilAlt:'“incolor”', duyuTitle:'os sentidos', duyuAlt:'“verde”',
  }
};

const KUNYE=[
  {tur:'dost',metin:{
    tr:'“Eğer sen nûrun, camın yeşilliğinden dolayı yeşil olduğunu söylersen haklısın. Buna şehâdet eden senin hissî idrâkindir. Fakat eğer nûrun yeşil olmadığını, gerçekte renksiz olduğunu söylersen, gene de haklısın.” — İbn Arabî’nin kendi kıyası (İzutsu, Anahtar Kavramlar, s. 6994-7030’de aktarıyor).',
    en:'“If you say the light is green because of the glass’s greenness, you are right — your own sense-perception attests to it. But if you say the light is not green, that in truth it is colorless, you are right too.” — Ibn Arabi’s own analogy (relayed in Izutsu, Key Philosophical Concepts, 6994-7030).',
    pt:'“Se disseres que a luz é verde por causa da verdura do vidro, tens razão — a tua própria percepção sensorial testemunha-o. Mas se disseres que a luz não é verde, que na verdade é incolor, também tens razão.” — a própria analogia de Ibn Arabi (transmitida em Izutsu, Conceitos-Chave, 6994-7030).',
  }},
  {tur:'okuma',metin:{
    tr:'Bu sahne kıyası kelimesi kelimesine izliyor: duyu da akıl da haklı, çünkü ikisi de ışığın kendisine değil, içinden geçtiği cama bakıyor.',
    en:'This scene follows the analogy word for word: the senses and reason are both right, because neither looks at the light itself — both look at the glass it passes through.',
    pt:'Esta cena segue a analogia à letra: os sentidos e a razão têm ambos razão, porque nenhum olha para a luz em si — ambos olham para o vidro por onde ela passa.',
  },kaynak:{href:'kavram/terimler/tenzih-tesbih/',etiket:'Terim: Tenzih–Teşbih'}},
  {tur:'serh',metin:{
    tr:'Alıntı İzutsu’nun kendi eserinden -- Kâşânî’nin Fusûs şerhinden aktardığı bir pasaj; kendi okumamız değil, ikincil bir kaynak üzerinden geliyor.',
    en:'The quote comes from Izutsu’s own book -- a passage he relays from Kashani’s commentary on the Fusus; not our own direct reading, but arriving through a secondary source.',
    pt:'A citação vem do próprio livro de Izutsu -- uma passagem que ele transmite do comentário de Kashani aos Fusus; não é a nossa própria leitura direta, mas chega através de uma fonte secundária.',
  }},
];

const $=id=>document.getElementById(id);
let lang='tr';

const kunye=window.DostSahneCizim.kunye($('kunyeYuvasi'), KUNYE, {tr:L.tr.kunyeBaslik,en:L.en.kunyeBaslik,pt:L.pt.kunyeBaslik});

function setLang(l){
  if(!L[l]) return;
  lang=l;
  const d=L[l];
  $('i-title').textContent=d.title;
  $('i-sub').textContent=d.sub;
  $('hintText').textContent=d.hint;
  $('lblClear').textContent=d.clear;
  $('lblTinted').textContent=d.tinted;
  $('rcAkilTitle').textContent=d.akilTitle;
  $('rcAkilAlt').textContent=d.akilAlt;
  $('rcDuyuTitle').textContent=d.duyuTitle;
  $('rcDuyuAlt').textContent=d.duyuAlt;
  if(sonMetin) $('caption').textContent=sonMetin[lang]||sonMetin.tr;
  $('slider').setAttribute('aria-label', d.sliderLabel);
  kunye.guncelle(l);
  sahneMetniniGuncelle();
}
let sonMetin=null;

// ── Ölçü hedef_hal'leri kümülatiftir (bkz. hayret.html/kandil.html deseni,
// artık yalnız bu sahnede yaşıyor) ─────────────────────────────────────────
const rcBeamPre=$('rcBeamPre'), rcBeamPost=$('rcBeamPost'), rcCam=$('rcCam'), rcAkil=$('rcAkil'), rcDuyu=$('rcDuyu');
const stageWrap=document.querySelector('.stage-wrap');
let sonHal={};
function uygulaHal(hamHal){
  sonHal=Object.assign({}, sonHal, hamHal);
  const hal=sonHal;
  rcBeamPre.setAttribute('opacity', String(hal.isikGelis!==undefined?hal.isikGelis:0));
  rcCam.setAttribute('opacity', ((hal.camOpaklik!==undefined?hal.camOpaklik:0)*0.55).toFixed(3));
  rcBeamPost.setAttribute('opacity', String(hal.isikSonra!==undefined?hal.isikSonra:0));
  rcAkil.setAttribute('opacity', String(hal.akilEtiket!==undefined?hal.akilEtiket:0));
  rcDuyu.setAttribute('opacity', String(hal.duyuEtiket!==undefined?hal.duyuEtiket:0));
  stageWrap.classList.toggle('rc-nefes', !!hal.birlikte);
}

let sahneMetniEl=null, partisyonRef=null;
function sahneMetniniKur(){
  if(sahneMetniEl||!partisyonRef) return;
  sahneMetniEl=document.createElement('ol');
  sahneMetniEl.className='sahne-metni';
  kunye.el.appendChild(sahneMetniEl);
  sahneMetniniGuncelle();
}
function sahneMetniniGuncelle(){
  if(!sahneMetniEl||!partisyonRef) return;
  sahneMetniEl.innerHTML='';
  partisyonRef.olcuLer.forEach(function(o){
    if(!o.metin) return;
    const li=document.createElement('li');
    li.textContent=o.metin[lang]||o.metin.tr;
    sahneMetniEl.appendChild(li);
  });
}

function metinYaz(m){
  sonMetin=m;
  const t=m?(m[lang]||m.tr||''):'';
  $('captionWrap').classList.remove('gorunur');
  window.setTimeout(function(){
    $('caption').textContent=t;
    if(t) $('captionWrap').classList.add('gorunur');
  }, t?150:0);
}

// ── Kendim gezineyim: camın ne kadar "baskın" göründüğünü kaydırıcıyla
// kendin ayarla -- ışık hiç değişmiyor, yalnız camın rengi ve dolayısıyla
// duyunun/aklın hangi okumaya ne kadar ağırlık verdiği değişiyor. ─────────
function applySlider(v){
  const t=v/100;
  rcCam.setAttribute('opacity', (0.15+t*0.75).toFixed(3));
  rcBeamPost.style.setProperty('--postOpac', t.toFixed(3));
  rcBeamPost.setAttribute('opacity', Math.max(0.25, t).toFixed(3));
  rcBeamPre.setAttribute('opacity', Math.max(0.35, 1-t*0.5).toFixed(3));
}
$('slider').addEventListener('input', e=>{
  if(!document.body.classList.contains('sahne-bitti')) return;
  applySlider(+e.target.value);
  $('hint').style.opacity='';
});

let motorAPI=null, reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
(function(){
  const base=(window.__dostRouteBase||'');
  fetch((base?base+'/':'')+'data/ibn-arabi/sahne-partisyonlari/renkli-cam-analojisi.json').then(function(r){ return r.json(); }).then(function(p){
    partisyonRef=p;
    sahneMetniniKur();
    motorAPI=window.__sahneMotoru.yarat({
      container:stageWrap, partisyon:p,
      applyOlcu:function(o){ uygulaHal(o.hedef_hal||{}); },
      metinGoster:metinYaz,
      olcuGoster:function(i,t){ $('olcuGosterge').textContent=(i+1)+' / '+t; },
      biterEl:$('motorBiter'),
      tepki:function(ev){
        if(ev.tip==='bitti'){
          document.body.classList.add('sahne-bitti');
        }
      },
    });
  });
})();

stageWrap.setAttribute('tabindex','0');
stageWrap.addEventListener('keydown', function(e){
  if(!motorAPI) return;
  if(e.key===' '){ e.preventDefault(); if(motorAPI.durum==='oynuyor') motorAPI.pause(); else if(motorAPI.durum==='durakli') motorAPI.resume(); return; }
  const y={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
  if(y===undefined) return;
  e.preventDefault();
  motorAPI.gotoOlcu(Math.max(0, Math.min(motorAPI.olcuSayisi-1, motorAPI.aktifIdx+y)));
});

setLang('tr');
window.addEventListener('message',function(e){
  if(e.data && e.data.type==='setLang') setLang(e.data.lang);
});
</script>

<script>
if (window.self === window.top) (function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr"; try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}
  var a = document.createElement("a"); a.className = "sahne-geri"; a.href = "sahneler/";
  a.textContent = "← " + ETIKET[dil]; document.body.appendChild(a);
  function geriGit(){try{if(document.referrer&&history.length>1&&new URL(document.referrer).origin===location.origin){history.back();return;}}catch(e){} location.href="sahneler/";}
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return; var el=document.activeElement;
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault(); geriGit();
  });
})();
</script>
<link rel="stylesheet" href="assets/edit-mode-sahne.css">
<script src="assets/edit-mode.js" defer></script>
</body>
</html>
