<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- Tercümânü'l-Eşvâk — Dost Arabi görselleştirme (docs/icerik-yol-haritasi.md D15) -->
<title>Kendi Şiirini Savunmak — Dost Arabi</title>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--gold:#FFC233;--liminal:#C98500;--panel:#161614}
@media(prefers-color-scheme:light){:root{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}}
:root[data-theme=dark]{--bg:#0D0D0D;--surface:#1A1A19;--border:#2C2C2A;--text:#EDE9E2;--muted:#898781;--panel:#161614;--gold:#FFC233;--liminal:#C98500}
:root[data-theme=light]{--bg:#F9F9F7;--surface:#FCFCFB;--border:#E1E0D9;--text:#1A1A1A;--muted:#6F6D65;--panel:#FCFCFB;--gold:#8A6100;--liminal:#8C6D1A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;padding:1.6rem 1rem 3rem;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:1rem;max-width:640px}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:400;letter-spacing:.05em;color:var(--gold);margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.87rem;font-style:italic;line-height:1.65}

.stage-wrap{position:relative;width:min(640px,94vw);aspect-ratio:16/9;margin:.6rem auto 0}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#hit{cursor:grab}
#hit:focus-visible{outline:2px solid var(--liminal);outline-offset:-3px}
.hint{position:absolute;top:10px;right:12px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);animation:hintPulse 3s ease-in-out 1.5s 3;pointer-events:none}
@keyframes hintPulse{0%,100%{opacity:.55}50%{opacity:1}}

.okuma{width:min(560px,96vw);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;min-height:7.2rem;margin-top:.6rem}
.okuma-kim{font-size:.71rem;text-transform:uppercase;letter-spacing:.12em;color:var(--liminal);margin-bottom:.5rem}
.okuma-metin{font-size:.87rem;line-height:1.75;transition:opacity .3s ease}

.sayac{width:min(560px,96vw);text-align:center;font-size:.78rem;color:var(--muted);margin-top:.9rem;letter-spacing:.03em}
.sayac b{color:var(--gold);font-weight:400}

.aha{width:min(560px,96vw);text-align:center;font-size:.86rem;font-style:italic;line-height:1.75;color:var(--liminal);margin-top:1rem;opacity:0;transform:translateY(6px);transition:opacity 1s ease,transform 1s ease;white-space:pre-line}
.aha.show{opacity:1;transform:none}

.kardes{width:min(560px,96vw);text-align:center;margin-top:1.1rem;font-size:.75rem;line-height:1.6}
.kardes a{color:var(--liminal);text-decoration:none;border-bottom:1px solid var(--border)}
.kardes a:hover,.kardes a:focus-visible{border-bottom-color:var(--liminal)}

.yontem{width:min(560px,96vw);margin-top:1.4rem;font-size:.74rem;line-height:1.7;color:var(--muted);text-align:center}

/* Sahneden çıkış (2026-08-05). ESC klavyede; ama hata TABLETTE bildirildi
   ve tablette ESC tuşu yok -- o yüzden görünür, dokunulabilir bir bağlantı
   da var. Renkler zincirleme var() yedekleriyle: sahnelerin değişken adları
   tek tip değil (--border/--bo, --text/--tx ...). */
.sahne-geri{position:fixed;top:12px;left:12px;z-index:60;display:inline-flex;align-items:center;
  gap:.35rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-size:.82rem;
  font-family:inherit;text-decoration:none;opacity:.72;
  border:1px solid var(--border,var(--bo,currentColor));
  background:var(--surface,var(--su,transparent));
  color:var(--muted,var(--mu,inherit));
  transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.sahne-geri:hover,.sahne-geri:focus-visible{opacity:1;
  color:var(--text,var(--tx,inherit));
  border-color:var(--gold,var(--go,currentColor))}
.sahne-geri:focus-visible{outline:2px solid var(--gold,var(--go,currentColor));outline-offset:2px}
@media(max-width:520px){.sahne-geri{top:8px;left:8px;padding:0 .7rem}}

/* ETKILESIM_DILI.md: hareket "atlanır, taklit edilmez". Kardeş sahneler
   (berzah, nefes-i-rahmani...) bu kuralı baştan taşıyordu; bu sayfada
   unutulmuştu -- 2026-08-05 çapraz denetiminde yedi sayfada birden
   yakalandı. Süreleri sıfırlamak animasyonun SON karesini gösterir:
   içerik kaybolmaz, yalnız hareket kalkar. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
<script>
// Sitenin tema seçimini miras al. Bu sayfaların CSS'inde ":root[data-theme=
// light/dark]" kuralları en baştan vardı ama data-theme'i KİMSE yazmıyordu --
// yani o kurallar ölü kod, sahne yalnız işletim sisteminin
// prefers-color-scheme'ini izliyordu. Sonuç: kullanıcı siteyi ☰'den gündüz
// moduna alsa bile, cihazı gece modundaysa sahne gece modunda açılıyordu
// (2026-08-05 tablette bildirildi).
//
// Depoda bir şey YOKSA öznitelik bilerek yazılmaz: o zaman
// @media(prefers-color-scheme) devreye girer -- doğru varsayılan odur.
// <head> içinde ve senkron: ilk boyamadan önce çalışsın, tema sıçraması olmasın.
(function () {
  try {
    var s = localStorage.getItem("dost-theme");
    if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 id="hTitle">Kendi Şiirini Savunmak</h1>
  <p class="sub" id="hSub"></p>
</header>

<div class="stage-wrap">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bir kaside, ışığın konumuna göre iki okuma arasında">
    <defs>
      <radialGradient id="backGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--gold)" stop-opacity="0.9"></stop>
        <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"></stop>
      </radialGradient>
      <filter id="blurFilter">
        <feGaussianBlur stdDeviation="14"></feGaussianBlur>
      </filter>
    </defs>

    <!-- Arkadan gelen ışık (harflerin arkasında). Opaklık kaydırıcıyla sürülüyor. -->
    <ellipse id="backlight" cx="800" cy="320" rx="650" ry="330" fill="url(#backGrad)" opacity="0"></ellipse>

    <!-- Önden düşen gölge (harflerin altında/sağında). Opaklık kaydırıcıyla sürülüyor. -->
    <g id="shadow" style="filter:url(#blurFilter);opacity:0">
      <text id="verseShadow" text-anchor="middle" font-family="Georgia,'Iowan Old Style',serif" font-size="30" letter-spacing=".5" fill="var(--text)" opacity="0.55"></text>
    </g>

    <!-- Kasidenin kendisi — hiç değişmiyor, hiç kaymıyor. -->
    <text id="verse" text-anchor="middle" font-family="Georgia,'Iowan Old Style',serif" font-size="30" letter-spacing=".5" fill="var(--text)"></text>

    <!-- İki konumun etiketleri -->
    <text id="lblWorldly" x="200" y="820" text-anchor="start" font-family="Georgia,serif" font-size="14" letter-spacing="2" fill="var(--muted)"></text>
    <text id="lblDivine" x="1400" y="820" text-anchor="end" font-family="Georgia,serif" font-size="14" letter-spacing="2" fill="var(--muted)"></text>

    <rect id="hit" x="0" y="0" width="1600" height="900" fill="transparent" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></rect>
  </svg>

  <div class="hint" id="hint"><span id="hintText"></span></div>
</div>

<div class="okuma">
  <p class="okuma-kim" id="okumaKim"></p>
  <p class="okuma-metin" id="okumaMetin"></p>
</div>

<p class="sayac" id="sayac"></p>

<p class="aha" id="aha"></p>

<p class="kardes"><a id="kardesLink" href="ilah-i-mutekad.html"></a></p>

<p class="yontem" id="yontem"></p>

<script>
// ── Metin ────────────────────────────────────────────────────────────────────
// ÖNEMLİ: Dost'un kendi şerhi (Zehâirü'l-a'lâk) elimizde YOK. Aşağıdaki iki
// "okuma", tarihsel olarak belgelenmiş iki POZİSYONUN bizim özetimizdir --
// şerhten alıntı DEĞİLDİR. Bu ayrım sayfanın .yontem notunda da yazılı.
// (.claude/skills/siir-okuma/SKILL.md: şiiri şerh etmek bu sitenin kapsamı
// dışında; burada yapılan şerh değil, bir tartışmanın iki tarafını aktarmak.)
//
// Sahne motoru: ışık dizenin önünden mi (gölge, dünyevî/zahirî okuma) yoksa
// arkasından mı (parıltı, ilahî/bâtınî okuma) geldiğine göre aynı harfler
// iki ayrı okumaya açılıyor -- harfler kendisi hiç değişmeden.
const LA={
  tr:{
    title:'Kendi Şiirini Savunmak',
    sub:'Dost Mekke’de Nizâm adlı genç kadın için bir aşk şiirleri divanı yazdı. “Bu ilahî değil, dünyevî aşk” dendi. O da kendi şiirine kendi şerhini yazdı. Aşağıdaki kaside o divandan. Sürükleyerek ışığın önden mi arkadan mı geldiğini değiştir — iki okuma arasında gezin.',
    lblWorldly:'Eleştirinin okuması',
    lblDivine:'Dost’un savunması',
    hint:'Sürükle (ok tuşları da çalışır)',
    kimSol:'Eleştiri',
    kimSag:'Dost’un cevabı',
    okumaSol:'Bu satırlar bir kadına yazılmış dünyevî bir aşk şiiridir: ceylan, çayır, manastır, develer — hepsi klasik Arap aşk şiirinin kendi sözlüğü. Bir sûfîden beklenen dil bu değildir; şairin “dinim aşkın gittiği yoldur” demesi de bu yüzden fazla ileri gider.',
    okumaSag:'Dost, divana sonradan eklediği şerhte bu dilin zahirî olduğunu, her imgenin bâtınında ilahi güzelliğin bir tecellîsine işaret ettiğini söyler: kalbin “her sûreti kabul eder” hâle gelmesi, sûretlerin hepsini reddetmek değil, her birinde O’nu görebilmektir.',
    sayac:(n)=>`Sürüklerken şiirde değişen harf sayısı: <b>${n}</b>`,
    aha:'İki taraf da tam olarak aynı kelimeleri gösterdi.\nŞiirde tek bir harf değişmedi — değişen, ona bakan oldu.',
    kardes:'Kardeş sahne: İnandığın Tanrı — cevapların bir sûret çizer →',
    yontem:'Şiir, sitenin şiir kataloğundan geliyor (Nicholson’ın 1911 İngilizce çevirisinden aktarıldı; Arapça’dan doğrudan Türkçe çevirimiz yok). Dost’un kendi şerhinin metni elimizde YOK: yukarıdaki iki okuma, belgelenmiş iki pozisyonun bizim özetimizdir, şerhten alıntı değildir. Divanın 61 kasidesinden yalnız bu biri kataloğumuzda.',
  },
  en:{
    title:'Defending His Own Poem',
    sub:'In Mecca, Dost wrote a collection of love poems for a young woman named Nizam. “This is worldly love, not divine,” it was said. So he wrote his own commentary on his own poem. The ode below is from that collection. Drag to move the light from in front of the lines to behind them — and move between the two readings.',
    lblWorldly:'The critics’ reading',
    lblDivine:'Dost’s defence',
    hint:'Drag (arrow keys work too)',
    kimSol:'The criticism',
    kimSag:'Dost’s reply',
    okumaSol:'These lines are a worldly love poem written for a woman: gazelles, pasture, cloister, camels — all the standard vocabulary of classical Arabic love poetry. This is not the language expected of a Sufi; and the poet’s “my religion is whatever way Love takes” goes further still.',
    okumaSag:'In the commentary he later added, Dost says this language is the outward face, and that each image points inwardly to a self-disclosure of divine beauty: a heart becoming “capable of every form” is not the rejection of all forms but the capacity to see the One in each of them.',
    sayac:(n)=>`Letters changed in the poem while dragging: <b>${n}</b>`,
    aha:'Both sides pointed at exactly the same words.\nNot one letter of the poem changed — what changed was the one looking at it.',
    kardes:'Sibling scene: The God You Believe In — your answers draw a form →',
    yontem:'The poem comes from the site’s poem catalogue (rendered from R. A. Nicholson’s 1911 English translation). We do NOT have the text of Dost’s own commentary: the two readings above are our summaries of two documented positions, not quotations from it. Of the collection’s 61 odes, only this one is in our catalogue.',
  },
  pt:{
    title:'Defender o Próprio Poema',
    sub:'Em Meca, Dost escreveu uma coleção de poemas de amor para uma jovem chamada Nizam. “Isto é amor mundano, não divino”, disseram. Então ele escreveu o seu próprio comentário ao seu próprio poema. A ode abaixo é dessa coleção. Arraste para mover a luz de diante das linhas para trás delas — e passe entre as duas leituras.',
    lblWorldly:'A leitura dos críticos',
    lblDivine:'A defesa de Dost',
    hint:'Arraste (as setas também funcionam)',
    kimSol:'A crítica',
    kimSag:'A resposta de Dost',
    okumaSol:'Estes versos são um poema de amor mundano escrito para uma mulher: gazelas, pasto, convento, camelos — todo o vocabulário da poesia amorosa árabe clássica. Não é a linguagem que se espera de um sufi; e o “minha religião é o caminho que o Amor tomar” vai ainda mais longe.',
    okumaSag:'No comentário que acrescentou depois, Dost diz que esta linguagem é a face exterior, e que cada imagem aponta interiormente para uma autorrevelação da beleza divina: um coração que se torna “capaz de toda forma” não rejeita as formas, mas ganha a capacidade de ver o Uno em cada uma delas.',
    sayac:(n)=>`Letras alteradas no poema ao arrastar: <b>${n}</b>`,
    aha:'Ambos os lados apontaram exatamente para as mesmas palavras.\nNem uma letra do poema mudou — o que mudou foi quem olhava.',
    kardes:'Cena irmã: O Deus em Que Você Crê — suas respostas desenham uma forma →',
    yontem:'O poema vem do catálogo de poemas do site (a partir da tradução inglesa de R. A. Nicholson, 1911). NÃO temos o texto do comentário do próprio Dost: as duas leituras acima são os nossos resumos de duas posições documentadas, não citações dele. Das 61 odes da coleção, apenas esta está no nosso catálogo.',
  },
};

// Kasidede "sûret" sayılan satırlar: kalbin kabul ettiği biçimlerin
// sayıldığı altı satır. Tartışmanın döndüğü yer tam olarak bunlar --
// bu yüzden vurgulanan onlar. (Üç dilde de aynı satır sıraları.)
const SURET_SATIRLARI=[3,4,5,6,7,8];
const VERSE_START_Y=110, VERSE_DY=46;
const SVGNS='http://www.w3.org/2000/svg';

let curLang='tr', t=0.5, siirVeri=null, referansMetin=null;
const $=id=>document.getElementById(id);
const clamp01=x=>Math.max(0,Math.min(1,x));
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function clearChildren(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function svgTspan(x,y,text){
  const el=document.createElementNS(SVGNS,'tspan');
  el.setAttribute('x',x); el.setAttribute('y',y); el.textContent=text;
  return el;
}

// Şiir metni siteyle tek kaynaktan gelsin diye kataloğun kendisinden
// okunuyor (gömülü bir kopya zamanla veriden ayrı düşerdi).
fetch('data/ibn-arabi/siirler.json')
  .then(r=>r.json())
  .then(d=>{
    siirVeri=(d.siirler||[]).find(s=>s.id==='te-kalp')||null;
    renderAll();
  })
  .catch(()=>{ renderAll(); });

function siirCiz(){
  const verseEl=$('verse'), shadowEl=$('verseShadow');
  clearChildren(verseEl); clearChildren(shadowEl);
  if(!siirVeri) return;
  const satirlar=(siirVeri.metin[curLang]||siirVeri.metin.tr||'').split('\n');
  satirlar.forEach((s,i)=>{
    const y=VERSE_START_Y+i*VERSE_DY;
    const main=svgTspan(800,y,s);
    if(SURET_SATIRLARI.includes(i)) main.classList.add('satir--suret');
    verseEl.appendChild(main);
    shadowEl.appendChild(svgTspan(800,y,s));
  });
  // Referans: şiirin o anki düz metni. Sürükledikçe bununla karşılaştırıp
  // "kaç harf değişti" sayısını GERÇEKTEN ölçüyoruz -- iddiayı yazmıyoruz,
  // sahnenin kendisi kanıtlıyor.
  referansMetin=verseEl.textContent;
}

let gordu={sol:false, sag:false};

// t=0 → ışık önden (gölge güçlü, arka ışık kapalı, zahirî/dünyevî okuma)
// t=1 → ışık arkadan (arka ışık güçlü, gölge kapalı, bâtınî/ilahî okuma)
// t=0.5 → ikisi birden, eşit ağırlıkta
function render(){
  if(!siirVeri) return;
  const d=LA[curLang];
  const front=Math.max(0,1-t);
  const back=Math.max(0,t);
  $('shadow').style.opacity=Math.min(1,front*1.4).toFixed(3);
  $('backlight').setAttribute('opacity', Math.min(0.85, back*0.95).toFixed(3));
  // Gölgenin kayması önden gelen ışığın gücüyle birlikte artıyor (güneş açısı gibi).
  const off=(4+front*10).toFixed(1);
  $('shadow').setAttribute('transform', `translate(${off},${off})`);

  // Sûret satırları: iki uçta da görünür kalıyor, ortada -- yani hiçbir
  // tarafı seçmemişken -- en sönük hâlde. Metnin KENDİSİ hiç değişmiyor.
  const uc=Math.abs(t-0.5)*2;
  document.querySelectorAll('#verse .satir--suret').forEach(el=>{
    el.style.fill = `color-mix(in srgb, var(--gold) ${(28+52*uc).toFixed(0)}%, var(--text))`;
  });

  $('okumaKim').textContent = t<0.5 ? d.kimSol : d.kimSag;
  $('okumaMetin').textContent = t<0.5 ? d.okumaSol : d.okumaSag;
  $('okumaMetin').style.opacity = (0.55+0.45*uc).toFixed(2);

  // Ölçüm: şiirin düz metni referanstan kaç karakter farklı?
  const simdi=$('verse').textContent;
  let fark=0;
  if(referansMetin!==null){
    const n=Math.max(simdi.length, referansMetin.length);
    for(let i=0;i<n;i++) if(simdi[i]!==referansMetin[i]) fark++;
  }
  $('sayac').innerHTML=d.sayac(fark);

  const hit=$('hit');
  hit.setAttribute('aria-valuenow', Math.round(t*100));
  hit.setAttribute('aria-valuetext', t<0.5 ? d.lblWorldly : d.lblDivine);

  // Hayret önce: aha ancak kullanıcı İKİ ucu da gördükten sonra.
  if(t<=0.08) gordu.sol=true;
  if(t>=0.92) gordu.sag=true;
  if(gordu.sol && gordu.sag) $('aha').classList.add('show');
}

function renderAll(){
  const d=LA[curLang];
  $('hTitle').textContent=d.title;
  $('hSub').textContent=d.sub;
  $('lblWorldly').textContent=d.lblWorldly;
  $('lblDivine').textContent=d.lblDivine;
  $('hintText').textContent=d.hint;
  $('aha').textContent=d.aha;
  $('kardesLink').textContent=d.kardes;
  $('yontem').textContent=d.yontem;
  $('hit').setAttribute('aria-label', d.hint);
  siirCiz();
  render();
}
function setLang(l){ if(LA[l]){ curLang=l; document.documentElement.lang=l; renderAll(); } }

// ── Sürükleme: diyagramın kendi üstünde, ışığı doğrudan taşıyarak ──────────
const hit=$('hit');
const hint=$('hint');
const svgEl=hit.ownerSVGElement;
function toSvg(cx,cy){
  const pt=svgEl.createSVGPoint(); pt.x=cx; pt.y=cy;
  const m=svgEl.getScreenCTM(); if(!m) return {x:0};
  return pt.matrixTransform(m.inverse());
}
let dragging=false;
function stopIntro(){ hint.style.animation='none'; }
function posFromClient(cx){
  const p=toSvg(cx,0);
  t=clamp01((p.x-200)/1200);
}
function onDown(e){
  dragging=true; hit.style.cursor='grabbing'; stopIntro();
  const ev=e.touches?e.touches[0]:e;
  posFromClient(ev.clientX);
  render();
  e.preventDefault();
}
function onMove(e){
  if(!dragging) return;
  const ev=e.touches?e.touches[0]:e;
  posFromClient(ev.clientX);
  render();
}
function onUp(){ dragging=false; hit.style.cursor='grab'; }
hit.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
hit.addEventListener('touchstart', onDown, { passive:false });
window.addEventListener('touchmove', onMove, { passive:false });
window.addEventListener('touchend', onUp);
hit.addEventListener('keydown', e=>{
  let handled=true;
  if(e.key==='ArrowLeft'||e.key==='ArrowDown') t=Math.max(0, t-0.05);
  else if(e.key==='ArrowRight'||e.key==='ArrowUp') t=Math.min(1, t+0.05);
  else if(e.key==='Home') t=0;
  else if(e.key==='End') t=1;
  else handled=false;
  if(handled){ stopIntro(); render(); e.preventDefault(); }
});

if(reduceMotion){
  hint.style.animation='none';
}

renderAll();

window.addEventListener('message',function(e){

<script>
// Sahneden çıkış: ESC + görünür bağlantı (2026-08-05 geri bildirimi).
(function () {
  var ETIKET = { tr: "Sahneler", en: "Scenes", pt: "Cenas" };
  var dil = "tr";
  try { var d = localStorage.getItem("dost-lang"); if (ETIKET[d]) dil = d; } catch (e) {}

  var a = document.createElement("a");
  a.className = "sahne-geri";
  a.href = "sahneler/";          // sahneler kökte, önizlemede de doğru çözülür
  a.textContent = "← " + ETIKET[dil];
  a.setAttribute("aria-label", ETIKET[dil]);
  document.body.appendChild(a);

  function geriGit() {
    // Aynı siteden geldiysek geçmiş doğru olan: bir önceki SAHNEYE döner.
    // Doğrudan bu adrese gelindiyse (referrer yok / dış site / yeni sekme)
    // galeriye gider -- history.back() orada ya hiçbir şey yapmaz ya da
    // kullanıcıyı siteden ATAR.
    try {
      if (document.referrer && history.length > 1 &&
          new URL(document.referrer).origin === location.origin) {
        history.back();
        return;
      }
    } catch (e) {}
    location.href = "sahneler/";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var el = document.activeElement;
    // Metin/kaydırıcı odaktayken ESC'i çalma -- orada kendi anlamı var.
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    e.preventDefault();
    geriGit();
  });
})();
</script>
</body>
